<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f13">
<title>아케이드 게임 - 교사용</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="admin">
  <header class="admin-header">
    <h1>교사용 화면</h1>
    <span id="status-badge" class="badge">대기 중</span>
    <span id="count-badge" class="badge">0명 접속</span>
  </header>

  <div class="controls">
    <button id="start-btn">게임 시작</button>
    <button id="end-btn">게임 종료</button>
    <button id="reset-btn" class="danger">전체 초기화</button>
  </div>

  <section id="waiting-panel">
    <h2>대기자 명단</h2>
    <ul id="waiting-list"></ul>
    <p id="waiting-empty" class="empty-note">아직 입장한 학생이 없습니다.</p>
  </section>

  <section id="live-panel" class="hidden">
    <h2>실시간 플레이 현황</h2>
    <div id="live-grid"></div>
  </section>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="shared.js"></script>
<script>
(function () {
  const CELL = 6; // 미니 보드 한 칸 크기(px)

  const sessionStatusRef = db.ref('session/status');
  const playersRef = db.ref('players');

  const liveGrid = document.getElementById('live-grid');
  const waitingList = document.getElementById('waiting-list');
  const waitingEmpty = document.getElementById('waiting-empty');
  const statusBadge = document.getElementById('status-badge');
  const countBadge = document.getElementById('count-badge');

  const cardByPlayer = {};

  document.getElementById('start-btn').addEventListener('click', () => {
    sessionStatusRef.set('playing');
  });
  document.getElementById('end-btn').addEventListener('click', () => {
    sessionStatusRef.set('ended');
  });
  document.getElementById('reset-btn').addEventListener('click', () => {
    if (!confirm('모든 참가자 명단을 지우고 새로 시작할까요?')) return;
    playersRef.remove();
    sessionStatusRef.set('waiting');
    Object.keys(cardByPlayer).forEach(id => {
      cardByPlayer[id].wrapper.remove();
      delete cardByPlayer[id];
    });
  });

  sessionStatusRef.on('value', snap => {
    const status = snap.val() || 'waiting';
    const labels = { waiting: '대기 중', playing: '진행 중', ended: '종료됨' };
    statusBadge.textContent = labels[status] || status;
    document.getElementById('live-panel').classList.toggle('hidden', status !== 'playing');
    document.getElementById('waiting-panel').classList.toggle('hidden', status === 'playing');
  });

  playersRef.on('value', snap => {
    const players = snap.val() || {};
    countBadge.textContent = Object.keys(players).length + '명 접속';
    renderWaitingList(players);
    renderLiveGrid(players);
  });

  function renderWaitingList(players) {
    const entries = Object.entries(players);
    waitingList.innerHTML = '';
    waitingEmpty.classList.toggle('hidden', entries.length > 0);
    entries.forEach(([id, p]) => {
      const li = document.createElement('li');
      li.textContent = p.nickname || '(이름 없음)';
      waitingList.appendChild(li);
    });
  }

  function renderLiveGrid(players) {
    const ids = Object.keys(players);

    Object.keys(cardByPlayer).forEach(id => {
      if (!ids.includes(id)) {
        cardByPlayer[id].wrapper.remove();
        delete cardByPlayer[id];
      }
    });

    ids.forEach(id => {
      const p = players[id];
      if (!cardByPlayer[id]) {
        const wrapper = document.createElement('div');
        wrapper.className = 'player-card';
        const name = document.createElement('div');
        name.className = 'player-name';
        const canvas = document.createElement('canvas');
        canvas.width = TETRIS_COLS * CELL;
        canvas.height = TETRIS_ROWS * CELL;
        const score = document.createElement('div');
        score.className = 'player-score';
        wrapper.appendChild(name);
        wrapper.appendChild(canvas);
        wrapper.appendChild(score);
        liveGrid.appendChild(wrapper);
        cardByPlayer[id] = {
          wrapper: wrapper,
          ctx: canvas.getContext('2d'),
          nameEl: name,
          scoreEl: score
        };
      }
      const card = cardByPlayer[id];
      card.nameEl.textContent = p.nickname || '(이름 없음)';
      card.scoreEl.textContent = (p.score || 0) + '점';
      card.wrapper.classList.toggle('over', p.status === 'gameover');
      if (p.board) {
        drawBoardGrid(card.ctx, rowsToBoard(p.board), CELL);
      }
    });

    // 점수 높은 순으로 카드 정렬
    const sorted = ids.slice().sort((a, b) => (players[b].score || 0) - (players[a].score || 0));
    sorted.forEach(id => {
      if (cardByPlayer[id]) liveGrid.appendChild(cardByPlayer[id].wrapper);
    });
  }
})();
</script>
</body>
</html>
