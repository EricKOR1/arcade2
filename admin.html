<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1016">
<title>교사용 대시보드</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="admin">

  <div class="admin-top">
    <h1>아케이드</h1>
    <span class="pill" id="status-pill"><span class="dot"></span><span id="status-text">게임 선택</span></span>
    <span class="pill" id="count-pill">0명 접속</span>
  </div>
  <p class="admin-sub" id="admin-sub">플레이할 게임을 고르면 학생용 QR이 만들어집니다.</p>

  <!-- 1단계 -->
  <section id="select-panel">
    <div id="game-list"></div>
  </section>

  <!-- 2단계 -->
  <section id="lobby-panel" class="hidden">
    <div class="session-layout">
      <div class="qr-card">
        <p class="k">학생들이 이 QR을 찍으면 입장합니다</p>
        <div id="qr-canvas"></div>
        <p class="qr-url" id="qr-url"></p>
      </div>
      <div>
        <div class="controls">
          <button id="start-btn">게임 시작</button>
          <button id="back-btn" class="ghost">게임 바꾸기</button>
          <button id="reset-btn" class="danger">명단 비우기</button>
        </div>
        <h2 class="section-h">입장한 학생</h2>
        <ul id="waiting-list"></ul>
        <p id="waiting-empty" class="empty-note">아직 입장한 학생이 없습니다</p>
      </div>
    </div>
  </section>

  <!-- 3단계 -->
  <section id="live-panel" class="hidden">
    <div class="controls">
      <button id="end-btn" class="danger">게임 종료</button>
    </div>
    <div id="live-grid"></div>
  </section>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="firebase-config.js"></script>
<script src="shared.js"></script>
<script src="tetris-engine.js"></script>
<script src="racing-engine.js"></script>
<script src="games.js"></script>
<script>
(function () {
  const CELL_BY_GAME = { tetris: 6, racing: 11 };

  const sessionRef = db.ref('session');
  const sessionStatusRef = db.ref('session/status');
  const playersRef = db.ref('players');

  const selectPanel = document.getElementById('select-panel');
  const lobbyPanel = document.getElementById('lobby-panel');
  const livePanel = document.getElementById('live-panel');
  const gameList = document.getElementById('game-list');
  const liveGrid = document.getElementById('live-grid');
  const waitingList = document.getElementById('waiting-list');
  const waitingEmpty = document.getElementById('waiting-empty');
  const statusPill = document.getElementById('status-pill');
  const statusText = document.getElementById('status-text');
  const countPill = document.getElementById('count-pill');
  const adminSub = document.getElementById('admin-sub');

  const cardByPlayer = {};
  let currentGameId = null;

  // ── 게임 선택 카드 ──
  Object.keys(GAMES).forEach(id => {
    const g = GAMES[id];
    const btn = document.createElement('button');
    btn.className = 'game-card';
    btn.style.setProperty('--card-accent', g.accent);
    btn.style.setProperty('--card-accent-soft', g.accentSoft);
    const n = document.createElement('div'); n.className = 'gname'; n.textContent = g.name;
    const d = document.createElement('div'); d.className = 'gdesc'; d.textContent = g.desc;
    const m = document.createElement('div'); m.className = 'gmeta'; m.textContent = g.meta;
    btn.appendChild(n); btn.appendChild(d); btn.appendChild(m);
    btn.addEventListener('click', () => openLobby(id));
    gameList.appendChild(btn);
  });

  function clearCards() {
    Object.keys(cardByPlayer).forEach(id => {
      cardByPlayer[id].wrapper.remove();
      delete cardByPlayer[id];
    });
  }

  function studentUrl(gameId) {
    const base = location.href.replace(/admin\.html.*$/, '');
    return base + 'index.html?game=' + gameId;
  }

  function openLobby(gameId) {
    currentGameId = gameId;
    clearCards();
    playersRef.remove();
    sessionRef.set({ game: gameId, status: 'waiting' });
    renderQR(gameId);
  }

  function renderQR(gameId) {
    const url = studentUrl(gameId);
    const box = document.getElementById('qr-canvas');
    box.innerHTML = '';
    new QRCode(box, { text: url, width: 210, height: 210, correctLevel: QRCode.CorrectLevel.M });
    document.getElementById('qr-url').textContent = url;
  }

  document.getElementById('start-btn').addEventListener('click', () => sessionStatusRef.set('playing'));
  document.getElementById('end-btn').addEventListener('click', () => sessionStatusRef.set('ended'));
  document.getElementById('back-btn').addEventListener('click', () => {
    sessionRef.set({ game: null, status: 'idle' });
    playersRef.remove();
  });
  document.getElementById('reset-btn').addEventListener('click', () => {
    if (!confirm('입장한 학생 명단을 비울까요?')) return;
    playersRef.remove();
  });

  // ── 상태에 따른 화면 전환 ──
  sessionRef.on('value', snap => {
    const s = snap.val() || {};
    const status = s.status || 'idle';
    if (s.game && s.game !== currentGameId) { currentGameId = s.game; clearCards(); }
    if (currentGameId) applyAccent(currentGameId);

    const gname = currentGameId && GAMES[currentGameId] ? GAMES[currentGameId].name : '';
    const labels = { idle: '게임 선택', waiting: '입장 대기 중', playing: '진행 중', ended: '종료됨' };
    const subs = {
      idle: '플레이할 게임을 고르면 학생용 QR이 만들어집니다.',
      waiting: gname + ' — 학생들이 QR로 입장하는 중입니다.',
      playing: gname + ' — 모든 학생의 화면을 실시간으로 보고 있습니다.',
      ended: gname + ' — 게임이 끝났습니다. 다시 시작하거나 게임을 바꿀 수 있습니다.'
    };
    statusText.textContent = labels[status] || status;
    statusPill.classList.toggle('on', status === 'playing' || status === 'waiting');
    adminSub.textContent = subs[status] || '';

    selectPanel.classList.toggle('hidden', status !== 'idle');
    lobbyPanel.classList.toggle('hidden', !(status === 'waiting' || status === 'ended'));
    livePanel.classList.toggle('hidden', status !== 'playing');

    if ((status === 'waiting' || status === 'ended') && currentGameId &&
        !document.querySelector('#qr-canvas img, #qr-canvas canvas')) {
      renderQR(currentGameId);
    }
  });

  // ── 참가자 ──
  playersRef.on('value', snap => {
    const players = snap.val() || {};
    countPill.textContent = Object.keys(players).length + '명 접속';
    renderWaitingList(players);
    renderLiveGrid(players);
  });

  function renderWaitingList(players) {
    const entries = Object.entries(players);
    waitingList.innerHTML = '';
    waitingEmpty.classList.toggle('hidden', entries.length > 0);
    entries.forEach(([id, p]) => {
      const name = p.nickname || '?';
      const li = document.createElement('li');
      const av = document.createElement('span');
      av.className = 'av';
      av.textContent = name.charAt(0);
      const label = document.createElement('span');
      label.textContent = name;
      li.appendChild(av); li.appendChild(label);
      waitingList.appendChild(li);
    });
  }

  function renderLiveGrid(players) {
    const ids = Object.keys(players);
    const def = GAMES[currentGameId] || GAMES.tetris;
    const cs = CELL_BY_GAME[currentGameId] || 6;

    Object.keys(cardByPlayer).forEach(id => {
      if (ids.indexOf(id) === -1) {
        cardByPlayer[id].wrapper.remove();
        delete cardByPlayer[id];
      }
    });

    ids.forEach(id => {
      const p = players[id];
      if (!cardByPlayer[id]) {
        const wrapper = document.createElement('div');
        wrapper.className = 'player-card';
        const badge = document.createElement('div');
        badge.className = 'rank-badge hidden';
        const name = document.createElement('div');
        name.className = 'player-name';
        const canvas = document.createElement('canvas');
        canvas.width = def.cols * cs;
        canvas.height = def.rows * cs;
        const score = document.createElement('div');
        score.className = 'player-score num';
        wrapper.appendChild(badge); wrapper.appendChild(name);
        wrapper.appendChild(canvas); wrapper.appendChild(score);
        liveGrid.appendChild(wrapper);
        cardByPlayer[id] = {
          wrapper: wrapper, badge: badge, ctx: canvas.getContext('2d'),
          nameEl: name, scoreEl: score
        };
      }
      const card = cardByPlayer[id];
      card.nameEl.textContent = p.nickname || '(이름 없음)';
      card.scoreEl.textContent = (p.score || 0);
      card.wrapper.classList.toggle('over', p.status === 'gameover');
      if (p.board) drawBoardGrid(card.ctx, rowsToBoard(p.board), cs);
    });

    // 점수순 정렬 + 1~3등 배지
    const sorted = ids.slice().sort((a, b) => (players[b].score || 0) - (players[a].score || 0));
    sorted.forEach((id, i) => {
      const card = cardByPlayer[id];
      if (!card) return;
      liveGrid.appendChild(card.wrapper);
      const isTop = i < 3 && ids.length > 1;
      card.badge.classList.toggle('hidden', !isTop);
      card.wrapper.classList.toggle('top', i === 0 && ids.length > 1);
      if (isTop) card.badge.textContent = (i + 1) + '등';
    });
  }
})();
</script>
</body>
</html>
