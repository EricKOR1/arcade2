<!doctype html>
<html lang="ko" data-theme="dim">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2027">
<title>교사용 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-base-100 text-base-content">
<div class="admin">

  <div class="admin-top">
    <h1>아케이드</h1>
    <span class="badge badge-lg" id="status-badge">게임 선택</span>
    <span class="badge badge-lg badge-ghost" id="count-badge">0명 접속</span>
  </div>
  <p class="admin-sub" id="admin-sub">플레이할 게임을 고르면 학생용 QR이 만들어집니다.</p>

  <!-- 1단계: 게임 선택 -->
  <section id="select-panel">
    <div id="game-list"></div>
  </section>

  <!-- 1-2단계: 트랙 선택 -->
  <section id="track-panel" class="hidden">
    <div class="controls"><button id="track-back" class="btn btn-ghost btn-sm">← 게임 선택으로</button></div>
    <h2 class="section-h">트랙을 고르세요</h2>
    <div id="track-list"></div>
  </section>

  <!-- 2단계: QR + 대기실 -->
  <section id="lobby-panel" class="hidden">
    <div class="session-layout">
      <div class="card bg-base-200 shadow">
        <div class="card-body items-center text-center p-6">
          <p class="text-sm opacity-60 mb-2">학생들이 이 QR을 찍으면 입장합니다</p>
          <div id="qr-canvas"></div>
          <p class="qr-url" id="qr-url"></p>
        </div>
      </div>
      <div>
        <div class="controls">
          <button id="start-btn" class="btn btn-primary">게임 시작</button>
          <button id="back-btn" class="btn btn-ghost">게임 바꾸기</button>
          <button id="reset-btn" class="btn btn-outline btn-error">명단 비우기</button>
        </div>
        <h2 class="section-h">입장한 학생</h2>
        <ul id="waiting-list"></ul>
        <p id="waiting-empty" class="empty-note">아직 입장한 학생이 없습니다</p>
      </div>
    </div>
  </section>

  <!-- 3단계: 진행 중 -->
  <section id="live-panel" class="hidden">
    <div class="controls"><button id="end-btn" class="btn btn-outline btn-error">게임 종료</button></div>
    <!-- 테트리스: 학생별 미니 보드 -->
    <div id="live-grid"></div>
    <!-- 카트: 전체 맵 관전 -->
    <div id="spectate" class="spectate hidden">
      <canvas id="spectate-canvas"></canvas>
      <div>
        <h2 class="section-h">실시간 순위</h2>
        <ul id="standings"></ul>
      </div>
    </div>
  </section>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="firebase-config.js"></script>
<script src="shared.js"></script>
<script src="tetris-engine.js"></script>
<script src="racing-engine.js"></script>
<script src="games.js"></script>
<script>
(function () {
  const CELL = { tetris: 6 };

  const sessionRef  = db.ref('session');
  const statusRef   = db.ref('session/status');
  const playersRef  = db.ref('players');
  const posRef      = db.ref('pos');
  const hazardsRef  = db.ref('hazards');
  const eventsRef   = db.ref('events');
  const finishRef   = db.ref('finishCount');

  const $ = id => document.getElementById(id);
  const selectPanel = $('select-panel'), trackPanel = $('track-panel');
  const lobbyPanel = $('lobby-panel'), livePanel = $('live-panel');
  const liveGrid = $('live-grid'), spectate = $('spectate');

  const cardByPlayer = {};
  const names = {}, peerPos = {};
  let currentGameId = null, currentTrack = null;
  let specTrack = null, specTrackId = null, specRaf = null;

  // 학생이 달리는 트랙을 별도로 구독 — 다른 상태 갱신 순서와 무관하게 항상 일치시킴
  db.ref('session/track').on('value', snap => {
    const tk = snap.val();
    if (tk && TRACKS[tk]) { currentTrack = tk; ensureSpecTrack(); }
  });

  function ensureSpecTrack() {
    if (!currentTrack || specTrackId === currentTrack) return;
    specTrackId = currentTrack;
    specTrack = new Track(TRACKS[currentTrack]);
  }

  // ── 게임 선택 카드 ──
  Object.keys(GAMES).forEach(id => {
    const g = GAMES[id];
    const el = document.createElement('div');
    el.className = 'card bg-base-200 shadow game-card';
    el.style.setProperty('--gc', g.hex);
    el.innerHTML = '<div class="card-body p-6">' +
      '<h3 class="card-title text-lg"></h3>' +
      '<p class="text-sm opacity-60 leading-relaxed"></p>' +
      '<div class="card-actions mt-3"><span class="badge badge-outline"></span></div></div>';
    el.querySelector('.card-title').textContent = g.name;
    el.querySelector('p').textContent = g.desc;
    el.querySelector('.badge').textContent = g.meta;
    el.addEventListener('click', () => chooseGame(id));
    $('game-list').appendChild(el);
  });

  // ── 트랙 선택 카드 ──
  Object.keys(TRACKS).forEach(id => {
    const t = TRACKS[id];
    const el = document.createElement('div');
    el.className = 'card bg-base-200 shadow track-card';
    el.innerHTML = '<div class="card-body p-5"><h3 class="card-title text-base"></h3>' +
                   '<p class="text-sm opacity-60"></p>' +
                   '<div class="track-meta"><span class="badge badge-sm badge-outline"></span>' +
                   '<span class="track-spec"></span></div></div>';
    el.querySelector('.card-title').textContent = t.name;
    el.querySelector('p').textContent = t.desc;
    el.querySelector('.badge').textContent = t.tag || '';
    const tk = new Track(t);
    el.querySelector('.track-spec').textContent =
      '길이 ' + (tk.length/1000).toFixed(1) + 'k · 폭 ' + t.width
      + ' · ' + t.laps + '바퀴 · 출발 ' + tk.perRow + '열';
    el.addEventListener('click', () => openLobby('kart', id));
    $('track-list').appendChild(el);
  });
  $('track-back').addEventListener('click', () => {
    trackPanel.classList.add('hidden');
    selectPanel.classList.remove('hidden');
  });

  function chooseGame(id) {
    if (GAMES[id].hasTracks) {
      currentGameId = id;
      applyAccent(id);
      selectPanel.classList.add('hidden');
      trackPanel.classList.remove('hidden');
    } else {
      openLobby(id, null);
    }
  }

  function clearCards() {
    Object.keys(cardByPlayer).forEach(id => { cardByPlayer[id].wrapper.remove(); delete cardByPlayer[id]; });
  }

  function studentUrl(gameId) {
    return location.href.replace(/admin\.html.*$/, '') + 'index.html?game=' + gameId;
  }

  function openLobby(gameId, trackId) {
    currentGameId = gameId;
    if (trackId) currentTrack = trackId;
    clearCards();
    Object.keys(peerPos).forEach(k => delete peerPos[k]);
    playersRef.remove(); posRef.remove(); hazardsRef.remove(); eventsRef.remove();
    finishRef.set(0);
    trackPanel.classList.add('hidden');
    sessionRef.set({ game: gameId, status: 'waiting', track: currentTrack });
    renderQR(gameId);
  }

  function renderQR(gameId) {
    const url = studentUrl(gameId);
    const box = $('qr-canvas');
    box.innerHTML = '';
    new QRCode(box, { text: url, width: 208, height: 208, correctLevel: QRCode.CorrectLevel.M });
    $('qr-url').textContent = url;
  }

  $('start-btn').addEventListener('click', () => statusRef.set('playing'));
  $('end-btn').addEventListener('click', () => statusRef.set('ended'));
  $('back-btn').addEventListener('click', () => {
    sessionRef.set({ game: null, status: 'idle' });
    playersRef.remove(); posRef.remove(); hazardsRef.remove(); eventsRef.remove();
  });
  $('reset-btn').addEventListener('click', () => {
    if (!confirm('입장한 학생 명단을 비울까요?')) return;
    playersRef.remove(); posRef.remove();
  });

  // ── 상태 전환 ──
  sessionRef.on('value', snap => {
    const s = snap.val() || {};
    const status = s.status || 'idle';
    if (s.game && s.game !== currentGameId) { currentGameId = s.game; clearCards(); }
    if (s.track && TRACKS[s.track]) { currentTrack = s.track; ensureSpecTrack(); }
    if (currentGameId) applyAccent(currentGameId);

    const g = GAMES[currentGameId];
    const gname = g ? g.name : '';
    const labels = { idle: '게임 선택', waiting: '입장 대기 중', playing: '진행 중', ended: '종료됨' };
    const subs = {
      idle: '플레이할 게임을 고르면 학생용 QR이 만들어집니다.',
      waiting: gname + ' — 학생들이 QR로 입장하는 중입니다.',
      playing: gname + ' — 실시간으로 지켜보는 중입니다.',
      ended: gname + ' — 종료됐습니다. 다시 시작하거나 게임을 바꿀 수 있습니다.'
    };
    const badge = $('status-badge');
    badge.textContent = labels[status] || status;
    badge.className = 'badge badge-lg ' + (status === 'playing' ? 'badge-primary' : 'badge-ghost');
    $('admin-sub').textContent = subs[status] || '';

    selectPanel.classList.toggle('hidden', status !== 'idle' || !trackPanel.classList.contains('hidden'));
    lobbyPanel.classList.toggle('hidden', !(status === 'waiting' || status === 'ended'));
    livePanel.classList.toggle('hidden', status !== 'playing');

    const shared = g && g.adminView === 'shared';
    liveGrid.classList.toggle('hidden', !!shared);
    spectate.classList.toggle('hidden', !shared);

    if (status === 'playing' && shared) startSpectate();
    else stopSpectate();

    if ((status === 'waiting' || status === 'ended') && currentGameId &&
        !document.querySelector('#qr-canvas img, #qr-canvas canvas')) renderQR(currentGameId);
  });

  // ── 참가자 ──
  playersRef.on('value', snap => {
    const players = snap.val() || {};
    Object.keys(players).forEach(id => { names[id] = players[id].nickname || ''; });
    $('count-badge').textContent = Object.keys(players).length + '명 접속';
    renderWaiting(players);
    const g = GAMES[currentGameId];
    if (!g || g.adminView !== 'shared') renderGrid(players);
  });

  function renderWaiting(players) {
    const list = $('waiting-list');
    const ids = Object.keys(players);
    list.innerHTML = '';
    $('waiting-empty').classList.toggle('hidden', ids.length > 0);
    ids.forEach(id => {
      const name = players[id].nickname || '?';
      const li = document.createElement('li');
      li.className = 'flex items-center gap-3 bg-base-200 rounded-full pl-2 pr-5 py-2';
      li.innerHTML = '<div class="avatar placeholder"><div class="bg-primary text-primary-content rounded-full w-8">' +
                     '<span class="text-sm font-bold"></span></div></div><span class="font-medium text-sm"></span>';
      li.querySelector('span.text-sm.font-bold').textContent = name.charAt(0);
      li.querySelector('span.font-medium').textContent = name;
      list.appendChild(li);
    });
  }

  // ── 테트리스: 학생별 미니 보드 ──
  function renderGrid(players) {
    const ids = Object.keys(players);
    const g = GAMES[currentGameId] || GAMES.tetris;
    const cs = CELL[currentGameId] || 6;
    Object.keys(cardByPlayer).forEach(id => {
      if (ids.indexOf(id) === -1) { cardByPlayer[id].wrapper.remove(); delete cardByPlayer[id]; }
    });
    ids.forEach(id => {
      const p = players[id];
      if (!cardByPlayer[id]) {
        const wrapper = document.createElement('div');
        wrapper.className = 'player-card';
        const badge = document.createElement('div'); badge.className = 'rank-badge hidden';
        const name = document.createElement('div'); name.className = 'player-name';
        const canvas = document.createElement('canvas');
        canvas.width = g.grid.cols * cs; canvas.height = g.grid.rows * cs;
        const score = document.createElement('div'); score.className = 'player-score num';
        wrapper.append(badge, name, canvas, score);
        liveGrid.appendChild(wrapper);
        cardByPlayer[id] = { wrapper, badge, ctx: canvas.getContext('2d'), nameEl: name, scoreEl: score };
      }
      const c = cardByPlayer[id];
      c.nameEl.textContent = p.nickname || '(이름 없음)';
      c.scoreEl.textContent = p.score || 0;
      c.wrapper.classList.toggle('over', p.status === 'gameover');
      if (p.board) drawBoardGrid(c.ctx, rowsToBoard(p.board), cs);
    });
    const sorted = ids.slice().sort((a, b) => (players[b].score || 0) - (players[a].score || 0));
    sorted.forEach((id, i) => {
      const c = cardByPlayer[id]; if (!c) return;
      liveGrid.appendChild(c.wrapper);
      const top = i < 3 && ids.length > 1;
      c.badge.classList.toggle('hidden', !top);
      c.wrapper.classList.toggle('top', i === 0 && ids.length > 1);
      if (top) c.badge.textContent = (i + 1) + '등';
    });
  }

  // ── 카트: 전체 맵 관전 ──
  function startSpectate() {
    if (specRaf) return;
    ensureSpecTrack();
    posRef.on('child_added',   s => setPos(s.key, s.val()));
    posRef.on('child_changed', s => setPos(s.key, s.val()));
    posRef.on('child_removed', s => { delete peerPos[s.key]; renderStandings(); });
    hazardsRef.on('value', s => { peerPos.__hz = s.val() || {}; });
    const canvas = $('spectate-canvas');
    const draw = () => { drawSpectate(canvas); specRaf = requestAnimationFrame(draw); };
    specRaf = requestAnimationFrame(draw);
  }

  function stopSpectate() {
    if (!specRaf) return;
    cancelAnimationFrame(specRaf); specRaf = null;
    posRef.off(); hazardsRef.off();
  }

  window.addEventListener('resize', () => { /* drawSpectate가 매 프레임 스스로 맞춤 */ });
  function setPos(id, raw) {
    if (!raw) return;
    const a = String(raw).split(',');
    const fl = +a[5] || 0;
    peerPos[id] = { x: +a[0], y: +a[1], angle: +a[2], lap: +a[3], progress: +a[4],
                    spin: !!(fl & 1), shield: !!(fl & 2), boost: !!(fl & 4),
                    finished: a[6] === '1' };
    renderStandings();
  }

  function renderStandings() {
    const ids = Object.keys(peerPos).filter(k => k !== '__hz');
    ids.sort((a, b) => (peerPos[b].progress || 0) - (peerPos[a].progress || 0));
    const ul = $('standings');
    ul.innerHTML = '';
    ids.forEach((id, i) => {
      const p = peerPos[id];
      const li = document.createElement('li');
      if (p.finished) li.className = 'done';
      const r = document.createElement('span'); r.className = 'r'; r.textContent = (i + 1) + '.';
      const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = names[id] || '?';
      const lp = document.createElement('span'); lp.className = 'lp';
      const totalLaps = specTrack ? specTrack.laps : 3;
      lp.textContent = p.finished ? '완주'
        : (Math.min((p.lap || 0) + 1, totalLaps) + '/' + totalLaps + '바퀴'
           + (p.shield ? ' 🛡' : '') + (p.boost ? ' ⚡' : ''));
      li.append(r, nm, lp);
      ul.appendChild(li);
    });
  }

  function drawSpectate(canvas) {
    const t = specTrack; if (!t) return;
    if (!t.sprite) t.buildSprite(0.62);
    const b = t.bounds;
    const worldW = (b.maxX - b.minX) + t.def.width;
    const worldH = (b.maxY - b.minY) + t.def.width;

    // 캔버스 자체 크기를 기준으로 매 프레임 맞춤 (부모 폭을 쓰면 그리드에서 어긋남)
    const cssW = canvas.clientWidth;
    if (!cssW) return;
    const cssH = Math.round(Math.min(cssW * (worldH / worldW), window.innerHeight * 0.72));
    const dpr = window.devicePixelRatio || 1;
    if (canvas.width !== Math.round(cssW * dpr) || canvas.height !== Math.round(cssH * dpr)) {
      canvas.style.height = cssH + 'px';
      canvas.width = Math.round(cssW * dpr);
      canvas.height = Math.round(cssH * dpr);
    }
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const W = cssW, H = cssH;

    const pad = 16;
    const sc = Math.min((W - pad*2) / worldW, (H - pad*2) / worldH);
    const ox = (W - (b.maxX - b.minX) * sc) / 2 - b.minX * sc;
    const oy = (H - (b.maxY - b.minY) * sc) / 2 - b.minY * sc;

    ctx.fillStyle = t.def.bg; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.translate(ox, oy); ctx.scale(sc, sc);

    // 트랙(연석 · 방향 화살표 · 부스터 패드 포함)을 미리 그려둔 이미지로
    const sp = t.sprite;
    ctx.drawImage(sp.canvas, sp.x, sp.y, sp.w, sp.h);

    // 바나나
    const hz = peerPos.__hz || {};
    Object.keys(hz).forEach(k => {
      ctx.fillStyle = '#FFD166';
      ctx.beginPath(); ctx.arc(hz[k].x, hz[k].y, 13 * t.carScale, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#8A6D1F'; ctx.lineWidth = 2.5 * t.carScale; ctx.stroke();
    });

    // 카트 (뒤에서부터 그려 1등이 위로)
    const accent = (getComputedStyle(document.documentElement)
                     .getPropertyValue('--game-hex') || '#F5A524').trim();
    const ids = Object.keys(peerPos).filter(k => k !== '__hz');
    ids.sort((a, b2) => (peerPos[a].progress || 0) - (peerPos[b2].progress || 0));
    ids.forEach((id, i) => {
      const p = peerPos[id];
      const leader = (i === ids.length - 1) && ids.length > 1;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.angle); ctx.scale(t.carScale, t.carScale);
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath(); ctx.ellipse(0, 6, 21, 13, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = p.finished ? '#565D6E' : (leader ? accent : '#EF476F');
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(-20, -13, 40, 26, 8); else ctx.rect(-20, -13, 40, 26);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(4, -9, 12, 18, 4); else ctx.rect(4, -9, 12, 18);
      ctx.fill();
      ctx.restore();
      if (p.shield) {
        ctx.save(); ctx.translate(p.x, p.y); ctx.scale(t.carScale, t.carScale);
        ctx.strokeStyle = 'rgba(6,214,160,0.85)'; ctx.lineWidth = 3.5;
        ctx.beginPath(); ctx.arc(0, 0, 29, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
      }
      const nm = names[id] || '';
      if (nm) {
        ctx.save();
        const fs = 13 / sc;                       // 화면에서 항상 13px로 보이게
        ctx.font = '700 ' + fs.toFixed(1) + 'px Pretendard, sans-serif';
        ctx.textAlign = 'center';
        const tw = ctx.measureText(nm).width + fs * 0.9;
        const off = t.carLen * 0.7 + fs;
        ctx.fillStyle = leader ? accent : 'rgba(12,15,22,0.82)';
        if (ctx.roundRect) {
          ctx.beginPath();
          ctx.roundRect(p.x - tw / 2, p.y - off - fs, tw, fs * 1.5, fs * 0.35);
          ctx.fill();
        }
        ctx.fillStyle = leader ? '#1A1204' : '#EAECF2';
        ctx.fillText(nm, p.x, p.y - off + fs * 0.15);
        ctx.restore();
      }
    });
    ctx.restore();
  }
})();
</script>
</body>
</html>
