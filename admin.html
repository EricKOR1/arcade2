<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f13">
<title>교사용 대시보드</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="admin">

  <header class="admin-header">
    <h1>교사용 대시보드</h1>
    <span id="status-badge" class="badge">게임 선택</span>
    <span id="count-badge" class="badge">0명 접속</span>
  </header>

  <!-- 1단계: 게임 고르기 -->
  <section id="select-panel">
    <h2>게임을 선택하세요</h2>
    <div id="game-list"></div>
  </section>

  <!-- 2단계: QR + 대기실 -->
  <section id="lobby-panel" class="hidden">
    <div class="session-layout">
      <div class="qr-box">
        <p class="qr-hint">학생들이 이 QR을 찍으면 입장합니다</p>
        <div id="qr-canvas"></div>
        <p class="qr-url" id="qr-url"></p>
      </div>
      <div>
        <h2 id="lobby-title">대기자 명단</h2>
        <div class="controls">
          <button id="start-btn">게임 시작</button>
          <button id="back-btn" class="ghost">게임 바꾸기</button>
          <button id="reset-btn" class="danger">명단 비우기</button>
        </div>
        <ul id="waiting-list"></ul>
        <p id="waiting-empty" class="empty-note">아직 입장한 학생이 없습니다.</p>
      </div>
    </div>
  </section>

  <!-- 3단계: 실시간 현황 -->
  <section id="live-panel" class="hidden">
    <h2>실시간 플레이 현황</h2>
    <div class="controls">
      <button id="end-btn" class="danger">게임 종료</button>
    </div>
    <div id="live-grid"></div>
  </section>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="firebase-config.js"></script>
<script src="shared.js"></script>
<script src="tetris-engine.js"></script>
<script src="racing-engine.js"></script>
<script src="games.js"></script>
<script>
(function () {
  const CELL_BY_GAME = { tetris: 6, racing: 11 };

  const sessionRef = db.ref('session');
  const sessionStatusRef = db.ref('session/status');
  const sessionGameRef = db.ref('session/game');
  const playersRef = db.ref('players');

  const selectPanel = document.getElementById('select-panel');
  const lobbyPanel = document.getElementById('lobby-panel');
  const livePanel = document.getElementById('live-panel');
  const gameList = document.getElementById('game-list');
  const liveGrid = document.getElementById('live-grid');
  const waitingList = document.getElementById('waiting-list');
  const waitingEmpty = document.getElementById('waiting-empty');
  const statusBadge = document.getElementById('status-badge');
  const countBadge = document.getElementById('count-badge');

  const cardByPlayer = {};
  let currentGameId = null;
  let qrInstance = null;

  // ── 게임 카드 만들기 ──
  Object.keys(GAMES).forEach(id => {
    const g = GAMES[id];
    const btn = document.createElement('button');
    btn.className = 'game-card';
    btn.innerHTML = '<div class="title"></div><div class="desc"></div>';
    btn.querySelector('.title').textContent = g.name;
    btn.querySelector('.desc').textContent = g.desc;
    btn.addEventListener('click', () => openLobby(id));
    gameList.appendChild(btn);
  });

  function clearCards() {
    Object.keys(cardByPlayer).forEach(id => {
      cardByPlayer[id].wrapper.remove();
      delete cardByPlayer[id];
    });
  }

  function studentUrl(gameId) {
    const base = location.href.replace(/admin\.html.*$/, '');
    return base + 'index.html?game=' + gameId;
  }

  function openLobby(gameId) {
    currentGameId = gameId;
    clearCards();
    playersRef.remove();
    sessionRef.set({ game: gameId, status: 'waiting' });
    renderQR(gameId);
  }

  function renderQR(gameId) {
    const url = studentUrl(gameId);
    const box = document.getElementById('qr-canvas');
    box.innerHTML = '';
    qrInstance = new QRCode(box, {
      text: url,
      width: 220,
      height: 220,
      correctLevel: QRCode.CorrectLevel.M
    });
    document.getElementById('qr-url').textContent = url;
    document.getElementById('lobby-title').textContent =
      (GAMES[gameId] ? GAMES[gameId].name : gameId) + ' — 대기자 명단';
  }

  document.getElementById('start-btn').addEventListener('click', () => {
    sessionStatusRef.set('playing');
  });
  document.getElementById('end-btn').addEventListener('click', () => {
    sessionStatusRef.set('ended');
  });
  document.getElementById('back-btn').addEventListener('click', () => {
    sessionRef.set({ game: null, status: 'idle' });
    playersRef.remove();
  });
  document.getElementById('reset-btn').addEventListener('click', () => {
    if (!confirm('대기자 명단을 비울까요?')) return;
    playersRef.remove();
  });

  // ── 세션 상태에 따라 화면 전환 ──
  sessionRef.on('value', snap => {
    const s = snap.val() || {};
    const status = s.status || 'idle';
    if (s.game && s.game !== currentGameId) { currentGameId = s.game; clearCards(); }

    const labels = { idle: '게임 선택', waiting: '입장 대기 중', playing: '진행 중', ended: '종료됨' };
    statusBadge.textContent = labels[status] || status;
    statusBadge.classList.toggle('live', status === 'playing');

    selectPanel.classList.toggle('hidden', status !== 'idle');
    lobbyPanel.classList.toggle('hidden', !(status === 'waiting' || status === 'ended'));
    livePanel.classList.toggle('hidden', status !== 'playing');

    if ((status === 'waiting' || status === 'ended') && currentGameId && !document.querySelector('#qr-canvas img, #qr-canvas canvas')) {
      renderQR(currentGameId);
    }
  });

  // ── 참가자 목록 감시 ──
  playersRef.on('value', snap => {
    const players = snap.val() || {};
    countBadge.textContent = Object.keys(players).length + '명 접속';
    renderWaitingList(players);
    renderLiveGrid(players);
  });

  function renderWaitingList(players) {
    const entries = Object.entries(players);
    waitingList.innerHTML = '';
    waitingEmpty.classList.toggle('hidden', entries.length > 0);
    entries.forEach(([id, p]) => {
      const li = document.createElement('li');
      li.textContent = p.nickname || '(이름 없음)';
      waitingList.appendChild(li);
    });
  }

  function renderLiveGrid(players) {
    const ids = Object.keys(players);
    const def = GAMES[currentGameId] || GAMES.tetris;

    Object.keys(cardByPlayer).forEach(id => {
      if (ids.indexOf(id) === -1) {
        cardByPlayer[id].wrapper.remove();
        delete cardByPlayer[id];
      }
    });

    ids.forEach(id => {
      const p = players[id];
      if (!cardByPlayer[id]) {
        const wrapper = document.createElement('div');
        wrapper.className = 'player-card';
        const name = document.createElement('div');
        name.className = 'player-name';
        const canvas = document.createElement('canvas');
        const cs = CELL_BY_GAME[currentGameId] || 6;
        canvas.width = def.cols * cs;
        canvas.height = def.rows * cs;
        const score = document.createElement('div');
        score.className = 'player-score';
        wrapper.appendChild(name);
        wrapper.appendChild(canvas);
        wrapper.appendChild(score);
        liveGrid.appendChild(wrapper);
        cardByPlayer[id] = {
          wrapper: wrapper,
          ctx: canvas.getContext('2d'),
          nameEl: name,
          scoreEl: score
        };
      }
      const card = cardByPlayer[id];
      card.nameEl.textContent = p.nickname || '(이름 없음)';
      card.scoreEl.textContent = (p.score || 0) + '점';
      card.wrapper.classList.toggle('over', p.status === 'gameover');
      if (p.board) drawBoardGrid(card.ctx, rowsToBoard(p.board), CELL_BY_GAME[currentGameId] || 6);
    });

    const sorted = ids.slice().sort((a, b) => (players[b].score || 0) - (players[a].score || 0));
    sorted.forEach(id => {
      if (cardByPlayer[id]) liveGrid.appendChild(cardByPlayer[id].wrapper);
    });
  }
})();
</script>
</body>
</html>
