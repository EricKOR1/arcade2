<script>
(function () {
"use strict";

/* ══════════════════════════════════════════════════════════
   소리 — 파일을 쓰지 않고 브라우저가 직접 만들어 냅니다.
   (GAS 에는 음악 파일을 올릴 수 없으므로 이 방법을 씁니다)

   · 브라우저는 학생이 화면을 한 번 누르기 전에는 소리를 내지 않습니다.
     그래서 첫 버튼을 누를 때 소리를 깨웁니다.
   · 교실에서 30대가 동시에 울리면 시끄러우므로
     처음에는 "효과음만" 으로 시작하고, 배경음은 눌러서 켜게 했습니다.
   ══════════════════════════════════════════════════════════ */
var SND = (function () {
"use strict";
var ac = null, mg = null, sg = null;
var level = 1;                    /* 0 끔 · 1 효과음만 · 2 효과음+배경음 */
var ambT = null, ambId = "", pad = [];

try {
  var v = localStorage.getItem("bdSnd");
  if (v !== null) level = Math.max(0, Math.min(2, +v));
} catch (e) {}

function ready() {
  if (ac) return true;
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ac = new AC();
    mg = ac.createGain(); mg.gain.value = .075; mg.connect(ac.destination);   /* 배경음 */
    sg = ac.createGain(); sg.gain.value = .26;  sg.connect(ac.destination);   /* 효과음 */
    return true;
  } catch (e) { ac = null; return false; }
}
/** 첫 버튼을 누를 때 소리를 깨웁니다 */
function unlock() {
  if (!ready()) return;
  try { if (ac.state === "suspended") ac.resume(); } catch (e) {}
}

/* ── 소리 한 조각 ── */
function tone(o) {
  if (!ac || level === 0) return;
  try {
    var t0 = ac.currentTime + (o.at || 0);
    var os = ac.createOscillator(), g = ac.createGain();
    os.type = o.type || "sine";
    os.frequency.setValueAtTime(o.f, t0);
    if (o.to) os.frequency.exponentialRampToValueAtTime(Math.max(20, o.to), t0 + o.d);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(o.v == null ? .5 : o.v, t0 + Math.min(.02, o.d * .3));
    g.gain.exponentialRampToValueAtTime(.0008, t0 + o.d);
    os.connect(g); g.connect(o.bus || sg);
    os.start(t0); os.stop(t0 + o.d + .02);
  } catch (e) {}
}
function hiss(o) {                       /* 바람·거품 같은 소리 */
  if (!ac || level === 0) return;
  try {
    var t0 = ac.currentTime + (o.at || 0), n = Math.floor(ac.sampleRate * o.d);
    var buf = ac.createBuffer(1, n, ac.sampleRate), ch = buf.getChannelData(0);
    for (var i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
    var src = ac.createBufferSource(); src.buffer = buf;
    var f = ac.createBiquadFilter(); f.type = "bandpass";
    f.frequency.setValueAtTime(o.f || 900, t0);
    if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t0 + o.d);
    f.Q.value = o.q || 1.2;
    var g = ac.createGain(); g.gain.setValueAtTime(o.v == null ? .3 : o.v, t0);
    g.gain.exponentialRampToValueAtTime(.0008, t0 + o.d);
    src.connect(f); f.connect(g); g.connect(o.bus || sg);
    src.start(t0); src.stop(t0 + o.d);
  } catch (e) {}
}

  tap:   function () { tone({ f: 620, d: .05, type: "triangle", v: .22 }); },
  good:  function (n) {                       /* 연속으로 맞힐수록 높아집니다 */

  function put(list) {
    list.forEach(function (arr, mi) {
      var M = MODES[mi];
      arr.forEach(function (st) {
        var a = -1, b = -1;
        for (var i = 0; i < M.steps.length; i++) {
          if (M.steps[i].org === st.org) { if (a < 0) a = i; b = i; }
          else if (a >= 0) break;
        }
        if (a < 0) { M.steps.push(st); return; }
        var last = M.steps[b].t;
        M.steps.splice((last === "fork" || last === "time") ? b : b + 1, 0, st);
      });
    });
  }

function bonusStep(dt) {
  var g = S.bonus; if (!g || g.done) return;

      g.nextBeat += g.beat;
      g.items.push({ p: 0, gone: false, pass: 0, bounce: 0, fade: 1 });
      SND.play("beat");
    }
    g.open = Math.max(0, g.open - dt * 4);
    g.items.forEach(function (it) {
      if (it.pass) { it.p += dt / g.beat * 1.6; it.fade -= dt * 2; return; }
      if (it.bounce) { it.p -= dt * 1.2; it.fade -= dt * 2; return; }
      it.p += dt / g.beat;                       /* 한 박자에 판막 도착 */
      if (it.p > 1.28 && !it.gone) { it.gone = true; it.bounce = 1; g.msg = "놓쳤어요"; }

  } else if (g.kind === "lung") {

      if (Math.random() < dt * 14) g.parts.push({ x: 320 + (Math.random() - .5) * 40, y: 8, vy: 80 + Math.random() * 60, kind: "o2", l: 1 });
    } else {

    g.parts.forEach(function (p) { p.y += p.vy * dt; p.l -= dt * .9; });
    g.parts = g.parts.filter(function (p) { return p.l > 0 && p.y > -10 && p.y < 240; });
  } else if (g.kind === "filter") {
    if (g.t >= g.nextSpawn && g.si < g.seq.length) {

      g.items.push({ kind: g.seq[g.si++], x: -30, y: 80 + g.rnd() * 60, gone: false, pass: 0, bounce: 0, leak: 0, fade: 1 });
    }
    g.items.forEach(function (it) {

      if (it.bounce) { it.x -= dt * 220; it.fade -= dt * 1.4; return; }
      it.x += dt * g.speed;

        it.gone = true; it.pass = 1;

      }
    });

  } else {
    if (g.t >= g.nextSpawn && g.si < g.seq.length) {

      g.items.push({ kind: g.seq[g.si++], x: 660, y: 80 + g.rnd() * 60, gone: false, burst: 0, bounce: 0, fade: 1 });
    }

  '<div class="gamebar"><h1 id="bdTitle">–</h1>' +
    '<button id="bdSnd">🔈</button>' +
    '<button id="bdBackSel">모드 선택</button><button id="bdQuit">나가기</button>' +
    '<div class="sub" id="bdSub">–</div></div>' +
  '<div class="bdhud">' +
    '<div class="wide"><span>진행</span><b id="bdProg">0 / 0</b>' +
      '<i class="pb"><s id="bdPb"></s></i></div>' +
    '<div><span>남은 시간</span><b id="bdTime">0:00</b></div>' +
    '<div><span>점수</span><b id="bdScore">0</b></div>' +
    '<div><span>한 번에 정답</span><b id="bdAcc">0</b></div>' +

/* ══════════════════════════════════════════════════════════
   상태
   ══════════════════════════════════════════════════════════ */
var root = null, cv = null, ctx = null, raf = null, timer = null;
var S = null, last = 0, MAPW = 250;
var BEST = {};

function $(id) { return root ? root.querySelector("#" + id) : null; }
function esc(s) { return (App && App.esc) ? App.esc(s) : String(s); }
function fmtT(s) { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2); }

/* 태블릿을 여러 학생이 함께 쓰므로 로그인한 학생별로 기록을 나눠 저장합니다 */
function bestKey() {
  var u = App.user;
  if (u && u.grade != null && u.num != null)
    return "bodyBest_" + u.grade + "-" + u.cls + "-" + u.num;
  return "bodyBest_guest";
}
function loadBest() {
  try { BEST = JSON.parse(localStorage.getItem(bestKey()) || "{}"); } catch (e) { BEST = {}; }
  if (!BEST || typeof BEST !== "object") BEST = {};
}
function saveBest(i, sc) {
  if (!BEST[i] || BEST[i] < sc) BEST[i] = sc;
  try { localStorage.setItem(bestKey(), JSON.stringify(BEST)); } catch (e) {}
}
function tally() {
  var n = 0, sum = 0;
  MODES.forEach(function (m, i) { if (BEST[i]) { n++; sum += BEST[i]; } });
  return { n: n, sum: sum };
}

/** 소리 단추 — 누를 때마다 끔 → 효과음만 → 효과음+배경음 */
function bindSnd(id) {
  var b = $(id); if (!b) return;
  b.title = SND.label();
  b.textContent = ["🔇", "🔈", "🔊"][SND.get()];
  b.onclick = function () {
    var v = SND.cycle();
    b.textContent = ["🔇", "🔈", "🔊"][v];
    b.title = SND.label();
    if (S) SND.ambience(MODES[S.m].id); else if (LOB.mi >= 0) SND.ambience("lobby");
  };
}

/* 1·2·3 = 보기 고르기, Enter/Space = 계속 이동·시작·탭 */
var keyBound = false;
function onKey(e) {
  if (!root || !root.isConnected) return;
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  var k = e.key;
  var go2 = $("bdGo2"), ov = document.getElementById("overlay");
  var start = (ov && !ov.hidden) ? document.getElementById("bdStart") : null;   /* 팝업이 떠 있을 때만 */
  if (k === "Enter" || k === " ") {
    if (start && !start.disabled) { e.preventDefault(); start.click(); return; }
    if (ov && !ov.hidden) return;                     /* 결과 창 등이 떠 있으면 건드리지 않습니다 */
    if (S && S.bonus && !S.bonus.done && S.bonus.t >= 0) {
      e.preventDefault();
      if (S.bonus.kind === "valve") { if (!e.repeat) bonusTap(); }
      else if (S.bonus.kind === "lung") { if (!e.repeat) lungDown(); }
      return;
    }
    if (go2 && !go2.disabled && !S.moving) { e.preventDefault(); go2.click(); return; }
    var now = $("bdNow"); if (now) { e.preventDefault(); now.click(); return; }
  }
  if (/^[1-4]$/.test(k)) {
    if (S && S.bonus && !S.bonus.done) {
      var bb = root.querySelectorAll("#bdBB .benz");
      if (bb[+k - 1]) { e.preventDefault(); bb[+k - 1].dispatchEvent(new Event("pointerdown")); }
      return;
    }
    var bs = root.querySelectorAll("#bdOpts .bdopt");
    var live = [];
    for (var i = 0; i < bs.length; i++) if (!bs[i].disabled) live.push(bs[i]);
    if (live[+k - 1]) { e.preventDefault(); live[+k - 1].click(); }
  }
}
function onKeyUp(e) {
  if ((e.key === "Enter" || e.key === " ") && S && S.bonus && S.bonus.kind === "lung") lungUp();
}

function mount(el) {
  root = el; loadBest(); showSelect();
  if (!keyBound) { document.addEventListener("keydown", onKey); document.addEventListener("keyup", onKeyUp); keyBound = true; }
}

/* ── 모드 고르기 ── */
function showSelect() {
  stopTimers(); LOB.mi = -1; SND.stopAmb();
  if (raf) { cancelAnimationFrame(raf); raf = null; }
  if (timer) { clearInterval(timer); timer = null; }
  S = null; ctx = null; cv = null;
  root.innerHTML = SEL_TPL;
  bindSnd("bdSnd0");
  $("bdQuit0").onclick = App.goHome;
  var t = tally();
  $("bdSel").innerHTML = MODES.map(function (m, i) {
    var b = BEST[i] || 0;
    var orgs = [], last = null;
    m.steps.forEach(function (st) { if (st.org !== last) { orgs.push(st.org); last = st.org; } });
    return '<div class="bdcard" data-i="' + i + '" style="--acc:' + m.acc + '">' +
      (b > 0 ? '<div class="clear">완료 ' + b + '점</div>' : '') +
      '<div class="bdemo">' + m.emoji + '</div>' +
      '<h3>' + m.name + ' — ' + m.sub + '</h3>' +
      '<p>' + m.desc + '</p>' +
      '<div class="route"><span>여정</span>' + esc(orgs.join(" → ")) + '</div>' +
      '<div class="bdstat">' +
        '<div><span>내 최고</span><b>' + b + '</b></div>' +
        '<div><span>한 판</span><b>' + pickCount(m) + '</b></div>' +
        '<div><span>문항 은행</span><b>' + m.steps.length + '</b></div>' +
      '</div></div>';
  }).join("") +
    '<div class="bdbuild">' + BUILD + '</div>';
  $("bdDone").textContent = t.n + " / 4";
  $("bdBar").style.width = (t.n / 4 * 100) + "%";
  $("bdSum").textContent = t.sum;
  var left = MODES.filter(function (m, i) { return !BEST[i]; }).map(function (m) { return m.name; });
  $("bdNote").innerHTML = (t.n >= 4)
    ? '🏆 네 모드를 모두 완주했습니다. <b>종합 점수 ' + t.sum + '점</b>으로 종합 순위에 올라 있어요. 다시 도전해 점수를 올리면 종합 점수도 함께 올라갑니다.'
    : '종합 순위는 <b>네 모드를 모두 완주해야</b> 매겨집니다. 아직 <b>' + left.join(", ") + '</b>이(가) 남았어요.';
  Array.prototype.forEach.call(root.querySelectorAll(".bdcard"), function (c) {
    c.onclick = function () { askMode(+c.dataset.i); };
  });
}


/** 혼자 할지, 반 친구들과 대결할지 고르기 */
function askMode(mi) {
  var M = MODES[mi];
  var orgs0 = [], lo = null;
  M.steps.forEach(function (st) { if (st.org !== lo) { orgs0.push(st.org); lo = st.org; } });
  var sc0 = sceneOf(mi, orgs0[0]);
  App.overlay('<h2>' + M.emoji + ' ' + M.name + '</h2>' +
    '<p>' + M.desc + '</p>' +
    (sc0 ? '<div class="learnbox" style="margin:0 0 14px">🎬 <b>' + esc(sc0[0]) + '</b><br>' +
      '<span style="font-size:12.5px">' + esc(sc0[1]) + '</span></div>' : '') +
    '<div class="learnbox" style="margin:0 0 14px;font-size:12.5px">🗺 <b>여정</b><br>' +
      esc(orgs0.join(" → ")) + '</div>' +
    '<div class="btns" style="flex-direction:column;align-items:stretch">' +
    '<button class="primary" id="bdSolo" style="padding:15px">혼자 하기 — 바로 시작</button>' +
    '<button id="bdVs" style="padding:15px">🏁 대결 참가 — 선생님이 시작</button>' +
    '<button id="bdCancel">뒤로</button></div>' +
    '<div class="learnbox" style="margin:14px 0 0">대결에 참가하면 대기실에서 기다렸다가 ' +
    '반 친구들과 <b>동시에 출발</b>합니다. 각자 자기 속도로 풀고, ' +
    '위쪽 트랙에서 <b>모두가 달리는 모습</b>을 함께 봅니다.</div>');
  document.getElementById("bdSolo").onclick = function () { App.closeOverlay(); startMode(mi, false); };
  document.getElementById("bdVs").onclick = function () { App.closeOverlay(); showLobby(mi); };
  document.getElementById("bdCancel").onclick = function () { App.closeOverlay(); };
}

/* ══════════════════════════════════════════════════════════
   실시간 대결 — 대기실과 달리기 판
   ══════════════════════════════════════════════════════════ */
var RACE_MS = 2500;                 /* 몇 초마다 서로의 위치를 주고받을지 */
var lobTimer = null, raceTimer = null;
var LOB = { mi: -1, players: [], status: "wait", base: null, seed: 0, resume: null };

function meKey() {
  var u = App.user || {};
  return u.grade + "-" + u.cls + "-" + u.num;
}
function stopTimers() {
  if (lobTimer) { clearInterval(lobTimer); lobTimer = null; }
  if (raceTimer) { clearInterval(raceTimer); raceTimer = null; }
}

var LOB_TPL =
  '<div class="bdw">' +
  '<div class="gamebar"><h1 id="bdLobT">–</h1>' +
    '<button id="bdSndL">🔈</button><button id="bdLobOut">나가기</button>' +
    '<div class="sub">선생님이 시작을 누르면 다 함께 출발합니다</div></div>' +
  '<div class="bdrace"><canvas id="bdRaceCv" width="1000" height="290"></canvas></div>' +
  '<div class="lobbox">' +
    '<div class="lobcnt" id="bdLobN">0</div>' +
    '<div class="lobsub" style="margin-bottom:14px">명이 출발선에 서 있어요</div>' +
    '<div class="lobmsg" id="bdLobM"><span class="lobdot"></span>선생님을 기다리는 중…</div>' +
    '<div class="lobsub" id="bdLobS">교사용 화면에서 <b>시작</b>을 누르면 바로 출발합니다.</div>' +
    '<div class="lobgrid" id="bdLobL"></div>' +
  '</div></div>';

function showLobby(mi) {
  stopTimers();
  if (raf) { cancelAnimationFrame(raf); raf = null; }
  var M = MODES[mi];
  LOB = { mi: mi, players: [], status: "wait", base: null, seed: 0, resume: null };
  root.innerHTML = LOB_TPL;
  $("bdLobT").textContent = M.emoji + " " + M.name + " — 대결 대기실";
  bindSnd("bdSndL");
  $("bdLobOut").onclick = function () { stopTimers(); SND.stopAmb(); showSelect(); };
  cv = $("bdRaceCv");
  try { ctx = cv.getContext("2d"); } catch (e) { ctx = null; }

  paintLobby();
  SND.unlock(); SND.ambience("lobby");
  /* 튕겼다가 다시 들어온 경우 — 풀던 자리부터 이어서 할 수 있게 */
  App.call("roomResume", { user: App.user, game: GAME_ID, level: mi + 1 }).then(function (r) {
    if (!r || !r.ok || !r.data.resume || LOB.mi !== mi) return;
    LOB.resume = r.data.resume;
    paintLobby();
  });
  App.call("roomJoin", { user: App.user, game: GAME_ID, level: mi + 1 })
    .then(function (r) {
      if (!r || !r.ok || LOB.mi !== mi) return;
      /* 들어온 순간의 시작 시각을 기준선으로 삼습니다.
         이 값이 바뀌어야 = 선생님이 "지금" 시작을 눌러야 출발합니다. */
      LOB.base = r.data.startAt || 0;
      LOB.players = r.data.players; LOB.status = r.data.status;
      LOB.seed = r.data.seed || 0;
      paintLobby();
    });

  lobTimer = setInterval(function () {
    App.call("roomState", { user: App.user, game: GAME_ID, level: mi + 1 }).then(function (r) {
      if (!r || !r.ok || LOB.mi !== mi) return;
      if (r.data.players.length > LOB.players.length) SND.play("join");
      LOB.players = r.data.players; LOB.status = r.data.status;
      LOB.seed = r.data.seed || 0;
      var st = r.data.startAt || 0;
      if (LOB.base === null) { LOB.base = st; paintLobby(); return; }
      if (r.data.status === "run" && st !== LOB.base) {   /* 선생님이 방금 눌렀다 */
        SND.play("start");
        stopTimers(); startMode(mi, true, r.data.seed); return;
      }
      paintLobby();
    });
  }, RACE_MS);

  if (!raf) raf = requestAnimationFrame(loop);
}
function paintLobby() {
  if (!$("bdLobN")) return;
  var me = meKey();
  $("bdLobN").textContent = LOB.players.length;
  $("bdLobL").innerHTML = LOB.players.map(function (p) {
    return '<span class="lobchip' + (p.k === me ? " me" : "") + '">' +
      '<span class="c">' + esc(p.cl) + '</span>' + esc(p.nm) + '</span>';
  }).join("");
  var m = $("bdLobM"), sub = $("bdLobS");
  if (LOB.resume) {                       /* 하던 경기가 남아 있습니다 */
    var rs = LOB.resume;
    m.innerHTML = "🔄 풀던 경기가 남아 있어요";
    sub.innerHTML = '<b>' + rs.i + '구간</b>까지 풀었고 <b>' + rs.sc + '점</b>을 모았습니다. ' +
      '남은 시간 ' + fmtT(rs.time) + '<br>' +
      '<button id="bdResume" class="primary" style="margin-top:12px;padding:12px 20px">' +
      '이어서 하기</button> ' +
      '<button id="bdFresh" style="margin-top:12px;padding:12px 16px">처음부터</button>';
    var rb = document.getElementById("bdResume");
    if (rb) rb.onclick = function () {
      var mi2 = LOB.mi; stopTimers();
      startMode(mi2, true, rs.seed, rs);
    };
    var fb2 = document.getElementById("bdFresh");
    if (fb2) fb2.onclick = function () { LOB.resume = null; paintLobby(); };
    return;
  }
  if (LOB.status === "end") {
    m.innerHTML = "이번 대결은 끝났어요";
    sub.innerHTML = "선생님이 다시 시작하면 자동으로 출발합니다.";
  } else if (LOB.status === "run") {
    m.innerHTML = "🏁 이미 달리고 있는 경기가 있어요";
    sub.innerHTML = '다음 경기를 기다리면 <b>선생님이 시작할 때 함께 출발</b>합니다.<br>' +
      '<button id="bdJoinNow" style="margin-top:12px;padding:12px 20px" class="primary">' +
      '지금 바로 끼어들기</button>';
    var jb = document.getElementById("bdJoinNow");
    if (jb) jb.onclick = function () {
      var mi = LOB.mi, sd = LOB.seed;
      stopTimers(); startMode(mi, true, sd);
    };
  } else {
    m.innerHTML = '<span class="lobdot"></span>선생님을 기다리는 중…';
    sub.innerHTML = "교사용 화면에서 <b>시작</b>을 누르면 바로 출발합니다.";
  }
}

/** 내 위치를 보내고 모두의 위치를 받아 온다 */
function racePing(done) {
  if (!S || !S.racing) return;
  App.call("roomPing", {
    user: App.user, game: GAME_ID, level: S.m + 1,
    i: S.i, m: S.total, sc: S.score, done: done ? 1 : 0, lb: S.label,
    seed: S.seed, first: S.first, wrong: S.wrong, time: Math.round(S.time)
  }).then(function (r) {
    if (!r || !r.ok || !S) return;
    S.race = r.data.players; S.raceStatus = r.data.status;
    S.raceAuto = r.data.auto; S.raceRun = r.data.running; S.raceDone = r.data.done;
    /* 새 경기가 열렸거나(문제 세트가 바뀜) 이 경기가 끝났고 나도 완주했다면
       더 이상 신호를 보내지 않습니다. 다음 경기 기록을 더럽히지 않기 위해서입니다. */
    var newRound = (S.seed && r.data.seed && r.data.seed !== S.seed);
    if (raceTimer && (newRound || (S.finished && r.data.status !== "run"))) {
      clearInterval(raceTimer); raceTimer = null;
    }
    /* 선생님이 대결을 마치면 아직 풀고 있던 학생도 그 자리에서 끝냅니다.
       지금까지 쌓은 점수가 그대로 기록됩니다. */
    if (r.data.status === "end" && !r.data.auto && S.racing && !S.over && !S.finished) {
      S.endedBy = "teacher";
      finish(false);
      return;
    }
    var el = document.getElementById("bdRaceLive");
    if (!el) return;
    var meK = meKey(), run = (S.race || []).filter(function (p) { return p.r && !p.stale; });
    var pos = -1;
    run.forEach(function (p, i) { if (p.k === meK) pos = i + 1; });
    var over = (r.data.status === "end");
    el.innerHTML = '🏁 <b>' + (over ? "대결 종료 — 최종 결과" : "대결 결과") + '</b><br>' +
      (pos > 0 ? (over ? '최종 ' : '지금 ') + run.length + '명 중 <b style="color:var(--leaf)">' +
                 pos + '위</b>입니다.' : '순위를 불러오는 중입니다.') +
      '<br><span style="color:var(--muted);font-size:12.5px">' +
      (over
        ? (r.data.auto ? '모두 완주해서 대결이 자동으로 끝났습니다.'
                       : '선생님이 대결을 마쳤습니다.')
        : '완주 ' + r.data.done + ' / ' + r.data.running + '명 — ' +
          '아직 달리는 친구가 있어 순위가 바뀔 수 있어요.') + '</span>' +
      '<div style="margin-top:10px">' + run.slice(0, 5).map(function (p, i) {
        return '<div style="display:flex;gap:8px;font-size:12.5px;padding:3px 0' +
          (p.k === meK ? ';color:var(--leaf);font-weight:800' : '') + '">' +
          '<span style="width:26px">' + (["🥇", "🥈", "🥉"][i] || (i + 1) + ".") + '</span>' +
          '<span style="flex:1">' + esc(p.nm) + (p.d ? " 🏁" : "") + '</span>' +
          '<span style="font-family:var(--num)">' + (p.sc || 0) + '점</span></div>';
      }).join("") + '</div>';
  });
}

/* ── 경로 위의 아무 지점 ── */
function pathPos(fi) {
  var a = Math.floor(fi);
  a = Math.max(0, Math.min(S.total - 1, a));
  var b = Math.min(S.total - 1, a + 1), f = Math.max(0, Math.min(1, fi - a));
  return [nodeX(a) + (nodeX(b) - nodeX(a)) * f, nodeY(a) + (nodeY(b) - nodeY(a)) * f];
}
/* 이름으로 정해지는 고정된 옆자리 — 늘 같은 줄로 달립니다 */
function sideOf(k) {
  var h = 0;
  for (var i = 0; i < k.length; i++) h = (h * 31 + k.charCodeAt(i)) & 0xffff;
  return ((h % 9) - 4) * 34;
}

/* ── 같은 길 위를 달리는 반 친구들 ── */
function drawRivals(dt, w2s, sx, sw) {
  var me = meKey(), list = (S.race || []).filter(function (p) { return !p.stale; });
  if (LIGHT && list.length > 12) list = list.slice(0, 12);
  if (!list.length) return;
  if (!S.rivals) S.rivals = {};
  var M = MODES[S.m];
  var shown = [];

  list.forEach(function (p, idx) {
    if (p.k === me) return;
    var rv = S.rivals[p.k];
    if (!rv) { rv = S.rivals[p.k] = { ai: p.i, off: sideOf(p.k) }; }
    var ti = Math.max(0, Math.min(S.total - 1, p.i || 0));

  cv = $("bdCv");
  try { ctx = cv.getContext("2d"); } catch (e) { ctx = null; }
  bindSnd("bdSnd");
  $("bdQuit").onclick = App.goHome;
  $("bdBackSel").onclick = function () { if (confirm("모드 선택으로 돌아갈까요? 진행 중인 점수는 저장되지 않아요.")) showSelect(); };
  $("bdTitle").textContent = M.emoji + " " + M.name;
  $("bdSub").textContent = M.sub + " — " + M.hero.label + "이(가) 되어 여행합니다";

  var picked = pickSteps(M, seed);
  var P = buildPath(M, picked);
  var nB = picked.filter(function (x) { return x.t === "bonus"; }).length;
  var limit = Math.max(360, Math.round((picked.length - nB) * 26) + nB * 20);
  S = { m: mi, i: 0, steps: picked, total: picked.length, time: limit, score: 0, combo: 0, best: 0,
        px: P.px, py: P.py, segs: P.segs, segOf: P.segOf, wrong: 0, qClock: limit,
        first: 0, tries: 0, over: false, waiting: true, answered: false,
        heroT: 0, moving: false, from: 0, to: 0,
        label: M.hero.label, color: M.hero.c, size: M.hero.size || 1, shape: M.hero.shape || "ball",
        camX: P.px[0] - 300, camY: P.py[0],
        trail: [], dust: [], burst: 0, breathe: 0, chuteIdx: 0, flyItem: null, clock: 0,
        racing: !!racing, race: [], raceStatus: racing ? "run" : "", seed: seed || 0, rivals: {},
        endedBy: "", lastOrg: "", missed: [],
        morph: 0, fx: { shake: 0, flash: 0, fcol: "255,255,255", punch: 0,
                        sparks: [], rings: [], pops: [], streak: 0 } };
  for (var k = 0; k < 60; k++) {                     /* 길 주변에 떠다니는 알갱이 */
    var n = Math.floor(Math.random() * P.px.length);
    S.dust.push({ x: P.px[n] + (Math.random() - .5) * 1800, y: P.py[n] + (Math.random() - .5) * 1400,
      r: 1 + Math.random() * 3, sp: .2 + Math.random() * .8, ph: Math.random() * 6.3 });
  }

  if (resume && resume.i > 0 && resume.i < S.total) {   /* 풀던 자리부터 이어서 */
    S.i = resume.i; S.score = resume.sc || 0;
    S.first = resume.first || 0; S.wrong = resume.wrong || 0;
    if (resume.time > 0) S.time = Math.min(S.time, resume.time);
    S.qClock = S.time;
    /* 지나온 구간의 모습 변화를 그대로 되살립니다 */
    for (var ri = 0; ri < S.i; ri++) {
      var rst = S.steps[ri];
      if (rst && rst.become) {
        S.label = rst.become.label; S.color = rst.become.c;
        if (rst.become.size) S.size = rst.become.size;
        if (rst.become.shape) S.shape = rst.become.shape;
      }
    }
    S.camX = P.px[S.i]; S.camY = P.py[S.i];
    S.lastOrg = S.steps[S.i].org;
  }
  if (racing) {
    var rw = $("bdRaceWrap"); if (rw) rw.hidden = false;
    raceView = {};
    racePing(false);
    raceTimer = setInterval(function () { racePing(false); },
      RACE_MS + Math.floor(Math.random() * 900));   /* 30명이 같은 순간에 몰리지 않게 */
  }
  App.overlay('<h2>' + (resume ? '🔄 이어서 — ' : (racing ? '🏁 대결 시작! — ' : '')) +
    M.emoji + ' ' + M.name + ' — ' + M.sub + '</h2>' +
    (resume ? '<p style="color:var(--light);font-weight:700">' + resume.i +
      '구간부터 이어서 합니다. 지금까지 ' + resume.sc + '점.</p>' : '') +
    '<p>' + M.desc + '<br>당신은 <b>' + M.hero.label + '</b>입니다. 왼쪽 인체 지도에서 지금 어디에 있는지 확인하면서, ' +
    '갈림길에서 올바른 길을 고르고 기관마다 무슨 일이 일어나는지 맞혀 보세요.</p>' +
    '<p style="color:var(--light);font-weight:700">제한 시간 ' + fmtT(limit) + ' · 이번 판 ' + picked.length + '문항</p>' +
    '<p style="font-size:12.5px;color:var(--muted);margin-top:-8px">문항 은행 ' + M.steps.length +
    '개에서 골라 냅니다. <b style="color:var(--paper)">할 때마다 다른 문제</b>가 나와요.</p>' +
    (racing ? '<p style="color:var(--leaf);font-weight:700">반 친구들과 함께 달립니다. ' +
              '위쪽 트랙에서 서로의 위치를 볼 수 있어요.<br>' +
              '<span style="color:var(--muted);font-weight:600;font-size:12.5px">' +
              '이번 대결은 모두 <b style="color:var(--paper)">같은 문제</b>로 겨룹니다 ' +
              '(문제 세트 #' + (seed || 0) + ')</span></p>' : '') +
    '<div class="btns"><button class="primary" id="bdStart">' +
      (racing ? '출발!' : '여행 시작') + '</button>' +
    '<button id="bdSelBack">모드 선택으로</button></div>');
  document.getElementById("bdStart").onclick = function () {
    SND.unlock(); SND.ambience(M.id);
    App.closeOverlay(); S.waiting = false; last = 0;
    if (timer) clearInterval(timer);
    timer = setInterval(tick, 250);
    render();
  };
  document.getElementById("bdSelBack").onclick = function () { App.closeOverlay(); stopTimers(); showSelect(); };
  if (!raf) raf = requestAnimationFrame(loop);
}

function tick() {
  if (!S || S.over || S.waiting) return;
  S.time -= 0.25;
  if (S.time <= 0) { S.time = 0; finish(false); return; }
  /* 마지막 10초는 한 번씩 알려 줍니다 */
  if (S.time <= 10 && Math.abs(S.time - Math.round(S.time)) < .13) SND.play("tick");
  paintHud();
}
function paintHud() {
  if (!root || !S || !$("bdProg")) return;
  $("bdProg").textContent = S.i + " / " + S.total + "구간";
  if ($("bdPb")) $("bdPb").style.width = (S.i / S.total * 100) + "%";
  var t = $("bdTime");
  /* 남은 구간에 견주어 시간이 넉넉한지 알려 줍니다 */
  var left = Math.max(1, S.total - S.i), per = S.time / left;
  t.textContent = fmtT(S.time);
  t.className = (S.time <= 45 || per < 12) ? "low" : (per > 40 ? "ok" : "");
  $("bdScore").textContent = S.score;
  if ($("bdAcc")) {
    var acc = $("bdAcc");
    acc.textContent = S.first + (S.i ? " (" + Math.round(S.first / S.i * 100) + "%)" : "");
    acc.className = (S.i >= 3 && S.first / S.i >= .8) ? "ok" : "";
  }
  var c = $("bdCombo"); c.textContent = S.combo; c.className = S.combo >= 3 ? "hot" : "";
}

/* ══════════════════════════════════════════════════════════
   문제 표시
   ══════════════════════════════════════════════════════════ */
function scene(org) {
  var box = $("bdScene"); if (!box) return;
  var sc = sceneOf(S.m, org);
  if (!sc) { box.innerHTML = ""; return; }
  box.innerHTML = '<div class="in"><span class="org">' + esc(org) + ' 도착</span>' +
    '<div class="l1">' + esc(sc[0]) + '</div>' +
    '<div class="l2">' + esc(sc[1]) + '</div></div>';
  var el = box.querySelector(".in");
  void el.offsetWidth; el.className = "in go";
}

function render() {
  if (!S || S.over) return;
  var st = S.steps[S.i];
  if (!st) { finish(true); return; }
  if (st.org !== S.lastOrg) { S.lastOrg = st.org; scene(st.org); }
  S.bonus = null;
  if (st.t === "bonus") { paintHud(); renderBonus(st); return; }
  S.tries = 0; S.answered = false; S.chuteIdx = 0; S.qClock = S.time;
  var fb = $("bdFb"); fb.className = "bdfb"; fb.innerHTML = "";
  $("bdNext").innerHTML = "";
  var tag = $("bdTag");
  var dl = ["", "", " · ⭐ 응용", " · ⭐⭐ 심화"][Math.min(3, st.d || 1)];
  var hardCls = (st.d || 1) >= 3 ? " hard" : ((st.d || 1) === 2 ? " mid" : "");
  if (st.t === "fork") { tag.className = "bdtag fork"; tag.textContent = "🚦 갈림길 · " + st.org; }
  else if (st.t === "chute") { tag.className = "bdtag" + hardCls; tag.textContent = "🔀 통로 고르기 · " + st.org + dl; }
  else if (st.t === "time") { tag.className = "bdtag fork"; tag.textContent = "⏱ 타이밍 · " + st.org; }
  else { tag.className = "bdtag" + hardCls; tag.textContent = "🔬 " + st.org + dl; }
  $("bdQ").innerHTML = st.q;
  $("bdQ").setAttribute("aria-live", "polite");

  if (st.t === "chute") paintChute(st);
  else if (st.t === "time") renderTime(st);
  else renderOpts(st);
  paintHud();
}

function shuffleIdx(n) {
  var a = []; for (var i = 0; i < n; i++) a.push(i);
  for (var j = a.length - 1; j > 0; j--) { var k = Math.floor(Math.random() * (j + 1)); var t = a[j]; a[j] = a[k]; a[k] = t; }
  return a;
}
function lockOpts() {
  Array.prototype.forEach.call($("bdOpts").querySelectorAll(".bdopt"), function (x) { x.disabled = true; });
}

function renderOpts(st) {
  var ord = shuffleIdx(st.opt.length);
  $("bdOpts").innerHTML = ord.map(function (o, idx) {
    return '<button class="bdopt" data-o="' + o + '">' +
      '<i class="kn">' + (idx + 1) + '.</i><span class="ot">' + esc(st.opt[o]) + '</span></button>';
  }).join("");
  Array.prototype.forEach.call($("bdOpts").querySelectorAll(".bdopt"), function (b) {
    b.onclick = function () {
      if (S.answered) return;
      S.tries++;
      if (+b.dataset.o === st.ans) {
        S.answered = true; lockOpts();
        Array.prototype.forEach.call($("bdOpts").querySelectorAll(".bdopt"), function (x) {
          if (x !== b && !/wrong/.test(x.className)) x.className = "bdopt dim";
        });
        b.className = "bdopt right"; succeed(st);
      } else {
        b.className = "bdopt wrong"; b.disabled = true; fail(st);
      }
    };
  });
}

function paintChute(st) {
  var it = st.items[S.chuteIdx];
  if (!it) { succeed(st); return; }
  S.flyItem = { t: it[0], to: -1, life: 0 };
  $("bdQ").innerHTML = st.q + '<br><span style="color:var(--light);font-size:16px">' +
    '지금 물질: <b>' + esc(it[0]) + '</b> <span style="color:var(--muted);font-size:13px">(' +
    (S.chuteIdx + 1) + '/' + st.items.length + ')</span></span>';
  $("bdOpts").innerHTML = st.ch.map(function (c, i) {
    return '<button class="bdopt" data-c="' + i + '">' +
      '<i class="kn">' + (i + 1) + '.</i><span class="ot">' + esc(c) + '</span></button>';
  }).join("");
  Array.prototype.forEach.call($("bdOpts").querySelectorAll(".bdopt"), function (b) {
    b.onclick = function () {
      if (S.answered || b.disabled) return;
      var ci = +b.dataset.c;
      if (ci === it[1]) {
        lockOpts(); b.className = "bdopt right";
        S.flyItem.to = ci; S.flyItem.n = st.ch.length; S.flyItem.life = 1;
        pop("✔");
        S.chuteIdx++;
        if (S.chuteIdx >= st.items.length) setTimeout(function () { if (S && !S.over) succeed(st); }, 190);
        else setTimeout(function () { if (S && !S.over) paintChute(st); }, 190);
      } else {
        S.tries++; b.className = "bdopt wrong"; b.disabled = true; fail(st);
      }
    };
  });
}

function renderTime(st) {
  $("bdOpts").innerHTML = '<button class="bdopt" id="bdNow" style="grid-column:1/-1;font-size:19px">지금!</button>';
  $("bdNow").onclick = function () {
    if (S.answered) return;
    S.tries++;
    var ph = S.breathe % 1;                       /* 0~0.5 들숨, 0.5~1 날숨 */
    var ok = (st.want === "in") ? (ph > 0.10 && ph < 0.40) : (ph > 0.60 && ph < 0.90);
    if (ok) { S.answered = true; $("bdNow").className = "bdopt right"; $("bdNow").disabled = true; succeed(st); }
    else fail(st, (st.want === "in" ? "가로막이 내려가는 동안" : "가로막이 올라가는 동안") + " 눌러야 해요.");
  };
}

/* ── 정답 / 오답 ── */
/* 문제가 뜬 뒤 흐른 시간이 짧을수록 빠르기 점수를 더 받습니다 */
function speedBonus() {
  var spent = Math.max(0, S.qClock - S.time);
  return Math.max(0, Math.round(SPEED_MAX * (1 - spent / SPEED_SEC)));
}
function succeed(st) {
  var first = (S.tries <= 1);
  var speed = first ? speedBonus() : 0;
  S.combo++; if (S.combo > S.best) S.best = S.combo;
  var base = (st.t === "chute") ? 120 : [0, 60, 85, 110][Math.min(3, st.d || 1)];
  var cb = first ? Math.min(25, (S.combo - 1) * 5) : 0;
  var pts = first ? base + speed + cb : Math.round(base * .5);
  S.score += pts; if (first) S.first++;
  S.answered = true;

  var hp0 = heroPos();
  SND.play(st.become ? "morph" : "good", S.combo);
  if (st.become) {                                   /* 모습이 바뀔 때 — 가장 크게 */
    S.label = st.become.label; S.color = st.become.c;
    if (st.become.size) S.size = st.become.size;
    if (st.become.shape) S.shape = st.become.shape;
    S.burst = 1; S.morph = 1;
    pop("✨ " + st.become.label);
    fxFlash(.62, "255,255,255"); fxShake(16); fxPunch(.22);
    fxBurst(hp0[0], hp0[1], 46, [st.become.c, "#ffffff", "#FFC53D"], 520);
    fxRing(hp0[0], hp0[1], st.become.c, 12);
    fxRing(hp0[0], hp0[1], "#ffffff", 5);
  } else {
    fxFlash(.22, "123,224,79"); fxPunch(.10);
    fxBurst(hp0[0], hp0[1], 16 + Math.min(18, S.combo * 3),
      ["#7BE04F", "#FFFFFF", "#FFC53D"], 300 + Math.min(240, S.combo * 40));
    fxRing(hp0[0], hp0[1], "#7BE04F", 6);
    if (speed >= SPEED_MAX * .7) pop("⚡ +" + speed);
    else if (S.combo >= 3 && first) pop(S.combo + " 연속!");
    if (S.combo >= 5) { fxShake(5); fxRing(hp0[0], hp0[1], "#FFC53D", 5); }
  }
  fxPop("+" + pts, st.become ? st.become.c : "#B6F58E");

  var detail = [];
  if (speed) detail.push("빠르기 +" + speed);
  if (cb) detail.push("연속 +" + cb);
  var fb = $("bdFb");
  fb.className = "bdfb show good";
  var dtag = [(""), "", "⭐ 응용 문제 ", "⭐⭐ 심화 문제 "][Math.min(3, st.d || 1)];
  fb.innerHTML = '<b>' + dtag + (first ? "정답! +" + pts + "점" : "맞았어요. +" + pts + "점") + '</b>' +
    (detail.length ? ' <span style="color:var(--light)">(' + detail.join(" · ") + ')</span>' : '') +
    (first ? '' : ' <span style="color:var(--muted)">한 번에 맞히면 더 높은 점수를 받아요</span>') +
    '<div class="sci">💡 ' + st.why + '</div>';
  var lastOne = (S.i + 1 >= S.total);
  var wait0 = AUTO_GO;
  $("bdNext").innerHTML =
    '<button class="primary bdgo" id="bdGo2">' +
      (lastOne ? "여행 완료" : "설명을 읽었어요 · 계속 이동 →") +
      (wait0 ? '<i style="animation-duration:' + wait0 + 'ms"></i>' : '') + '</button>' +
    (wait0 ? '<button class="hold" id="bdHold">해설 더 보기</button>' : '');
  var autoT = null;
  if (wait0) autoT = setTimeout(function () { if ($("bdGo2")) $("bdGo2").click(); }, wait0);
  if ($("bdHold")) $("bdHold").onclick = function () {
    clearTimeout(autoT);
    var g = $("bdGo2"); if (g) { var bar = g.querySelector("i"); if (bar) bar.remove(); }
    $("bdHold").remove();
  };
  $("bdGo2").onclick = function () { clearTimeout(autoT); goNext(); };
  paintHud();
}
/** 다음 구간으로 출발 */
function goNext() {
  if (!S || S.moving || S.over) return;
  var gb = $("bdGo2"); if (gb) gb.disabled = true;
  var lp = heroPos();
  SND.play("move");
  fxShake(9); fxPunch(.13); fxRing(lp[0], lp[1], S.color, 9);
  fxBurst(lp[0], lp[1], 22, [S.color, "#FFFFFF"], 420);      /* 출발 반동 */
  S.from = S.i; S.to = S.i + 1; S.heroT = 0; S.moving = true; S.fx.streak = .35;
  var ddx = nodeX(S.to) - nodeX(S.from), ddy = nodeY(S.to) - nodeY(S.from);
  var dist = Math.sqrt(ddx * ddx + ddy * ddy);
  S.moveDur = .34 + Math.min(.50, dist / 6000);   /* 멀수록 조금 더 오래 날아갑니다 */
  $("bdOpts").innerHTML = ""; $("bdNext").innerHTML = "";
  $("bdQ").innerHTML = '<span style="color:var(--muted)">이동 중…</span>';
  setTimeout(function () {
    if (!S || S.over) return;
    S.i++; S.moving = false;
    var hp2 = heroPos();
    SND.play("land");
    fxPunch(.24); fxFlash(.20, "255,255,255"); fxShake(11);
    fxRing(hp2[0], hp2[1], "#FFFFFF", 7);
    fxBurst(hp2[0], hp2[1], 18, ["#FFFFFF", S.color], 360);
    render();
  }, Math.round((S.moveDur || .6) * 1000) + 35);
}
function fail(st, msg) {
  S.combo = 0; S.wrong++;
  /* 틀린 문제를 모아 두었다가 끝나고 다시 보여 줍니다 */
  if (S.missed.length < 12 && S.missed.indexOf(st) < 0) S.missed.push(st);
  S.score = Math.max(0, S.score - PENALTY);
  var hp1 = heroPos();
  SND.play("bad");
  var pn = root && root.querySelector(".bdpanel");
  if (pn) { pn.classList.remove("shakeit"); void pn.offsetWidth; pn.classList.add("shakeit"); }
  fxShake(22); fxFlash(.34, "255,77,106"); fxPunch(.06);
  fxBurst(hp1[0], hp1[1], 14, ["#FF4D6A", "#FF8A56"], 260);
  fxPop("−" + PENALTY, "#FF8092");
  var fb = $("bdFb");
  fb.className = "bdfb show bad";
  var hint = (st.why || "").split(/[.!?]/)[0];
  fb.innerHTML = '<b>✕ ' + (msg || "아쉬워요. 다시 골라 보세요.") +
    ' <span style="color:var(--alert)">−' + PENALTY + '점</span></b>' +
    '<div class="sci">💡 ' + (hint.length > 8 ? hint + "." : "설명을 다시 떠올려 보세요.") + '</div>';
  paintHud();
}
function pop(txt) {
  var p = $("bdPop"); if (!p) return;
  p.textContent = txt; p.className = "bdpop"; void p.offsetWidth; p.className = "bdpop go";
}

/* ══════════════════════════════════════════════════════════
   이펙트 — 화면 흔들림, 번쩍임, 불꽃, 파동
   ══════════════════════════════════════════════════════════ */
function fxShake(a) { if (S) S.fx.shake = Math.max(S.fx.shake, a); }
function fxFlash(a, c) { if (!S) return; S.fx.flash = Math.max(S.fx.flash, a); S.fx.fcol = c || "255,255,255"; }
function fxPunch(a) { if (S) S.fx.punch = Math.max(S.fx.punch, a); }
function fxRing(x, y, c, w) { if (S) S.fx.rings.push({ x: x, y: y, r: 14, l: 1, c: c, w: w || 7 }); }
function fxPop(txt, c) { if (S) S.fx.pops.push({ t: txt, c: c, l: 1 }); }
function fxBurst(x, y, n, cols, spd) {
  if (!S) return;
  for (var i = 0; i < n; i++) {
    var a = Math.random() * 6.2832, v = spd * (.35 + Math.random());
    S.fx.sparks.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
      l: 1, c: cols[i % cols.length], r: 3.5 + Math.random() * 7 });
  }
}
function fxStep(dt) {
  var f = S.fx;
  f.shake *= Math.pow(.015, dt);
  if (f.shake < .3) f.shake = 0;
  f.flash = Math.max(0, f.flash - dt * 3.4);
  f.punch = Math.max(0, f.punch - dt * 2.0);
  S.morph = Math.max(0, S.morph - dt * 1.6);
  S.fx.streak = S.moving ? Math.min(1, S.fx.streak + dt * 10) : Math.max(0, S.fx.streak - dt * 6);
  var k = Math.pow(.35, dt);
  f.sparks = f.sparks.filter(function (p) {
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= k; p.vy = p.vy * k + dt * 260;     /* 조금씩 아래로 가라앉습니다 */
    p.l -= dt * 1.0;
    return p.l > 0;

  }
  if (S.burst > 0) {
    S.burst -= dt * 1.4;
    ctx.strokeStyle = "rgba(255,255,255," + Math.max(0, S.burst).toFixed(2) + ")";
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(x, y, r + (1 - S.burst) * 74, 0, 6.3); ctx.stroke();
  }
  ctx.save();
  ctx.translate(x, y);
  var st2 = S.fx.streak;
  ctx.scale(1 + st2 * .42 + Math.sin(S.clock * 5) * .025, 1 - st2 * .24 - Math.sin(S.clock * 5) * .025);
  ctx.shadowColor = S.color; ctx.shadowBlur = 26 + S.morph * 40 + (S.combo >= 3 ? 14 : 0);
  var g = ctx.createRadialGradient(-r * .35, -r * .4, r * .12, 0, 0, r);
  g.addColorStop(0, "#ffffff"); g.addColorStop(.42, shade(S.color, .18)); g.addColorStop(1, shade(S.color, -.34));
  ctx.fillStyle = g; __lastGrad = g;
  heroBody(S.shape || "ball", r, S.color, S.clock);   /* 모드마다 다른 몸 모양 */
  ctx.shadowBlur = 0;

  var blink = (Math.sin(S.clock * 1.7) > .975) ? .15 : 1;
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.ellipse(r * .16, -r * .20, r * .30, r * .30, 0, 0, 6.3); ctx.fill();
  ctx.beginPath(); ctx.ellipse(r * .62, -r * .12, r * .25, r * .25, 0, 0, 6.3); ctx.fill();
  ctx.fillStyle = "#0d1b1e";
  ctx.beginPath(); ctx.ellipse(r * .23, -r * .19, r * .13, r * .13 * blink, 0, 0, 6.3); ctx.fill();
  ctx.beginPath(); ctx.ellipse(r * .67, -r * .11, r * .11, r * .11 * blink, 0, 0, 6.3); ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,.45)"; ctx.lineWidth = 2.2; ctx.lineCap = "round";
  ctx.beginPath(); ctx.arc(r * .38, r * .22, r * .27, .2, Math.PI - .2); ctx.stroke();
  ctx.restore();

  var myName = (S.racing && App.user && App.user.name) ? App.user.name : "";
  label(x, y - r - 24,
    myName ? (S.label + " (" + myName + ")") : S.label,
    myName ? "rgba(123,224,79,.94)" : "rgba(255,255,255,.94)",
    myName ? "#062012" : "#0d2029");
}

function drawBreath(sx, sw) {
  var ph = S.breathe % 1, inhale = ph < .5;
  var bw = Math.min(360, sw - 80), bx = sx + (sw - bw) / 2, by = H - 74;
  ctx.fillStyle = "rgba(0,0,0,.55)"; rr(bx - 16, by - 40, bw + 32, 86, 16); ctx.fill();
  ctx.fillStyle = "rgba(123,224,79,.32)"; rr(bx + bw * .10, by - 10, bw * .30, 22, 6); ctx.fill();
  ctx.fillStyle = "rgba(255,138,86,.28)"; rr(bx + bw * .60, by - 10, bw * .30, 22, 6); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.16)"; rr(bx, by - 10, bw, 22, 6); ctx.fill();
  ctx.fillStyle = inhale ? "#7BE04F" : "#FF8A56";
  ctx.beginPath(); ctx.arc(bx + bw * ph, by + 1, 13, 0, 6.3); ctx.fill();
  ctx.font = "800 12.5px Pretendard,sans-serif"; ctx.textAlign = "center";
  ctx.fillStyle = "rgba(255,255,255,.92)";
  ctx.fillText("들숨 · 가로막 내려감", bx + bw * .25, by - 20);
  ctx.fillText("날숨 · 가로막 올라감", bx + bw * .75, by - 20);
  /* 가로막 움직임 */
  var dy = by + 34 + (inhale ? 9 : -6);
  ctx.strokeStyle = "rgba(255,255,255,.75)"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(bx + 26, dy);
  ctx.quadraticCurveTo(bx + bw / 2, dy + (inhale ? 6 : -16), bx + bw - 26, dy);
  ctx.stroke();
  ctx.textAlign = "left";
}

function draw(dt) {
  if (!ctx || !S) return;
  MAPW = (cv.clientWidth && cv.clientWidth < 560) ? 0 : 250;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#04121a"; ctx.fillRect(0, 0, W, H);
  drawStage(MAPW, W - MAPW, dt);
  if (MAPW) { drawMap(30, 22, MAPW - 74, H - 300); drawJourney(24, H - 262, MAPW - 48); }
}

var FPS_MS = 1000 / 34;      /* 초당 34장이면 눈에 부드럽고, 태블릿 부담은 크게 줄어듭니다 */
var raceAt = 0, slowAcc = 0, slowN = 0;
var LIGHT = false;           /* 느린 기기에서 스스로 켜지는 가벼운 그리기 */
function loop(now) {
  raf = requestAnimationFrame(loop);
  if (!last) last = now;
  if (now - last < FPS_MS - 1) return;        /* 너무 자주 그리지 않습니다 */
  var real = now - last;
  var dt = Math.min(.05, real / 1000); last = now;
  /* 기기가 버거워하면 스스로 가볍게 바꿉니다 (한 번 켜지면 유지) */
  if (!LIGHT) {
    slowAcc += real; slowN++;
    if (slowN >= 40) {
      if (slowAcc / slowN > 46) { LIGHT = true; FPS_MS = 1000 / 24; }
      slowAcc = 0; slowN = 0;
    }
  }
  if (!S) { if (now - raceAt > 80) { raceAt = now; try { if (LOB.mi >= 0) drawRace(dt); } catch (e) {} } return; }
  S.clock += dt;
  try { fxStep(dt); } catch (e) {}
  if (!S.waiting && !S.over) {
    if (S.moving) S.heroT = Math.min(1, S.heroT + dt / (S.moveDur || .6));
    S.breathe += dt * .32;
  }
  if (S.bonus && !S.bonus.done) { try { bonusStep(dt); bonusDraw(); } catch (e) {} }
  try { draw(dt); } catch (e) {}
  /* 달리기 판은 위치가 2.5초마다 오므로 초당 12장이면 충분합니다 */
  if (S.racing && now - raceAt > 80) { raceAt = now; try { drawRace(dt); } catch (e) {} }
}

/* ══════════════════════════════════════════════════════════
   종료
   ══════════════════════════════════════════════════════════ */

/* 점수 저장 + 순위 표시
   순위 제목에 "1단계" 대신 모드 이름을 쓰려고 App.call 을 직접 씁니다 */
function submitRecord(p, svEl, rkEl, labelTxt) {
  return App.call("saveScore", {
    user: App.user, game: GAME_ID, level: p.level,
    score: p.score, d1: p.d1, d2: p.d2, cleared: p.cleared
  }).then(function (r) {
    if (svEl) {
      svEl.textContent = r.ok ? "점수를 저장했어요." : ("점수 저장 실패: " + r.msg);
      svEl.className = "msg " + (r.ok ? "good" : "bad");
    }
    return App.call("getBoard", GAME_ID);
  }).then(function (r) {
    if (!r || !r.ok || !rkEl) return;
    rkEl.innerHTML = App.rankHtml(r.data.levels[String(p.level)] || [], labelTxt);
  });
}

/** 성적에 따른 등급 — 숫자만 보여 주면 잘한 건지 알기 어렵습니다 */
function gradeOf(first, total, wrong) {
  var r = total ? first / total : 0;
  if (r >= .95 && wrong === 0) return { g: "S", c: "#FFC53D", m: "완벽했어요. 한 번도 틀리지 않았습니다!" };
  if (r >= .9)  return { g: "A", c: "#7BE04F", m: "거의 다 한 번에 맞혔어요. 아주 잘했습니다." };
  if (r >= .75) return { g: "B", c: "#4FD1E0", m: "잘했어요. 몇 문제만 더 챙기면 A 입니다." };
  if (r >= .55) return { g: "C", c: "#FF8A56", m: "괜찮아요. 틀린 문제의 설명을 다시 읽어 보세요." };
  return { g: "D", c: "#FF4D6A", m: "천천히 해도 괜찮아요. 한 번 더 도전해 보세요." };
}
function finish(done) {
  if (!S || S.over) return;
  SND.play(done ? "win" : "over");
  SND.stopAmb();
  if (done) {                                   /* 완주 축포 */
    try {
      var hp3 = heroPos();
      fxFlash(.7, "255,255,255"); fxPunch(.26); fxShake(14);
      fxBurst(hp3[0], hp3[1], 90, ["#7BE04F", "#FFC53D", "#4FD1E0", "#FF8A56", "#FFFFFF"], 760);
      fxRing(hp3[0], hp3[1], "#FFC53D", 14);
      fxRing(hp3[0], hp3[1], "#7BE04F", 8);
    } catch (e) {}
  }
  S.over = true;
  if (timer) { clearInterval(timer); timer = null; }
  var M = MODES[S.m], mi = S.m;
  var raceBox = "";
  if (S.racing) {
    S.finished = true;
    racePing(true);
    if (raceTimer) clearInterval(raceTimer);
    /* 완주한 뒤에도 계속 지켜봅니다 — 친구들이 들어오면 순위가 갱신됩니다 */
    raceTimer = setInterval(function () { racePing(true); },
      RACE_MS + Math.floor(Math.random() * 900));
    raceBox = '<div class="learnbox" id="bdRaceLive">🏁 <b>대결 결과</b><br>' +
      '순위를 불러오는 중입니다…</div>';
  }
  var timeB = done ? Math.round(S.time * .35) : 0;
  var score = Math.min(MODE_CAP, S.score + timeB + (done ? 200 : 0));
  if (done) saveBest(mi, score);
  loadBest();
  var t = tally();
  var allDone = (t.n >= 4);
  var left = MODES.filter(function (x, i) { return !BEST[i]; }).map(function (x) { return x.name; });

  App.overlay(
    '<h2>' + (done ? M.emoji + " " + M.name + " 완주!"
                   : (S.endedBy === "teacher" ? "🏁 대결 종료" : "시간 종료")) + '</h2>' +
    '<p>' + (done ? "<b>" + esc(S.label) + "</b>이(가) 무사히 도착했어요."
                  : (S.endedBy === "teacher"
                     ? "선생님이 대결을 마쳤습니다. <b>여기까지 푼 만큼</b> 점수가 기록됩니다."
                     : "시간이 다 됐어요. 다시 도전해 보세요.")) + '</p>' +
    (done ? (function () {
      var gr = gradeOf(S.first, S.total, S.wrong);
      return '<div class="gradebox">' +
        '<div class="gd" style="color:' + gr.c + '">' + gr.g + '</div>' +
        '<div class="gm">' + gr.m + '</div></div>';
    })() : '') +
    '<div class="res">' +
      '<div><span>한 번에 정답</span><b>' + S.first + ' / ' + S.total + '</b></div>' +
      '<div><span>틀린 횟수</span><b>' + S.wrong + '</b></div>' +
      '<div><span>이번 점수</span><b>' + score + '</b></div>' +
    '</div>' +
    '<div class="res">' +
      '<div><span>최고 연속</span><b>' + S.best + '</b></div>' +
      '<div><span>완료한 모드</span><b>' + t.n + ' / 4</b></div>' +
      '<div><span>종합 점수</span><b>' + t.sum + '</b></div>' +
    '</div>' +
    raceBox +
    (allDone
      ? '<div class="learnbox">🏆 네 모드를 모두 완주했습니다. 종합 점수 <b>' + t.sum + '점</b>으로 종합 순위에 올랐어요.</div>'
      : '<div class="learnbox">🏁 종합 순위는 네 모드를 모두 마쳐야 매겨집니다. 남은 모드 — <b>' + left.join(", ") + '</b></div>') +
    (S.missed.length ? (function () {
      return '<div class="learnbox missed"><b>🔁 틀렸던 문제 다시 보기 (' + S.missed.length + '개)</b>' +
        S.missed.map(function (q2) {
          var right = (q2.t === "chute")
            ? q2.items.map(function (it) { return it[0] + " → " + q2.ch[it[1]]; }).join(", ")
            : (q2.t === "time" ? (q2.want === "in" ? "들숨일 때" : "날숨일 때") : q2.opt[q2.ans]);
          return '<div class="mi"><div class="mq">' + q2.q + '</div>' +
            '<div class="ma">정답 — <b>' + esc(right) + '</b></div>' +
            '<div class="mw">' + esc(q2.why) + '</div></div>';
        }).join("") + '</div>';
    })() : '') +
    '<div class="learnbox">📘 <b>이 모드에서 배운 것</b><br>' + M.learn + '</div>' +
    '<div class="msg" id="bdSv">점수를 저장하는 중…</div><div id="bdRk"></div>' +
    (allDone ? '<div class="msg" id="bdSvT">종합 점수를 등록하는 중…</div><div id="bdRkT"></div>' : '') +
    '<div class="btns"><button class="primary" id="bdAgain">' +
      (done ? "다른 모드 하기" : (S.endedBy === "teacher" ? "모드 선택으로" : "다시 도전")) + '</button>' +
    '<button id="bdHome2">대시보드로</button></div>');

  document.getElementById("bdAgain").onclick = function () {
    App.closeOverlay();
    if (done || S.endedBy === "teacher") showSelect(); else startMode(mi);
  };
  document.getElementById("bdHome2").onclick = function () { App.closeOverlay(); App.goHome(); };

  setTimeout(function () {
  submitRecord({ level: mi + 1, score: score, d1: S.first, d2: S.total, cleared: done },
    document.getElementById("bdSv"), document.getElementById("bdRk"), M.name + " 순위")
    .then(function () {
      if (!allDone) return;
      var sv = document.getElementById("bdSvT"), rk = document.getElementById("bdRkT");
      if (!sv || !rk) return;
      return submitRecord(
        { level: TOTAL_LEVEL, score: Math.min(20000, t.sum), d1: 4, d2: 4, cleared: true },
        sv, rk, "종합 순위 — 네 모드를 모두 마친 학생");
    });
  }, S.racing ? Math.floor(Math.random() * 2500) : 0);   /* 대결에서는 저장 시각을 흩뜨립니다 */
}

App.registerGame({
  id: GAME_ID, mount: mount,
  start: function () { },
  peek: function () { return S; },          /* 검사·디버깅용 — 읽기만 */
  stop: function () {
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    if (timer) { clearInterval(timer); timer = null; }
    stopTimers(); SND.stopAmb();
    if (keyBound) { document.removeEventListener("keydown", onKey); document.removeEventListener("keyup", onKeyUp); keyBound = false; }
    LOB.mi = -1; S = null; ctx = null; cv = null;
  }
});

})();
</script>
