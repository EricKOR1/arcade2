<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B0F1E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#1B2027">
<title>아케이드</title>
<link rel="stylesheet" href="platform.css?v=2026-10-15c">
<link rel="stylesheet" href="style.css?v=2026-10-15c">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
</head>
<body>
<div class="app">

  <button id="nav-back" class="nav-back hidden" aria-label="뒤로">←</button>


  <!-- 입장 -->
  <section id="screen-join" class="screen centered active">
    <div class="badge badge-primary badge-lg gap-2 mb-3" id="join-chip"></div>
    <h1 class="title-lg">닉네임을 정해주세요</h1>
    <p class="muted">친구들에게 이 이름으로 보여요</p>
    <div class="stack mt-5">
      <input id="nickname-input" type="text" maxlength="8" placeholder="8자 이내"
             class="input input-bordered input-lg w-full text-center font-semibold"
             autocomplete="off" autocapitalize="off">
      <button id="join-btn" class="btn btn-primary btn-lg btn-block">입장하기</button>
      <p id="join-error" class="text-error text-sm hidden"></p>
    </div>
  </section>

  <!-- 대기 -->
  <section id="screen-wait" class="screen centered">
    <div class="pulse-ring"><b id="wait-count">0</b></div>
    <h1 class="title-lg">시작을 기다리는 중</h1>
    <p class="muted">선생님이 시작하면 자동으로 넘어갑니다</p>
    <div class="howto" id="howto">
      <div class="howto-name" id="howto-name"></div>
      <p class="howto-desc" id="howto-desc"></p>
      <p class="howto-keys" id="howto-keys"></p>
    </div>
    <div class="roster" id="roster"></div>
  </section>

  <!-- 게임 -->
  <section id="screen-game" class="screen">
    <div class="topbar">
      <div class="chip hot"><span class="k" id="k-main">SCORE</span><span class="v num" id="game-score">0</span></div>
      <div class="chip" id="chip-a"><span class="k" id="k-a">LINES</span><span class="v num" id="val-a">0</span></div>
      <div class="chip" id="chip-b"><span class="k" id="k-b">LEVEL</span><span class="v num" id="val-b">1</span></div>
      <div class="spacer"></div>
      <div class="chip next-box" id="next-box"><span class="k">NEXT</span><canvas id="next-canvas"></canvas></div>
      <button id="mute-btn" class="btn btn-square btn-sm btn-ghost" aria-label="소리 끄기">♪</button>
    </div>
    <div class="canvas-wrap" id="canvas-wrap">
      <canvas id="game-canvas"></canvas>
      <div class="kart-hud hidden" id="kart-hud">
        <div class="hud-tl">
          <div class="pos-box"><b class="num" id="hud-rank">1</b><span id="hud-total">/1</span></div>
          <div class="lap-box">LAP <b class="num" id="hud-lap">1</b><span id="hud-laps">/3</span></div>
        </div>
        <div class="hud-bl hidden">
          <div class="speedo">
            <div class="sp-bar"><i id="hud-speed-bar"></i></div>
            <div class="sp-num"><b class="num" id="hud-speed">0</b><span>km/h</span></div>
          </div>
        </div>
        <div class="hud-br">
          <div class="item-rack">
            <div class="item-slot" id="item-slot-0"><span></span></div>
            <div class="item-slot small" id="item-slot-1"><span></span></div>
          </div>
          <div class="item-name" id="item-name"></div>
        </div>
        <div class="hud-badges" id="hud-badges"></div>
      </div>
    </div>
    <div class="pad" id="pad"></div>
  </section>

  <!-- 결과 -->
  <section id="screen-over" class="screen centered">
    <div class="badge badge-primary badge-lg mb-3" id="over-chip"></div>
    <p class="muted" id="over-label">최종 점수</p>
    <div class="result-score num" id="final-score">0</div>
    <p class="muted" id="final-detail"></p>
    <div class="stats bg-base-200 shadow mt-5 hidden" id="rank-stat">
      <div class="stat place-items-center py-4">
        <div class="stat-title text-xs">전체 순위</div>
        <div class="stat-value text-primary text-3xl num" id="rank-value">-</div>
        <div class="stat-desc" id="rank-desc"></div>
      </div>
    </div>
  </section>

  <!-- 자체 화면을 가진 학습 게임 -->
  <section id="screen-dom" class="screen">
    <div class="dom-host" id="dom-host"></div>
  </section>

  <!-- 게임을 나왔을 때 -->
  <section id="screen-exit" class="screen centered">
    <div class="badge badge-primary badge-lg mb-3" id="exit-chip"></div>
    <h1 class="title-lg">게임을 나왔습니다</h1>
    <p class="muted">다시 시작하거나 선생님을 기다려주세요</p>
    <div class="stack mt-5">
      <button id="exit-again" class="btn btn-primary btn-lg btn-block">다시 시작</button>
    </div>
  </section>

  <!-- 종료 -->
  <section id="screen-ended" class="screen centered">
    <h1 class="title-lg">수업이 끝났습니다</h1>
    <p class="muted">함께해줘서 고마워요</p>
    <div class="stack mt-5">
      <button id="rejoin-btn" class="btn btn-primary btn-lg btn-block">다시 참여하기</button>
      <p class="muted text-sm">선생님이 다시 시작하면 자동으로 넘어갑니다</p>
    </div>
  </section>

</div>

<div id="overlay" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js?v=2026-10-15c"></script>
<script src="sound.js?v=2026-10-15c"></script>
<script src="shared.js?v=2026-10-15c"></script>
<script src="fx.js?v=2026-10-15c"></script>
<script src="tetris-engine.js?v=2026-10-15c"></script>
<script src="racing-engine.js?v=2026-10-15c"></script>
<script src="snake-engine.js?v=2026-10-15c"></script>
<script src="breakout-engine.js?v=2026-10-15c"></script>
<script src="flappy-engine.js?v=2026-10-15c"></script>
<script src="shooter-engine.js?v=2026-10-15c"></script>
<script src="three.min.js"></script>
<script src="fps-engine.js?v=2026-10-15c"></script>
<script src="fps3d-engine.js?v=2026-10-15c"></script>
<script src="game2048-engine.js?v=2026-10-15c"></script>
<script src="frogger-engine.js?v=2026-10-15c"></script>
<script src="frogger3d-engine.js?v=2026-10-15c"></script>
<script src="asteroids-engine.js?v=2026-10-15c"></script>
<script src="maze-engine.js?v=2026-10-15c"></script>
<script src="tower-engine.js?v=2026-10-15c"></script>
<script src="missile-engine.js?v=2026-10-15c"></script>
<script src="centipede-engine.js?v=2026-10-15c"></script>
<script src="source-engine.js?v=2026-10-15c"></script>
<script src="arena-engine.js?v=2026-10-15c"></script>
<script src="arena3d-engine.js?v=2026-10-15c"></script>
<script src="slither-engine.js?v=2026-10-15c"></script>
<script src="kart3d-engine.js?v=2026-10-15c"></script>
<script src="kart3dx-engine.js?v=2026-10-15c"></script>
<script src="games.js?v=2026-10-15c"></script>
<script src="app.js?v=2026-10-15c"></script>
<script>
(function () {

  const BUILD = '2026-10-15c';   // 화면 아래에 표시됩니다

  const gameId = getGameId();
  const def = GAMES[gameId];
  const isHtml = (def.type === 'html');      // 자체 화면을 가진 학습 게임
  const isTetris = (gameId === 'tetris');
  const isKart = !!(GAMES[gameId] && GAMES[gameId].hasTracks && GAMES[gameId].trackKind !== 'map');   // 카트 계열 (아이템전 · 노템전) — FPS 의 '맵' 선택과 구분
  const isRealtime = isKart || !!(GAMES[gameId] && GAMES[gameId].realtime);   // 위치를 실시간으로 주고받는 게임

  applyAccent(gameId);
  document.getElementById('join-chip').textContent = def.name;
  document.getElementById('over-chip').textContent = def.name;

  document.getElementById('exit-chip').textContent = def.name;
  document.getElementById('howto-name').textContent = def.name;   // 팀 표시는 playerId 가 정해진 뒤 paintTeamLabel() 에서
  document.getElementById('howto-desc').textContent = def.desc || '';
  document.getElementById('howto-keys').textContent = def.howto ? '조작: ' + def.howto : '';
  // 점수 옆 보조 수치 두 칸 — 게임마다 무엇을 보여 줄지 정합니다
  const stats = def.stats || [];
  [['chip-a','k-a'],['chip-b','k-b']].forEach(([chip, k], i) => {
    if (stats[i]) document.getElementById(k).textContent = stats[i].label;
    else document.getElementById(chip).classList.add('hidden');
  });
  if (!def.hasNext) document.getElementById('next-box').classList.add('hidden');
  if (def.fullBleed) document.getElementById('canvas-wrap').classList.add('bleed');
  if (isKart) {
    document.querySelector('.topbar').classList.add('kart-mode');
    document.getElementById('kart-hud').classList.remove('hidden');
  }
  // 노템전: 이름(…pure…)으로 판단 — 3D 카트는 버튼을 화면에 직접 겹쳐 조작 목록이 비어 있어도 아이템전입니다
  if (isKart && (/pure/.test(gameId) || (!(GAMES[gameId].controls || []).includes('item') && GAMES[gameId].padLayout !== 'kart3dx'))) {
    const rack = document.querySelector('.item-rack'); if (rack) rack.classList.add('hidden');   // 노템전
  }
  if (GAMES[gameId] && ['joystick', 'arena', 'slither'].indexOf(GAMES[gameId].padLayout) >= 0) {   // 레이저 태그·젬 아레나·뱀 아레나: 게임 안 HUD 가 정보를 보여 주므로 위 막대 없이 전체 화면
    document.querySelector('.topbar').classList.add('kart-mode');   // 게임 안 HUD 가 점수·체력을 보여 주므로 위 칩은 숨김
  }

  // 내 자리를 서버에 (다시) 써 넣습니다.
  // 접속이 끊기면 onDisconnect 로 지워지므로, 돌아왔을 때 되살려야 명단에 다시 뜹니다.
  // ── 실제 화면 전송: 선생님이 내 화면을 열어 보는 동안만, 240px JPEG 을 초당 약 7장 ──
  //    (2D 캔버스 게임만. 카트·3D 는 교사 화면이 같은 엔진으로 관전하고, 과학 게임은 DOM 이라 전송 불가)
  let watchTimer = null, shotCv = null, screenRef = null;
  function setWatched(on) {
    if (!screenRef) screenRef = db.ref('screens/' + playerId);
    const can = on && started && !isRealtime && def.type === 'canvas';
    if (can && !watchTimer) {
      watchTimer = setInterval(() => {
        const cv = byId('game-canvas'); if (!cv || !cv.width) return;
        const w = 480, h = Math.round(cv.height * w / cv.width);   // 교사 화면에서 또렷하게
        if (!shotCv) shotCv = document.createElement('canvas');
        if (shotCv.width !== w || shotCv.height !== h) { shotCv.width = w; shotCv.height = h; }
        const g = shotCv.getContext('2d', { alpha: false });
        try { g.drawImage(cv, 0, 0, w, h); screenRef.set(shotCv.toDataURL('image/jpeg', 0.7)); } catch (e) {}
      }, 150);
      screenRef.onDisconnect().remove();
    } else if (!can && watchTimer) { clearInterval(watchTimer); watchTimer = null; screenRef.remove(); }
  }

  // 살아 있다는 신호 — 교사 화면이 끊긴 학생을 걸러 내는 데 씁니다
  setInterval(function () {
    if (joined) playerRef.update({ lastSeen: firebase.database.ServerValue.TIMESTAMP })["catch"](function () {});
  }, 5000);

  function rewritePlayer(status) {
    if (!myNickname) return Promise.resolve();
    return playerRef.set({
      nickname: myNickname, game: gameId, status: status,
      joinedAt: firebase.database.ServerValue.TIMESTAMP,
      lastSeen: firebase.database.ServerValue.TIMESTAMP,
      score: (game && typeof game.score === 'number') ? game.score : 0
    }).then(function () {
      myRosterRef.set(myNickname); myRosterRef.onDisconnect().remove();
      playerRef.onDisconnect().remove();
      myPosRef.onDisconnect().remove();
    })["catch"](function () {});
  }

  // 끊겼다가 다시 연결되면 자동으로 복구합니다
  db.ref('.info/connected').on('value', function (snap) {
    if (snap.val() !== true || !joined) return;
    rewritePlayer(started ? 'playing' : 'waiting');
  });

  // 종료 화면에서 다시 참여하기
  document.getElementById('rejoin-btn').addEventListener('click', function () {
    if (window.goFullscreen) window.goFullscreen();
    started = false;
    if (joined && myNickname) {
      // 이미 이름이 있으면 자리만 되살리고 대기실로
      rewritePlayer('waiting');
      show('screen-wait');
    } else {
      show('screen-join');
    }
  });

  // 새로고침·튕김·게임 이동 뒤에도 이름을 기억해 둡니다
  (function () {
    var prev = '', auto = '0';
    try {
      prev = sessionStorage.getItem('nickname') || '';
      auto = sessionStorage.getItem('autoJoin') || '0';
      sessionStorage.removeItem('autoJoin');
    } catch (e) {}
    if (!prev) return;
    var input = document.getElementById('nickname-input');
    if (input) input.value = prev;
    var btn = document.getElementById('join-btn');
    if (btn) btn.textContent = '다시 입장하기';
    // 선생님이 게임을 옮긴 경우엔 누르지 않아도 알아서 들어갑니다
    if (auto === '1') setTimeout(function () { join(); }, 120);
  })();

  /* 화면 이동을 기록해 두고, 휴대폰의 뒤로가기로 페이지가 통째로 닫히지 않게 합니다.
     화면마다 "뒤로 가면 어디로 갈지" 를 정해 둡니다. (null 이면 뒤로가기 버튼을 숨김) */
  const BACK_TO = {
    'screen-join': null,          // 첫 화면
    'screen-wait': 'screen-join', // 대기 → 닉네임
    'screen-game': 'screen-wait',
    'screen-dom':  'screen-wait',
    'screen-over': 'screen-wait',
    'screen-exit': 'screen-wait',
    'screen-ended': null
  };
  let curScreen = 'screen-join';

  function show(id) {
    document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    curScreen = id;
    const back = BACK_TO[id];
    document.getElementById('nav-back').classList.toggle('hidden', !back);
    // 뒤로 갈 곳이 있으면 기록을 하나 쌓아 둡니다 (휴대폰 뒤로가기가 여기서 잡힙니다)
    if (back) { try { history.pushState({ screen: id }, ''); } catch (e) {} }
  }

  // 뒤로 가기 — 게임 중이면 멈추고 이전 화면으로
  function goBack() {
    const back = BACK_TO[curScreen];
    if (!back) return;
    if (curScreen === 'screen-game' || curScreen === 'screen-dom') {
      stopGame();
      if (isHtml) { try { App._stop(); } catch (e) {} document.getElementById('dom-host').innerHTML = ''; }
      started = false;
    }
    show(joined ? back : 'screen-join');
  }

  document.getElementById('nav-back').addEventListener('click', goBack);

  // 휴대폰·브라우저의 뒤로가기
  try { history.replaceState({ screen: 'screen-join' }, ''); } catch (e) {}
  window.addEventListener('popstate', function () {
    if (BACK_TO[curScreen]) goBack();
    else { try { history.pushState({ screen: curScreen }, ''); } catch (e) {} }  // 첫 화면에선 나가지 않게
  });

  // 실수로 탭을 닫을 때 확인 (게임 중일 때만)
  window.addEventListener('beforeunload', function (e) {
    if (!started || switching) return;
    e.preventDefault();
    e.returnValue = '';
  });

  // 지금 기기가 어떤 버전을 쓰는지 입장 화면에 작게 표시합니다
  (function () {
    const tag = document.createElement('div');
    tag.style.cssText = 'position:fixed;left:0;right:0;bottom:6px;text-align:center;' +
      'font:500 10px Pretendard,sans-serif;color:rgba(255,255,255,.28);pointer-events:none;z-index:50';
    tag.textContent = 'v' + BUILD;
    document.body.appendChild(tag);
  })();

  let joined = false;          // 닉네임을 넣고 입장하기를 눌렀는지
  let switching = false;       // 다른 게임으로 옮겨 가는 중
  let playerId = sessionStorage.getItem('playerId');
  if (!playerId) {
    playerId = 'p_' + Math.random().toString(36).slice(2, 10);
    sessionStorage.setItem('playerId', playerId);
  }

  const playerRef  = db.ref('players/' + playerId);
  const rosterRef  = db.ref('roster');                 // {id: 닉네임} — 학생 기기는 이것만 구독합니다 (players 는 교사만)
  // 팀전(레이저 태그 팀전 · 젬 아레나): 대기 화면에 내 팀 표시
  // 젬 아레나: 대기 화면에서 캐릭터 고르기 (카드를 톡 — 선택은 기기에 저장, 다음 판에도 유지)
  // 캐릭터 카드 만들기 (대기 화면 · 선택 화면 공용). onPick(id) 는 카드를 눌렀을 때
  function makeCharCards(wrap, onPick) {
    wrap.innerHTML = '';
    const cur = sessionStorage.getItem('charId') || '';
    const maxHp = 160, maxDps = 140, maxSp = 1.25;
    Object.keys(AR_CHARS).forEach(id => { const c = AR_CHARS[id], dps = Math.round(c.shot.n * c.shot.dmg / (c.shot.cd / 1000));
      const el = document.createElement('button'); el.type = 'button'; el.className = 'char-card' + (id === cur ? ' on' : ''); el.dataset.id = id;
      const bar = (label, v, max, col) => '<div class="cbar"><span>' + label + '</span><i><b style="width:' + Math.round(v / max * 100) + '%;background:' + col + '"></b></i></div>';
      el.innerHTML = '<div class="cicon"><img src="assets/arena/' + id + '.png" alt="" onerror="this.replaceWith(document.createTextNode(\'' + c.icon + '\'))"></div><div class="cname">' + c.name + '</div><div class="crole">' + c.role + '</div>' +
        bar('체력', c.hp, maxHp, '#06D6A0') + bar('공격', dps, maxDps, '#FF5C7A') + bar('속도', c.speed, maxSp, '#4CC9F0') + '<div class="csup">★ ' + c.sup.label + ' — ' + c.sup.desc + '</div>';
      el.addEventListener('click', () => { sessionStorage.setItem('charId', id); wrap.querySelectorAll('.char-card').forEach(x => x.classList.toggle('on', x === el)); if (onPick) onPick(id); });
      wrap.appendChild(el); });
  }

  // ── 캐릭터 선택 화면 (교사가 [게임 시작] 을 누르면 10초) ──
  let selectOverlay = null, selectTimer = null, picksRef = null;
  function openCharSelect(selectUntilTs) {
    if (!def.chars || typeof AR_CHARS === 'undefined') return;
    if (!selectOverlay) {
      selectOverlay = document.createElement('div'); selectOverlay.id = 'char-select'; selectOverlay.className = 'char-select';
      selectOverlay.innerHTML = '<div class="cs-head"><div class="cs-title">캐릭터를 고르세요</div><div class="cs-time" id="cs-time">20</div></div><div class="cs-team" id="cs-team"></div>' +
        '<div class="cs-bar"><i id="cs-bar"></i></div><div class="char-pick" id="cs-cards"></div><div class="cs-foot" id="cs-foot">모두 고르면 바로 시작해요</div>';
      document.body.appendChild(selectOverlay);
      makeCharCards(document.getElementById('cs-cards'), id => {
        db.ref('picks/' + playerId).set(id);
        document.getElementById('cs-foot').textContent = AR_CHARS[id].name + ' 선택! 친구들을 기다리는 중… (바꿀 수 있어요)';
      });

      if (e.code === 'Space') game.input.drift = false; if (e.code === 'ArrowDown' || e.code === 'KeyS') game.input.brake = false; });
  }

  // 3D 카트(2D 카트 규칙) 조작: 게임 화면 위에 겹침 — 왼손 ◀ ▶ · 오른손 드리프트(크게) · 아이템 · 버리기
  function buildKart3DXControls() {
    const wrap = byId('canvas-wrap'); let ctl = byId('fps-ctl'); if (ctl) ctl.remove();
    const items = !/pure/.test(gameId);
    ctl = document.createElement('div'); ctl.id = 'fps-ctl'; ctl.className = 'k3-ctl';
    ctl.innerHTML = '<div class="k3-left"><button class="k3b" id="k3l">◀</button><button class="k3b" id="k3r">▶</button></div>' +
      '<div class="k3-right">' + (items ? '<button class="k3b brake" id="k3x">✕<small>버리기</small></button><button class="k3b item" id="k3i">🎁<small>아이템</small></button>' : '') +
      '<button class="k3b drift" id="k3d">드리프트</button></div>' +
      '<div class="fhint" id="fhint">◀ ▶ 조향 · 꺾으면서 드리프트를 누르면 미끄러지며 빠르게 회전 · 놓으면 부스터' + (items ? ' · 🎁 아이템' : '') + '</div>';
    wrap.appendChild(ctl); document.body.classList.add('k3x-on');           // 속도계·아이템 칸을 버튼 위로 올림 (style.css)
    setTimeout(() => { const h = byId('fhint'); if (h) h.classList.add('fade'); }, 4500);
    const hold = (id, on, off) => { const el = byId(id); if (!el) return;
      const a = e => { e.preventDefault(); el.classList.add('on'); on(); }, b = e => { e.preventDefault(); el.classList.remove('on'); off(); };
      el.addEventListener('touchstart', a, { passive: false }); el.addEventListener('touchend', b); el.addEventListener('touchcancel', b);
      el.addEventListener('mousedown', a); el.addEventListener('mouseup', b); el.addEventListener('mouseleave', e => { if (el.classList.contains('on')) b(e); }); };
    hold('k3l', () => game && game.move(-1), () => game && game.releaseSteer(-1));
    hold('k3r', () => game && game.move(1), () => game && game.releaseSteer(1));
    hold('k3d', () => game && game.drift && game.drift(true), () => game && game.drift && game.drift(false));
    hold('k3i', () => game && game.useItem(), () => {});
    hold('k3x', () => game && game.dropItem(), () => {});
    // PC 키보드: Shift · X 드리프트 (방향키·아이템 키는 기존 카트 단축키 그대로)
    addEventListener('keydown', e => { if (!game || !game.drift) return; if (e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyX') game.drift(true); });
    addEventListener('keyup', e => { if (!game || !game.drift) return; if (e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyX') game.drift(false); });
  }

  // 요소와 조상들의 CSS zoom 을 곱한 배율 — 버튼판을 통째로 확대했을 때 조이스틱 손잡이가 너무 멀리 가지 않게
  function zoomOf(el) { let z = 1; for (let e = el; e && e !== document.documentElement; e = e.parentElement) { const v = parseFloat(getComputedStyle(e).zoom); if (v && v !== 1) z *= v; } return z; }

  function buildArenaControls(mode) {
    const slither = mode === 'slither';
    const wrap = byId('canvas-wrap');
    let ctl = byId('fps-ctl'); if (ctl) ctl.remove();
    ctl = document.createElement('div'); ctl.id = 'fps-ctl'; ctl.className = 'arena-ctl';
    ctl.innerHTML =
      '<div class="fjoy" id="fjoy"><div class="fjoy-base"><div class="fjoy-knob"></div></div></div>' +
      (slither ? '<button class="asuper aboost" id="aboost">⚡<small>부스트</small></button>'
               : '<button class="ffire" id="afire"><span>●</span>발사<div class="pips"><i class="pip on"></i><i class="pip on"></i><i class="pip on"></i></div></button><button class="asuper" id="asuper">★<small>0%</small></button>') +
      '<div class="fhint" id="fhint">' + (slither ? '조이스틱: 방향 · ⚡ 꾹: 부스트(길이 소모) · 큰 뱀에 닿지 마세요' : '조이스틱: 이동(총구도 그 방향) · ● 발사(가까운 적 자동 조준, 꾹 누르면 연사) · ★ 궁극기') + '</div>';
    wrap.appendChild(ctl);
    // 안내 문구는 처음 4초만 보이고 서서히 사라집니다 (레이저 태그와 같은 방식)
    setTimeout(() => { const h = byId('fhint'); if (h) h.classList.add('fade'); }, 4000);
    if (slither) {
      const bst = byId('aboost');
      const on = () => { if (game && game.setBoost) game.setBoost(true); bst.classList.add('ready'); }, off = () => { if (game && game.setBoost) game.setBoost(false); bst.classList.remove('ready'); };
      bst.addEventListener('touchstart', e => { e.preventDefault(); on(); }, { passive: false }); ['touchend', 'touchcancel'].forEach(ev => bst.addEventListener(ev, off));
      bst.addEventListener('mousedown', on); bst.addEventListener('mouseup', off); bst.addEventListener('mouseleave', off);
    }
    const mk = (el, onMove, onEnd) => {
      const base = el.querySelector('.fjoy-base'), knob = el.querySelector('.fjoy-knob');
      let id = null, cx = 0, cy = 0, R = 46, lx = 0, ly = 0;
      const set = (dx, dy) => { const d = Math.hypot(dx, dy), k = d > R ? R / d : 1; knob.style.transform = 'translate(' + (dx * k / zoomOf(knob)) + 'px,' + (dy * k / zoomOf(knob)) + 'px)'; lx = dx * k / R; ly = dy * k / R; onMove(lx, ly); };
      return {
        grab(t) { const br = base.getBoundingClientRect(); cx = br.left + br.width / 2; cy = br.top + br.height / 2; R = br.width * 0.31;
          const near = Math.hypot(t.clientX - cx, t.clientY - cy) < br.width * 0.85; if (!near || id !== null) return false;
          id = t.identifier; el.classList.add('on'); set(t.clientX - cx, t.clientY - cy); return true; },
        move(t) { if (t.identifier !== id) return; set(t.clientX - cx, t.clientY - cy); },
        end(t) { if (t.identifier !== id) return; id = null; el.classList.remove('on'); knob.style.transform = ''; onEnd(lx, ly); lx = 0; ly = 0; }
      };
    };
    const L = mk(byId('fjoy'), (x, y) => game && game.setMove && game.setMove(x, y), () => game && game.setMove && game.setMove(0, 0));
    const A = { grab: () => false, move: () => {}, end: () => {} };   // 조준 조이스틱 없음 — 총구는 이동 방향, 발사는 자동 조준
    const on = (ev, fn) => ctl.addEventListener(ev, e => { let used = false; for (const t of e.changedTouches) { if (t.target.closest && t.target.closest('button')) continue; fn(t); used = true; } if (used) e.preventDefault(); }, { passive: false });
    on('touchstart', t => { if (!L.grab(t)) A.grab(t); });
    on('touchmove', t => { L.move(t); A.move(t); });
    on('touchend', t => { L.end(t); A.end(t); }); on('touchcancel', t => { L.end(t); A.end(t); });
    if (!slither) { tapBtn(byId('asuper'), () => game && game.useSuper && game.useSuper());
      // 궁극기 버튼: 충전 링(원형 게이지) + 다 차면 노랗게 맥동 · 발사 버튼: 탄약 3점
      setInterval(() => { const b = byId('asuper'), fb2 = byId('afire'); if (!b || !game) return;
        const k = Math.max(0, Math.min(100, game.super || 0)); b.classList.toggle('ready', k >= 100);
        b.style.setProperty('--sup', k + '%'); b.querySelector('small').textContent = k >= 100 ? (game.ch ? game.ch.sup.label : '궁극기') : Math.round(k) + '%';
        if (fb2) { const pips = fb2.querySelectorAll('.pip'); pips.forEach((pp, i) => pp.classList.toggle('on', i < Math.floor(game.ammo == null ? 3 : game.ammo))); } }, 120);
      // 발사 버튼: 톡 = 한 번, 꾹 = 연사 (엔진의 0.48초 간격을 따름)
      const fb = byId('afire'); let fireTimer = null;
      const fireOn = () => { if (game && game.fire) game.fire(); fb.classList.add('on'); clearInterval(fireTimer); fireTimer = setInterval(() => { if (game && game.fire) game.fire(); }, 100); };
      const fireOff = () => { clearInterval(fireTimer); fireTimer = null; fb.classList.remove('on'); };
      fb.addEventListener('touchstart', e => { e.preventDefault(); fireOn(); }, { passive: false }); ['touchend', 'touchcancel'].forEach(ev => fb.addEventListener(ev, fireOff));
      fb.addEventListener('mousedown', fireOn); ['mouseup', 'mouseleave'].forEach(ev => fb.addEventListener(ev, fireOff)); }
    // PC: WASD 이동 · 마우스 조준 · 클릭 발사 · Space 궁극기
    const cv = byId('game-canvas');
    cv.addEventListener('mousemove', e => { if (!game) return; const r = cv.getBoundingClientRect(); const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
      if (slither) { if (game.setMove) game.setMove(dx / 120, dy / 120); } else if (game.setAim) { game.setAim(dx / 120, dy / 120); clearTimeout(window.__aimT); window.__aimT = setTimeout(() => game.setAim && game.setAim(null), 1500); } });
    cv.addEventListener('mousedown', e => { if (!game || !game.releaseAim) return; const r = cv.getBoundingClientRect(); const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2); game.releaseAim(dx / 120, dy / 120); });
  }

  function buildFloatingControls() {
    const wrap = byId('canvas-wrap');
    let ctl = byId('fps-ctl'); if (ctl) ctl.remove();
    ctl = document.createElement('div'); ctl.id = 'fps-ctl';
    ctl.innerHTML =
      '<div class="fjoy" id="fjoy"><div class="fjoy-base"><div class="fjoy-knob"></div></div></div>' +
      '<button class="ffire" id="ffire" aria-label="발사"><span>●</span><small>발사</small></button>' +
      '<button class="freload" id="freload">↻ 재장전</button>' +
      '<button class="fjump" id="fjump">⤒ 점프</button>' +
      '<button class="froll" id="froll">⤻ 구르기</button>' +
      '<div class="fwpns" id="fwpns">' +
        '<button class="fwpn on" data-w="rifle">🔫 라이플</button>' +
        '<button class="fwpn" data-w="sniper">🎯 스나이퍼</button>' +
      '</div>' +
      '<button class="fzoom" id="fzoom">🔍</button>' +
      '<button class="fboard" id="fboard">📊</button>' +
      '<div class="fopts">' +
        '<button class="fopt" id="fopt-gyro">자이로</button>' +
        '<button class="fopt" id="fopt-sens">감도 ×1</button>' +
      '</div>' +
      '<div class="fhint" id="fhint">조이스틱: 이동(두 번 톡 = 구르기) · 화면 끌기: 조준 · ●: 발사</div>';
    wrap.appendChild(ctl);
    const joy = byId('fjoy'), base = joy.querySelector('.fjoy-base'), knob = joy.querySelector('.fjoy-knob');
    setTimeout(() => { const h = byId('fhint'); if (h) h.classList.add('fade'); }, 3500);
    // HUD(체력·탄약)가 버튼과 겹치지 않도록 버튼 위치를 재서 엔진에 알려 줍니다
    const measureHud = () => {
      if (!game || !game.setHudSafe) return;
      const cv = byId('game-canvas').getBoundingClientRect(), jb = byId('fjoy').querySelector('.fjoy-base').getBoundingClientRect();
      const bandTop = jb.top - 8;                                  // 조이스틱 높이의 바닥 띠 안에 있는 오른쪽 버튼들
      let rightLeft = cv.right;
      ['ffire', 'fzoom', 'fjump', 'froll', 'freload', 'fwpns'].forEach(id => { const el = byId(id); if (!el) return; const r = el.getBoundingClientRect();
        if (r.width > 0 && r.bottom > bandTop) rightLeft = Math.min(rightLeft, r.left); });
      // 줌 버튼은 스나이퍼일 때만 보이지만 자리를 미리 비워 둡니다
      const zb = byId('fzoom'); if (zb) { const cs = getComputedStyle(zb); const right = parseFloat(cs.right) || 0, w = parseFloat(cs.width) || 0; rightLeft = Math.min(rightLeft, cv.right - right - w); }
      game.setHudSafe({ joyTop: jb.top - cv.top, joyBottom: jb.bottom - cv.top, joyRight: jb.right - cv.left, rightLeft: rightLeft - cv.left });
    };
    window.__measureHud = measureHud;                     // 게임이 만들어진 뒤에도 한 번 더 부릅니다 (startGame)
    requestAnimationFrame(measureHud);
    window.addEventListener('resize', () => setTimeout(measureHud, 60));
    window.addEventListener('orientationchange', () => setTimeout(measureHud, 400));

    // 터치 배분: 조이스틱은 왼쪽 아래에 '고정' — 그 근처를 짚으면 조이스틱, 나머지는 조준 (버튼 위는 버튼)
    let joyId = null, jcx = 0, jcy = 0, R = 46, lookId = null, lx = 0, ly = 0;
    const setJoy = (dx, dy) => { const d = Math.hypot(dx, dy), k = d > R ? R / d : 1; knob.style.transform = 'translate(' + (dx * k / zoomOf(knob)) + 'px,' + (dy * k / zoomOf(knob)) + 'px)'; if (game && game.setMove) game.setMove(dx * k / R, -dy * k / R); };
    // 버튼 위 터치는 버튼에 맡깁니다 (여기서 preventDefault 하면 버튼의 click 이 안 생깁니다)
    const onStart = e => {
      let used = false;
      for (const t of e.changedTouches) {
        if (t.target.closest && t.target.closest('button')) continue;
        used = true;
        const br = base.getBoundingClientRect();
        const bcx = br.left + br.width / 2, bcy = br.top + br.height / 2, baseR = br.width / 2;
        const near = Math.hypot(t.clientX - bcx, t.clientY - bcy) < baseR * 1.7;   // 조이스틱 근처(반지름 1.7배 안)
        if (near && joyId === null) {
          const tnow = Date.now();
          if (tnow - lastJoyTap < 300 && game && game.roll) game.roll();     // 두 번 톡 = 구르기
          lastJoyTap = tnow;
          joyId = t.identifier; jcx = bcx; jcy = bcy; R = baseR * 0.62;
          joy.classList.add('on'); setJoy(t.clientX - bcx, t.clientY - bcy);
        } else if (lookId === null) { lookId = t.identifier; lx = t.clientX; ly = t.clientY; }
      }
      if (used) e.preventDefault();
    };
    // 버튼: 터치는 touchend 에서 바로 실행(브라우저 click 지연·누락 없이), 마우스는 click

      for (const t of e.changedTouches) {
        if (t.identifier === joyId) setJoy(t.clientX - jcx, t.clientY - jcy);
        else if (t.identifier === lookId && game && game.look) { game.look((t.clientX - lx) * fpsOpt.sens, (t.clientY - ly) * fpsOpt.sens); lx = t.clientX; ly = t.clientY; }
      }
      e.preventDefault();
    };
    const onEnd = e => {
      for (const t of e.changedTouches) {
        if (t.identifier === joyId) { joyId = null; joy.classList.remove('on'); knob.style.transform = ''; if (game && game.setMove) game.setMove(0, 0); }
        if (t.identifier === lookId) lookId = null;
      }

    ctl.addEventListener('touchmove', onMove, { passive: false });
    ctl.addEventListener('touchend', onEnd); ctl.addEventListener('touchcancel', onEnd);

    const fire = byId('ffire');
    const fireOn = e => { e.preventDefault(); e.stopPropagation(); if (game) { game.firing = true; if (game.fire) game.fire(); } fire.classList.add('on'); };
    const fireOff = () => { if (game) game.firing = false; fire.classList.remove('on'); };
    fire.addEventListener('touchstart', fireOn, { passive: false }); fire.addEventListener('touchend', fireOff); fire.addEventListener('touchcancel', fireOff);
    fire.addEventListener('mousedown', fireOn); fire.addEventListener('mouseup', fireOff);
    tapBtn(byId('freload'), () => game && game.reload && game.reload());
    tapBtn(byId('fjump'), () => game && game.jump && game.jump());
    tapBtn(byId('froll'), () => game && game.roll && game.roll());
    // 왼쪽 조이스틱을 두 번 톡 → 그 방향으로 구르기 (한 손 조작)
    let lastJoyTap = 0;
    // 무기 칩: 누른 무기로 바로 바꿉니다 (이미 그 무기면 아무 일도 없음)
    const paintWeapon = () => { if (!game) return;
      document.querySelectorAll('#fwpns .fwpn').forEach(b => b.classList.toggle('on', b.dataset.w === game.weapon));
      byId('fzoom').classList.toggle('hidden', game.weapon !== 'sniper');
      byId('fzoom').classList.toggle('on', !!game.zoomed); };
    document.querySelectorAll('#fwpns .fwpn').forEach(b => tapBtn(b, () => {
      if (!game || !game.switchWeapon) return;
      if (game.weapon !== b.dataset.w) game.switchWeapon();
      paintWeapon();
    }));
    tapBtn(byId('fzoom'), () => { if (game && game.toggleZoom) { game.toggleZoom(); paintWeapon(); } });
    // 무기는 위의 무기 칩(또는 PC 의 Q)으로만 바뀝니다.
    // 발사 버튼 길게 누르기로 바꾸던 기능은 연사와 겹쳐(꾹 누르면 0.4초 뒤 총이 바뀜) 제거했습니다.
    setInterval(paintWeapon, 300);        // 줌 상태 등을 화면과 맞춤
    setTimeout(paintWeapon, 0);
    // 점수판: 누르고 있는 동안 표시 (PC 는 Tab)
    const fb = byId('fboard');
    const bOn = e => { e.preventDefault(); e.stopPropagation(); if (game) game.showBoard = true; fb.classList.add('on'); };
    const bOff = () => { if (game) game.showBoard = false; fb.classList.remove('on'); };
    fb.addEventListener('touchstart', bOn, { passive: false }); fb.addEventListener('touchend', bOff); fb.addEventListener('touchcancel', bOff);
    fb.addEventListener('mousedown', bOn); fb.addEventListener('mouseup', bOff); fb.addEventListener('mouseleave', bOff);

    // PC: 마우스 조준 (클릭하면 잠금, Esc 해제)
    const canvas = byId('game-canvas');
    ctl.addEventListener('mousedown', e => { if (e.target.closest('button')) return; if (!game) return;
      if (document.pointerLockElement !== canvas) { canvas.requestPointerLock && canvas.requestPointerLock(); } else { game.firing = true; game.fire(); } });
    ctl.addEventListener('mouseup', e => { if (game && !e.target.closest('button')) game.firing = false; });
    document.addEventListener('mousemove', e => { if (game && game.look && document.pointerLockElement === canvas) game.look(e.movementX * fpsOpt.sens, e.movementY * fpsOpt.sens); });

    // 옵션
    const paint = () => {
      byId('fopt-gyro').classList.toggle('on', fpsOpt.gyro);
      byId('fopt-sens').textContent = '감도 ×' + fpsOpt.sens;
    };
    tapBtn(byId('fopt-sens'), () => { fpsOpt.sens = fpsOpt.sens === 1 ? 1.5 : (fpsOpt.sens === 1.5 ? 0.7 : 1); saveOpt(); paint(); });
    tapBtn(byId('fopt-gyro'), () => { fpsOpt.gyro = !fpsOpt.gyro; saveOpt(); paint(); if (fpsOpt.gyro) startGyro(); else stopGyro(); });
    paint(); if (fpsOpt.gyro) startGyro();
  }

  // 자이로 조준 — 기기를 기울이면 시선이 따라갑니다 (미세 조준용)
  let gyroHandler = null;
  function startGyro() {
    const attach = () => {
      if (gyroHandler) return;
      let last = 0;
      gyroHandler = e => {
        const rr = e.rotationRate; if (!rr || !game || !game.look) return;
        const now = performance.now(); const dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016; last = now;
        const land = Math.abs(window.orientation || 0) === 90 || window.innerWidth > window.innerHeight;
        // 세로: alpha(가로축 회전)=상하, beta(세로축)=좌우 · 가로: 반대로
        const yawRate = land ? rr.alpha : rr.beta, pitchRate = land ? rr.beta : rr.alpha;
        if (Math.abs(yawRate) < 3 && Math.abs(pitchRate) < 3) return;           // 손떨림 무시
        game.look(-(yawRate || 0) * dt * 6 * fpsOpt.sens, -(pitchRate || 0) * dt * 6 * fpsOpt.sens);
      };
      window.addEventListener('devicemotion', gyroHandler);
    };
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      DeviceMotionEvent.requestPermission().then(st => { if (st === 'granted') attach(); else { fpsOpt.gyro = false; saveOpt(); const b = byId('fopt-gyro'); if (b) b.classList.remove('on'); } })["catch"](() => {});
    } else attach();
  }
  function stopGyro() { if (gyroHandler) { window.removeEventListener('devicemotion', gyroHandler); gyroHandler = null; } }

  // 둥근 조이스틱 — 손가락 위치를 -1~1 벡터로 게임에 넘깁니다
  function bindJoystick(base, knob) {
    let id = null, cx = 0, cy = 0, R = 44;
    const set = (dx, dy) => {
      const d = Math.hypot(dx, dy), k = d > R ? R / d : 1;
      knob.style.transform = 'translate(' + (dx * k / zoomOf(knob)) + 'px,' + (dy * k / zoomOf(knob)) + 'px)';
      if (game && game.setMove) game.setMove(dx * k / R, -dy * k / R);
    };
    base.addEventListener('touchstart', e => {
      if (id !== null) return;
      const t = e.changedTouches[0]; id = t.identifier;
      const r = base.getBoundingClientRect(); cx = r.left + r.width / 2; cy = r.top + r.height / 2; R = r.width * 0.34;
      base.classList.add('on'); set(t.clientX - cx, t.clientY - cy); e.preventDefault();
    }, { passive: false });
    base.addEventListener('touchmove', e => {
      for (const t of e.changedTouches) if (t.identifier === id) { set(t.clientX - cx, t.clientY - cy); e.preventDefault(); }
    }, { passive: false });
    const end = e => { for (const t of e.changedTouches) if (t.identifier === id) { id = null; base.classList.remove('on'); knob.style.transform = ''; if (game && game.setMove) game.setMove(0, 0); } };
    base.addEventListener('touchend', end); base.addEventListener('touchcancel', end);
  }

  // 조작 패드 — 왼쪽에 방향키, 오른쪽에 특수키 (양손 잡기 편하게)
  const DIR_KEYS = ['left', 'right', 'up', 'down'];
  function buildPad() {
    const pad = document.getElementById('pad');
    pad.innerHTML = '';
    pad.className = 'pad' + (isKart ? ' pad-kart' : '');
    const mk = c => {
      const b = document.createElement('button');
      b.id = 'btn-' + c;
      b.className = PAD[c].cls;
      b.textContent = (def.labels && def.labels[c]) || PAD[c].label;
      b.setAttribute('aria-label', b.textContent);
      return b;
    };
    if (def.padLayout === 'joystick') {
      // 아래 패드는 비우고(화면을 넓게), 조작은 게임 화면 위에 띄웁니다 (모바일 FPS 방식)
      pad.classList.add('pad-none');
      buildFloatingControls();
      return;
    }
    if (def.padLayout === 'arena') { pad.classList.add('pad-none'); buildArenaControls('arena'); return; }   // 양손 조이스틱
    if (def.padLayout === 'slither') { pad.classList.add('pad-none'); buildArenaControls('slither'); return; }  // 조이스틱 + 부스트
    if (def.padLayout === 'kart3d') { pad.classList.add('pad-none'); buildKart3DControls(); return; }
    if (def.padLayout === 'kart3dx') { pad.classList.add('pad-none'); buildKart3DXControls(); return; }   // 3D 카트(2D 규칙): 왼쪽 ◀ ▶ · 오른쪽 드리프트·아이템·버리기      // 3D 카트: 왼손 ◀ ▶ · 오른손 브레이크·아이템·드리프트
    if (def.padLayout === 'tap') { pad.classList.add('pad-none'); return; }   // 화면을 직접 누르는 게임
    const dirs = def.controls.filter(c => DIR_KEYS.indexOf(c) >= 0);
    const acts = def.controls.filter(c => DIR_KEYS.indexOf(c) < 0);
    // 상하좌우가 다 있는 게임(미로·타워·스네이크·2048·길 건너기): 왼쪽에 십자 D-패드, 오른쪽에 특수키
    // 타워 오르기: 왼손 ← → , 오른손 ↑(오르기) ↓ + 점프 — 오르기 키가 오른쪽에
    if (def.padLayout === 'climb') {
      pad.classList.add('pad-climb');
      const L = document.createElement('div'); L.className = 'pad-lr'; L.appendChild(mk('left')); L.appendChild(mk('right'));
      const R = document.createElement('div'); R.className = 'pad-ud';
      const up = mk('up'); up.textContent = '↑'; up.title = '오르기'; R.appendChild(up);
      acts.forEach(c => R.appendChild(mk(c)));
      if (dirs.indexOf('down') >= 0) R.appendChild(mk('down'));
      pad.append(L, R);
      return;
    }
    // — 네 방향이 같은 크기·같은 거리에 있어 엄지 하나로 균형 있게 누를 수 있습니다
    if (dirs.indexOf('up') >= 0 && dirs.indexOf('down') >= 0 && dirs.indexOf('left') >= 0 && dirs.indexOf('right') >= 0) {
      pad.classList.add('pad-cross');
      const D = document.createElement('div'); D.className = 'dpad';
      D.appendChild(mk('up')); D.appendChild(mk('left')); D.appendChild(mk('right')); D.appendChild(mk('down'));
      pad.appendChild(D);
      if (acts.length) { const R = document.createElement('div'); R.className = 'pad-r'; acts.forEach(c => R.appendChild(mk(c))); pad.appendChild(R); }
      else pad.classList.add('pad-single');
      return;
    }
    // 좌우 이동키가 있는 게임: ← 는 맨 왼쪽, → 는 맨 오른쪽, 나머지는 가운데 (양손 엄지)
    if (dirs.indexOf('left') >= 0 && dirs.indexOf('right') >= 0) {
      pad.classList.add('pad-split');
      const L = document.createElement('div'); L.className = 'pad-edge'; L.appendChild(mk('left'));
      const C = document.createElement('div'); C.className = 'pad-mid';
      // 가운데 세로 배치 순서: ▲ · 회전/발사 · ↓ · 바로 내리기 · 버리기
      // (회전과 '바로 내리기' 를 ↓ 로 갈라놓고 간격도 띄워, 잘못 누르는 일을 줄입니다)
      if (dirs.indexOf('up') >= 0) C.appendChild(mk('up'));
      acts.forEach(c => { if (c !== 'discard' && c !== 'drop') C.appendChild(mk(c)); });
      if (dirs.indexOf('down') >= 0) C.appendChild(mk('down'));
      if (acts.indexOf('drop') >= 0) C.appendChild(mk('drop'));
      if (acts.indexOf('discard') >= 0) C.appendChild(mk('discard'));
      const R = document.createElement('div'); R.className = 'pad-edge'; R.appendChild(mk('right'));
      pad.append(L, C, R);
      return;
    }
    if (dirs.length) {
      const L = document.createElement('div');
      L.className = 'pad-l' + (dirs.indexOf('up') >= 0 ? ' has-up' : '') + (dirs.indexOf('down') >= 0 ? ' has-down' : '');
      dirs.forEach(c => L.appendChild(mk(c)));
      pad.appendChild(L);
    }
    if (acts.length) {
      const R = document.createElement('div');
      R.className = 'pad-r';
      acts.forEach(c => R.appendChild(mk(c)));
      pad.appendChild(R);
    }
    pad.classList.toggle('pad-single', !dirs.length || !acts.length);
  }

  // ── 시작 ──
  function startGame() {
    started = true;
    Sound.resume();
    playerRef.update({ status: 'playing' });
    if (isHtml) { startHtmlGame(); return; }
    show('screen-game');
    buildPad();

    rosterRef.once('value').then(snap => {
      const r = snap.val() || {};
      Object.keys(r).forEach(id => { names[id] = r[id] || ''; });
      const order = Object.keys(r).sort();
      const slot = Math.max(0, order.indexOf(playerId));

      // 테트리스는 다른 사람 정보가 필요 없으므로 수신을 끊어 통신량을 아낌

      const canvas = document.getElementById('game-canvas');
      requestAnimationFrame(() => {
        fitCanvas();
        // 공통 출발 시각까지 남은 시간을 카운트다운으로 넘깁니다.
        // (기기마다 준비 시간이 달라도 같은 순간에 출발합니다. 늦게 들어온 학생은 바로 출발)
        const cd = sessionStartAt ? Math.max(0, (sessionStartAt - serverNow()) / 1000) : undefined;
        game = def.create(canvas, {
          countdown: cd, charId: (def.chars ? (sessionStorage.getItem('charId') || 'bolt') : undefined), teamInfo: (def.chars ? myTeamInfo() : undefined),
          cellSize: cellSize, trackId: trackId, slot: slot,
          myId: playerId, myName: myNickname,
          onDropHazard: dropHazard, onHitHazard: hitHazard, nameOf: id => names[id] || '',
          onAttack: sendAttack, onFinish: reportFinish,
          // 젬 아레나: 젬은 '먼저 쓴 사람' 이 갖습니다 (트랜잭션). 쓰러지면 그 자리에 새 젬을 놓습니다
          onGem: id => { gemsRef.child(id).transaction(g => { if (!g || g.by) return; g.by = playerId; return g; }); },
          onDropGems: drops => { drops.forEach((d, i) => gemsRef.child('d' + Date.now().toString(36) + i).set({ x: Math.round(d[0] * 10) / 10, y: Math.round(d[1] * 10) / 10 })); }
        });
        if (!isKart && def.padLayout !== 'joystick') readyGo();
        if (game.setQuality) game.setQuality(quality);
        qFrames = 0; qSum = 0; qLast = 0;
        if (window.FX) { FX.juice.reset(); if (window.Sound) FX.hookSound(Sound); } juiceScore = null; juicePopAt = 0;
        window.__game = game;                               // 검사·디버깅용
        if (window.__measureHud) { window.__measureHud(); setTimeout(window.__measureHud, 300); }   // HUD 가 버튼을 피하도록
        if (def.hasNext) { game.onNextChange = drawNextPreview; drawNextPreview(); }
        game.draw();
        bindControls();
        if (def.needsPeers) attachPeerSync();
        Sound.start();

        // 네트워크 전송이 프레임 중간에 끼어들면 그 순간 화면이 멈칫합니다.
        // 타이머는 '보낼 때'만 표시하고, 실제 전송은 그리기가 끝난 뒤에 합니다.
        syncTimer = setInterval(() => { syncDue = true; }, isRealtime ? 165 : 250);
        requestAnimationFrame(loop);
      });
    });
  }

  // ══ 자체 화면 학습 게임 (광합성 · 힘 · 몸속 여행) ══
  // 원본 파일을 그대로 불러와 App 어댑터 위에서 실행합니다.
  function startHtmlGame() {
    // 게임이 기대하는 사용자 정보 — 아케이드에서는 닉네임이 곧 이름입니다
    App.user = { name: myNickname, grade: '아케이드', cls: '반', num: playerId };
    App.meta = { id: gameId, name: def.name };

    // 게임이 점수를 저장할 때 교사 화면에도 함께 반영합니다
    App._onScore(function (p) {
      playerRef.update({
        score: p.score || 0,
        level: p.level || 1,
        cleared: p.cleared ? 1 : 0,
        status: 'playing'
      });
    });
    // 게임의 "나가기" 버튼
    App._onHome(function () {
      App._stop();
      document.getElementById('dom-host').innerHTML = '';
      playerRef.update({ status: 'left' });
      show('screen-exit');
    });

    show('screen-dom');
    const host = document.getElementById('dom-host');
    host.innerHTML = '<p class="muted" style="padding:24px">게임을 불러오는 중…</p>';
    App._mount(def.appId || gameId, def.src, host)["catch"](function (e) {
      host.innerHTML = '<div style="padding:24px">' +
        '<h1 class="title-lg">게임을 불러올 수 없어요</h1>' +
        '<p class="muted">' + App.esc(e.message) + '</p>' +
        '<p class="muted">' + App.esc(def.src) + ' 파일이 올라가 있는지 확인해주세요.</p></div>';
    });
  }

  document.getElementById('exit-again').addEventListener('click', function () {
    playerRef.update({ status: 'playing' });
    startHtmlGame();
  });

  let lastScoreSync = 0;
  function pushState() {
    if (!game) return;
    if (isRealtime) {
      myPosRef.set(game.serialize());
      if (!isKart) {
        // 점수·통계는 1초에 한 번만 (교사 화면 목록용)
        if (Date.now() - lastScoreSync > 1000) {
          lastScoreSync = Date.now();
          playerRef.update(Object.assign({ status: 'playing' }, def.sync ? def.sync(game) : { score: game.score }));
        }
        const scoreEl = document.getElementById('game-score');
        if (String(game.score) !== scoreEl.textContent) scoreEl.textContent = game.score;
        if (stats[0]) document.getElementById('val-a').textContent = game[stats[0].key];
        if (stats[1]) document.getElementById('val-b').textContent = game[stats[1].key];
      }
    } else {
      playerRef.update(Object.assign({ status: game.gameOver ? 'gameover' : 'playing' }, def.sync(game)));
      const scoreEl = document.getElementById('game-score');
      if (String(game.score) !== scoreEl.textContent) {
        scoreEl.textContent = game.score;
        scoreEl.classList.remove('bump'); void scoreEl.offsetWidth; scoreEl.classList.add('bump');
      }
      if (stats[0]) document.getElementById('val-a').textContent = game[stats[0].key];
      if (stats[1]) document.getElementById('val-b').textContent = game[stats[1].key];
    }
    if (game.gameOver) endGame();
  }

  // ── 카트: 다른 플레이어 · 아이템 동기화 ──
  let peersAttached = false;
  const gameStartedAt = { t: 0 };
  function detachPeerSync() {
    if (!peersAttached) return;
    posRef.off(); hazardsRef.off(); eventsRef.off();
    Object.keys(peerPos).forEach(k => delete peerPos[k]);
    Object.keys(hazards).forEach(k => delete hazards[k]);
    peersAttached = false;
  }
  function attachPeerSync() {
    if (peersAttached) return;                          // 두 번 붙으면 피격이 2배로 들어갑니다
    peersAttached = true;
    gameStartedAt.t = Date.now();
    posRef.on('child_added',   s => applyPeer(s.key, s.val()));
    posRef.on('child_changed', s => applyPeer(s.key, s.val()));
    posRef.on('child_removed', s => { delete peerPos[s.key]; if (game && game.removePeer) game.removePeer(s.key); pushPeers(); });

    if (def.padLayout === 'arena') {
      gemsRef.on('value', s => { gems = s.val() || {}; if (game && game.setGems) game.setGems(gems); });
    }
    hazardsRef.on('child_added',   s => { hazards[s.key] = s.val(); if (game) game.setHazards(hazards); });
    hazardsRef.on('child_removed', s => { delete hazards[s.key]; if (game) game.setHazards(hazards); });

    eventsRef.on('child_added', s => {
      const e = s.val();
      if (!e || e.by === playerId || !game) return;
      // 지난 판이나 접속 전에 쌓인 이벤트는 버립니다 (갑자기 죽는 원인)
      if (e.t && (e.t < gameStartedAt.t - 1000 || Date.now() - e.t > 4000)) return;
      if (!isKart) { if (game.onEvent) game.onEvent(e); return; }
      if (e.type === 'bolt') {
        if (game.progress > e.p) game.hitByBolt(e.by);
      } else if ((e.type === 'missile' || e.type === 'turtle') && e.target === playerId) {
        game.hitByMissile(e.by, e.type);
      } else if (e.type === 'magnet' && e.target === playerId) {
        game.hitByMagnet(e.by);
      } else if (e.type === 'swap' && e.target === playerId) {
        game.teleportTo(e.state, e.by);
      }
    });

  }

  function applyPeer(id, raw) {
    if (id === playerId || !raw) return;
    if (!isKart) {                                     // 카트 외 실시간 게임: 엔진이 직접 해석
      peerPos[id] = { raw: raw, name: names[id] || '' };
      if (game && game.applyPeerRaw) game.applyPeerRaw(id, raw, names[id] || '');
      return;
    }
    const a = String(raw).split(',');
    const fl = +a[5] || 0;
    peerPos[id] = {
      x: +a[0], y: +a[1], angle: +a[2], lap: +a[3], progress: +a[4],
      spin: !!(fl & 1), shield: !!(fl & 2), boost: !!(fl & 4),
      finished: a[6] === '1', z: +a[7] || 0, name: names[id] || ''
    };
    pushPeers();
  }
  // 위치 신호는 초당 180번쯤 오므로, 게임에 넘기는 것은 프레임당 한 번으로 묶습니다
  let peersDirty = false;
  function pushPeers() { peersDirty = true; }
  function flushPeers() {
    if (!peersDirty || !game || !game.setPeers) return;
    peersDirty = false;
    Object.keys(peerPos).forEach(id => { peerPos[id].name = names[id] || peerPos[id].name; });
    game.setPeers(peerPos);
  }

  function dropHazard(x, y, kind) {
    hazardsRef.push({ x: Math.round(x), y: Math.round(y), kind: kind || 'banana', by: playerId, t: Date.now() });
  }
  function hitHazard(hid)   { hazardsRef.child(hid).remove(); }
  // 아이템 공격 전송 (bolt는 전체, missile/swap은 특정 대상)
  function sendAttack(type, target, payload) {
    const msg = { type: type, by: playerId, t: Date.now() };
    if (target) msg.target = target;
    if (type === 'bolt') msg.p = payload.p;
    if (type === 'swap') msg.state = payload;
    if (!isKart && payload) Object.assign(msg, payload);
    eventsRef.push(msg);
    // 예전엔 3초 뒤 각자 지웠는데, 그러면 이벤트 하나당 모든 기기에 '추가'와 '삭제' 두 번 전달돼 30명 교전 시 신호가 두 배였습니다.
    // 이제 교사 화면이 20초마다 오래된 것을 한 번에 지웁니다 (10초 지난 이벤트는 받는 쪽에서 무시)
  }

  // 완주 순위 — '먼저 신호가 도착한 순서' 가 아니라 '실제로 먼저 들어온 순서' 로 정합니다.
  // Firebase 카운터를 쓰면 늦게 통과해도 네트워크가 빠른 학생이 1위가 될 수 있습니다.
  // 각자 주행 시간(출발 신호 → 결승선, 기기 안에서 잰 값)을 올리고, 그 시간이 짧은 순서가 순위입니다.
  let finishesOff = null;
  function reportFinish(won) {
    if (def.padLayout === 'arena') { playerRef.update({ status: 'finished', score: game.score }); showResult(won ? 1 : 2); return; }
    // 주행 시간은 '공통 출발 시각(서버 시계)' 기준으로 잽니다. 기기 안 카운트다운 기준으로 재면
    // 늦게 들어온 학생·준비가 느렸던 기기의 시계가 늦게 출발해, 나중에 들어오고도 더 짧은 기록이 되어 먼저 들어온 학생을 밀어냈습니다.
    const ms = sessionStartAt ? Math.max(1, Math.round(serverNow() - sessionStartAt)) : ((game && game.raceMs) || 1);
    db.ref('finishes/' + playerId).set({ ms: ms, n: myNickname || '' });   // (예전엔 없는 변수 nickname 을 써서 완주 순간 오류 → 순위가 저장되지 않았습니다)
    playerRef.update({ status: 'finished' });
    const ref = db.ref('finishes');
    const recalc = snap => {
      const all = snap.val() || {};
      const list = Object.keys(all).map(id => ({ id: id, ms: +all[id].ms || 0 }))
                         .sort((a, b) => a.ms - b.ms || (a.id < b.id ? -1 : 1));   // 동률이면 id 로 고정
      const rank = list.findIndex(x => x.id === playerId) + 1;
      if (!rank) return;
      if (game) game.finishRank = rank;
      playerRef.update({ score: 1000 - rank, rank: rank });
      showResult(rank);
    };
    ref.on('value', recalc);
    finishesOff = () => ref.off('value', recalc);
    setTimeout(() => { if (finishesOff) { finishesOff(); finishesOff = null; } }, 30000);   // 30초 뒤 고정
  }

  function drawNextPreview() {
    const c = document.getElementById('next-canvas');
    const size = 11, dpr = window.devicePixelRatio || 1;
    c.style.width = (size * 4) + 'px'; c.style.height = (size * 4) + 'px';
    c.width = size * 4 * dpr; c.height = size * 4 * dpr;
    const ctx = c.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (game && game.drawNext) game.drawNext(ctx, size);
  }

  // ── 적응형 화질: 프레임이 밀리면 자동으로 한 단계 낮춥니다 (2 최고 · 1 · 0 최저) ──
  const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  let quality = isTouchDevice ? 1 : 2, qFrames = 0, qSum = 0, qLast = 0;   // 태블릿·폰은 중간 화질부터
  const DPR_BY_Q = isKart ? [0.85, 1.0, 1.25] : [0.9, 1.0, 1.5];
  function lowerQuality() {
    if (quality <= 0) return;
    quality--;
    fitCanvas();
    if (game && game.setQuality) game.setQuality(quality);
    const t = document.createElement('div');
    t.className = 'qtoast'; t.textContent = quality === 1 ? '화면을 조금 가볍게 했어요' : '화면을 가장 가볍게 했어요';
    document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
  }
  let loopRaf = null, syncDue = false, juiceScore = null, juicePopAt = 0;
  function loop(ts) {
    // 다음 프레임을 먼저 예약합니다 — 이번 프레임이 오래 걸려도 다음 호출이 밀리지 않습니다
    if (game && !game.gameOver) loopRaf = requestAnimationFrame(loop);
    flushPeers();
    if (!game) return;
    if (game.gameOver) { game.draw(); return; }
    // 프레임 시간 측정 — 120프레임 평균이 26ms 를 넘으면 낮춤
    if (qLast) { const dt = ts - qLast; if (dt < 200) { qSum += dt; qFrames++; } }
    qLast = ts;
    if (qFrames >= 120) { if (qSum / qFrames > 21) lowerQuality(); qFrames = 0; qSum = 0; }   // 평균 48fps 밑이면 낮춤
    // 손맛 층: 2D 캔버스 게임은 흔들림·섬광·배너를 공통으로 덧입힙니다 (카트·3D 는 자체 연출)
    const juiceOn = window.FX && def.type === 'canvas' && !isRealtime && !def.engine3d && def.padLayout !== 'joystick';   // 3D 캔버스엔 2D 효과층을 그릴 수 없음
    let jctx = null, shook = false;
    if (juiceOn) { const cv = byId('game-canvas'); jctx = cv.getContext('2d'); shook = FX.juice.applyShake(jctx); }
    game.tick(ts);
    if (juiceOn) { FX.juice.restoreShake(jctx, shook);
      // 점수가 오르면 '+N' 팝업 (초당 6개까지)
      if (typeof game.score === 'number') { if (juiceScore != null && game.score > juiceScore && ts - juicePopAt > 160) { const cvj = byId('game-canvas'); FX.juice.pop('+' + (game.score - juiceScore), (cvj.clientWidth || 320) / 2, 64, '#FFD166'); juicePopAt = ts; } juiceScore = game.score; }
      const cv = byId('game-canvas'), dpr = cv.width / Math.max(1, cv.clientWidth || cv.width);
      jctx.save(); jctx.setTransform(dpr, 0, 0, dpr, 0, 0); FX.juice.draw(jctx, cv.width / dpr, cv.height / dpr, 1, game); jctx.restore(); }
    // hud() 는 객체를 새로 만들므로, 실제로 화면을 갱신할 때만 호출합니다
    if (isKart && ts - hudLast >= 66) renderKartHud(game.hud());
    if (syncDue) { syncDue = false; pushState(); }     // 전송은 그리기가 끝난 뒤에
  }

  // ── 레이싱 HUD (매 프레임 갱신) ──
  const ROLL_ICONS = ['🍌','⚡','🚀','🌀','🛡','🌩','⚡⚡','🧲','💣','🐢','⭐'];
  let lastItemSig = '';
  let hudLast = 0, hudPrev = '';
  function renderKartHud(h) {
    // DOM 은 값이 바뀔 때만, 그리고 초당 15번까지만 만집니다 (매 프레임 레이아웃 재계산 방지)
    hudLast = performance.now();
    const hsig = [h.rank, h.total, h.lap, h.laps, h.speed, h.speedPct | 0, h.items.join(','), h.rolling, h.shield, h.boost, h.wrongWay, h.corner, h.nearBoost, h.finished].join('|');
    if (hsig === hudPrev) return; hudPrev = hsig;
    document.getElementById('hud-rank').textContent = h.rank;
    document.getElementById('hud-total').textContent = '/' + h.total;
    document.getElementById('hud-lap').textContent = h.lap;
    document.getElementById('hud-laps').textContent = '/' + h.laps;
    const pb = document.querySelector('.pos-box');
    if (pb) pb.className = 'pos-box' + (h.rank === 1 ? ' gold' : h.rank === 2 ? ' silver' : h.rank === 3 ? ' bronze' : '');
    document.getElementById('hud-speed').textContent = h.speed;
    document.getElementById('hud-speed-bar').style.width = h.speedPct.toFixed(0) + '%';

    const sig = h.items.join(',') + (h.rolling ? '|roll' : '');
    const nameEl = document.getElementById('item-name');

    for (let i = 0; i < 2; i++) {
      const slot = document.getElementById('item-slot-' + i);
      const icon = slot.firstElementChild;
      const it = h.items[i];
      // 룰렛은 비어 있는 첫 칸에서 돌아감
      const rollingHere = h.rolling && i === h.items.length;
      const base = 'item-slot' + (i === 1 ? ' small' : '');
      if (rollingHere) {
        icon.textContent = ROLL_ICONS[Math.floor(performance.now()/70) % ROLL_ICONS.length];
        slot.className = base + ' rolling';
      } else if (it) {
        icon.textContent = ITEMS[it].icon;
        slot.className = base + ' has' + (i === 0 ? ' ready' : '');
        if (sig !== lastItemSig) {
          slot.classList.add('pop');
          setTimeout(() => slot.classList.remove('pop'), 320);
        }
      } else {
        icon.textContent = '';
        slot.className = base;
      }
    }
    nameEl.textContent = h.items.length ? ITEMS[h.items[0]].name : '';
    lastItemSig = sig;

    const badges = document.getElementById('hud-badges');
    const want = [];
    if (h.shield) want.push('🛡 방어막');
    if (h.boost)  want.push('⚡ 부스터');
    if (h.nearBoost && !h.boost) want.push('부스터 발판 →');
    if (h.grade >  0.06) want.push('▲ 오르막');
    if (h.grade < -0.06) want.push('▼ 내리막');
    const bsig = want.join('|');
    if (badges.dataset.sig !== bsig) {
      badges.dataset.sig = bsig;
      badges.innerHTML = '';
      want.forEach(t => {
        const b = document.createElement('span');
        b.className = 'hud-badge';
        b.textContent = t;
        badges.appendChild(b);
      });
    }
  }

  // ── 조작 바인딩 ──
  function bindControls() {
    if (byId('btn-left'))  press('btn-left',  () => game && game.move(-1), () => game && game.releaseSteer && game.releaseSteer(-1), isKart ? null : 90);
    if (byId('btn-right')) press('btn-right', () => game && game.move(1),  () => game && game.releaseSteer && game.releaseSteer(1),  isKart ? null : 90);
    if (byId('btn-rotate')) tap('btn-rotate', () => game && game.rotate());
    if (byId('btn-drop'))   tap('btn-drop',   () => game && game.hardDrop());
    if (byId('btn-item'))    tap('btn-item',    () => game && game.useItem());
    if (byId('btn-discard')) tap('btn-discard', () => game && game.dropItem());
    if (byId('btn-down')) press('btn-down',
      () => { if (game) { game.softDropping = true; game.softDrop(); } },
      () => { if (game) game.softDropping = false; });
    if (byId('btn-up'))   press('btn-up',
      () => { if (game) { game.upHeld = true; (game.up ? game.up() : game.rotate()); } },
      () => { if (game) game.upHeld = false; });
    if (byId('btn-jump')) tap('btn-jump', () => game && (game.jump ? game.jump() : game.rotate()));
    if (byId('btn-reload')) tap('btn-reload', () => game && game.reload && game.reload());
    if (byId('btn-fire')) press('btn-fire',
      () => { if (game) { game.firing = true; if (game.fire) game.fire(); } },
      () => { if (game) game.firing = false; });
    bindSwipe();
    document.addEventListener('keydown', onKeyDown);
    document.addEventListener('keyup', onKeyUp);
  }
  function byId(id) { return document.getElementById(id); }

  // 누르는 동안 유지 (repeat 값을 주면 연타처럼 반복)
  function press(id, onStart, onEnd, repeatMs) {
    const el = byId(id);
    let rep = null, delay = null;
    const start = e => {
      e.preventDefault(); onStart();
      if (repeatMs) delay = setTimeout(() => { rep = setInterval(onStart, repeatMs); }, 250);
    };
    const stop = () => { clearTimeout(delay); clearInterval(rep); rep = null; if (onEnd) onEnd(); };
    el.addEventListener('touchstart', start, { passive: false });
    ['touchend','touchcancel','mouseup','mouseleave'].forEach(ev => el.addEventListener(ev, stop));
    el.addEventListener('mousedown', start);
  }

  function tap(id, fn) {
    const el = byId(id);
    let touched = false;
    el.addEventListener('touchstart', e => { e.preventDefault(); touched = true; fn(); }, { passive: false });
    el.addEventListener('click', e => { e.preventDefault(); if (!touched) fn(); touched = false; });
  }

  function bindSwipe() {
    const canvas = byId('game-canvas');
    // 게임을 다시 시작해도 캔버스 핸들러는 한 번만 (겹쳐 붙으면 한 번 톡에 여러 번 반응합니다)
    if (canvas._swipeBound) return; canvas._swipeBound = true;
    if (def.padLayout === 'joystick') return;        // 조작은 buildFloatingControls 가 맡습니다
    if (def.padLayout === 'tap') {
      // 톡 누르는 자리(칸 단위)를 게임에 넘깁니다 (미사일 방어)
      const at = (cx, cy) => { const r = canvas.getBoundingClientRect(); if (game && game.tapAt) game.tapAt((cx - r.left) / r.width * def.grid.cols, (cy - r.top) / r.height * def.grid.rows); };
      canvas.addEventListener('touchstart', e => { for (const t of e.changedTouches) at(t.clientX, t.clientY); e.preventDefault(); }, { passive: false });
      canvas.addEventListener('mousedown', e => at(e.clientX, e.clientY));
      return;
    }
    if (isKart) {
      // 카트: 화면 좌/우 절반을 눌러도 조향
      let dir = 0;
      canvas.addEventListener('touchstart', e => {
        const t = e.touches[0];
        dir = (t.clientX < window.innerWidth / 2) ? -1 : 1;
        if (game) game.move(dir);
      }, { passive: true });
      const rel = () => { if (game && game.releaseSteer) game.releaseSteer(dir); };
      canvas.addEventListener('touchend', rel);
      canvas.addEventListener('touchcancel', rel);
      return;
    }
    let sx = 0, sy = 0, moved = false;
    canvas.addEventListener('touchstart', e => {
      const t = e.touches[0]; sx = t.clientX; sy = t.clientY; moved = false;
    }, { passive: true });
    canvas.addEventListener('touchmove', e => {
      if (!game) return;
      const t = e.touches[0], dx = t.clientX - sx, dy = t.clientY - sy, th = cellSize;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > th) { game.move(dx > 0 ? 1 : -1); sx = t.clientX; moved = true; }
      else if (dy > th * 2) { (game.down ? game.down() : game.hardDrop()); sy = t.clientY; moved = true; }
      else if (dy < -th * 2) { (game.up ? game.up() : game.rotate()); sy = t.clientY; moved = true; }
      e.preventDefault();
    }, { passive: false });
    canvas.addEventListener('touchend', () => { if (!moved && game) game.rotate(); });
  }

  const wasd = { w: false, a: false, s: false, d: false };
  function pushWasd() { if (game && game.setMove) game.setMove((wasd.d ? 1 : 0) - (wasd.a ? 1 : 0), (wasd.w ? 1 : 0) - (wasd.s ? 1 : 0)); }
  function onKeyDown(e) {
    if (!game || game.gameOver) return;
    const k = e.key.toLowerCase();
    if (game.setMove && (k === 'w' || k === 'a' || k === 's' || k === 'd')) { wasd[k] = true; pushWasd(); return; }
    if (k === 'r' && game.reload) { game.reload(); return; }
    if (k === 'q' && game.switchWeapon) { game.switchWeapon(); return; }
    if (game.jump && (e.code === 'Space' || k === ' ') && game.setMove) { e.preventDefault(); game.jump(); return; }
    if (k === 'shift' && game.roll) { game.roll(); return; }
    if (k === 'z' && game.toggleZoom) { game.toggleZoom(); return; }
    if (e.key === 'Tab' && game.drawScoreboard) { e.preventDefault(); game.showBoard = true; return; }
    if (e.key === 'ArrowLeft') game.move(-1);
    else if (e.key === 'ArrowRight') game.move(1);
    else if (e.key === 'ArrowDown') { game.softDropping = true; }
    else if (e.key === 'ArrowUp') { if (game.up) { game.upHeld = true; game.up(); } else game.rotate(); }
    else if (e.key === ' ') { e.preventDefault(); if (isKart) game.useItem(); else if (game.fire) { game.firing = true; game.fire(); } else game.hardDrop(); }
    else if (isKart && (e.key === 'd' || e.key === 'D' || e.key === 'Backspace')) {
      e.preventDefault(); game.dropItem();
    }
  }
  function onKeyUp(e) {
    if (!game) return;
    const k = e.key.toLowerCase();
    if (game.setMove && (k === 'w' || k === 'a' || k === 's' || k === 'd')) { wasd[k] = false; pushWasd(); return; }
    if (e.key === 'ArrowLeft'  && game.releaseSteer) game.releaseSteer(-1);
    if (e.key === 'ArrowRight' && game.releaseSteer) game.releaseSteer(1);
    if (e.key === 'ArrowDown') game.softDropping = false;
    if (e.key === 'ArrowUp') game.upHeld = false;
    if (e.key === ' ') game.firing = false;
    if (e.key === 'Tab') game.showBoard = false;
  }

  // 시작 연출 — 화면을 막지 않고 READY → GO! 만 띄웁니다
  function readyGo() {
    const wrap = byId('canvas-wrap'); if (!wrap) return;
    const el = document.createElement('div'); el.className = 'readygo'; el.innerHTML = '<span>READY</span>';
    wrap.appendChild(el);
    setTimeout(() => { el.innerHTML = '<span class="go">GO!</span>'; if (window.Sound) Sound.rotate(); }, 700);
    setTimeout(() => el.remove(), 1400);
  }

  // ── 결과 ──
  // 숫자가 0 에서 목표까지 차오르는 연출 (0.9초)
  function countUp(el, target) {
    const t0 = performance.now(), dur = 900, from = 0;
    const step = ts => { const k = Math.min(1, (ts - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      el.textContent = Math.round(from + (target - from) * e); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }
  // 1위 색종이 (DOM 조각 40개, 2.4초 뒤 제거)
  function confetti() {
    const box = document.createElement('div'); box.className = 'confetti'; document.body.appendChild(box);
    const colors = ['#FFD166', '#FF5C7A', '#4CC9F0', '#06D6A0', '#B15DFF', '#FFFFFF'];
    for (let i = 0; i < 40; i++) { const p = document.createElement('i');
      p.style.left = (Math.random() * 100) + '%'; p.style.background = colors[i % colors.length];
      p.style.animationDelay = (Math.random() * 0.6) + 's'; p.style.animationDuration = (1.6 + Math.random() * 0.9) + 's';
      p.style.transform = 'rotate(' + (Math.random() * 360) + 'deg)'; box.appendChild(p); }
    setTimeout(() => box.remove(), 2600);
  }
  function endGame() {
    clearInterval(syncTimer);
    stopGame();
    countUp(document.getElementById('final-score'), game.score);
    document.getElementById('final-detail').textContent = def.detail ? def.detail(game) : '';
    show('screen-over');
    playersRef.once('value').then(snap => {
      const players = snap.val() || {};
      const scores = Object.keys(players).map(id => players[id].score || 0);
      if (scores.length < 2) return;
      scores.sort((a, b) => b - a);
      showRank(scores.indexOf(game.score) + 1, scores.length);
    });
  }

  function showResult(rank) {
    document.getElementById('over-label').textContent = '완주 순위';
    document.getElementById('final-score').textContent = rank ? rank + '등' : '완주';
    document.getElementById('final-detail').textContent = (game && def.detail) ? def.detail(game) : '완주했습니다';
    show('screen-over');
    clearInterval(syncTimer);
    playersRef.once('value').then(s => showRank(rank, Object.keys(s.val() || {}).length));
  }

  function showRank(rank, total) {
    if (!rank || total < 2) return;
    const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : '';
    document.getElementById('rank-value').textContent = (medal ? medal + ' ' : '') + rank + '등';
    document.getElementById('rank-desc').textContent = '전체 ' + total + '명 중';
    const st = document.getElementById('rank-stat'); st.classList.remove('hidden'); st.classList.add('pop');
    if (rank === 1) { confetti(); if (window.Sound) Sound.levelUp(); }
  }

  function stopGame() {
    if (game && game.destroy) { try { game.destroy(); } catch (e) {} }
    if (watchTimer) { clearInterval(watchTimer); watchTimer = null; if (screenRef) screenRef.remove(); }
    if (finishesOff) { finishesOff(); finishesOff = null; }
    const fc = byId('fps-ctl'); if (fc) fc.remove();
    stopGyro();
    detachPeerSync();
    clearInterval(syncTimer);
    document.removeEventListener('keydown', onKeyDown);
    document.removeEventListener('keyup', onKeyUp);
  }

  document.addEventListener('gesturestart', e => e.preventDefault());
})();
</script>
</body>
</html>
