<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1B2027">
<title>아케이드</title>
<link rel="stylesheet" href="platform.css?v=2026-09-10c">
<link rel="stylesheet" href="style.css?v=2026-09-10c">
</head>
<body>
<div class="app">

  <button id="nav-back" class="nav-back hidden" aria-label="뒤로">←</button>


  <!-- 입장 -->
  <section id="screen-join" class="screen centered active">
    <div class="badge badge-primary badge-lg gap-2 mb-3" id="join-chip"></div>
    <h1 class="title-lg">닉네임을 정해주세요</h1>
    <p class="muted">친구들에게 이 이름으로 보여요</p>
    <div class="stack mt-5">
      <input id="nickname-input" type="text" maxlength="8" placeholder="8자 이내"
             class="input input-bordered input-lg w-full text-center font-semibold"
             autocomplete="off" autocapitalize="off">
      <button id="join-btn" class="btn btn-primary btn-lg btn-block">입장하기</button>
      <p id="join-error" class="text-error text-sm hidden"></p>
    </div>
  </section>

  <!-- 대기 -->
  <section id="screen-wait" class="screen centered">
    <div class="pulse-ring"><b id="wait-count">0</b></div>
    <h1 class="title-lg">시작을 기다리는 중</h1>
    <p class="muted">선생님이 시작하면 자동으로 넘어갑니다</p>
    <div class="roster" id="roster"></div>
  </section>

  <!-- 게임 -->
  <section id="screen-game" class="screen">
    <div class="topbar">
      <div class="chip hot"><span class="k" id="k-main">SCORE</span><span class="v num" id="game-score">0</span></div>
      <div class="chip" id="chip-a"><span class="k" id="k-a">LINES</span><span class="v num" id="val-a">0</span></div>
      <div class="chip" id="chip-b"><span class="k" id="k-b">LEVEL</span><span class="v num" id="val-b">1</span></div>
      <div class="spacer"></div>
      <div class="chip next-box" id="next-box"><span class="k">NEXT</span><canvas id="next-canvas"></canvas></div>
      <button id="mute-btn" class="btn btn-square btn-sm btn-ghost" aria-label="소리 끄기">♪</button>
    </div>
    <div class="canvas-wrap" id="canvas-wrap">
      <canvas id="game-canvas"></canvas>
      <div class="kart-hud hidden" id="kart-hud">
        <div class="hud-tl">
          <div class="pos-box"><b class="num" id="hud-rank">1</b><span id="hud-total">/1</span></div>
          <div class="lap-box">LAP <b class="num" id="hud-lap">1</b><span id="hud-laps">/3</span></div>
        </div>
        <div class="hud-bl">
          <div class="speedo">
            <div class="sp-bar"><i id="hud-speed-bar"></i></div>
            <div class="sp-num"><b class="num" id="hud-speed">0</b><span>km/h</span></div>
          </div>
        </div>
        <div class="hud-br">
          <div class="item-rack">
            <div class="item-slot" id="item-slot-0"><span></span></div>
            <div class="item-slot small" id="item-slot-1"><span></span></div>
          </div>
          <div class="item-name" id="item-name"></div>
        </div>
        <div class="hud-badges" id="hud-badges"></div>
      </div>
    </div>
    <div class="pad" id="pad"></div>
  </section>

  <!-- 결과 -->
  <section id="screen-over" class="screen centered">
    <div class="badge badge-primary badge-lg mb-3" id="over-chip"></div>
    <p class="muted" id="over-label">최종 점수</p>
    <div class="result-score num" id="final-score">0</div>
    <p class="muted" id="final-detail"></p>
    <div class="stats bg-base-200 shadow mt-5 hidden" id="rank-stat">
      <div class="stat place-items-center py-4">
        <div class="stat-title text-xs">전체 순위</div>
        <div class="stat-value text-primary text-3xl num" id="rank-value">-</div>
        <div class="stat-desc" id="rank-desc"></div>
      </div>
    </div>
  </section>

  <!-- 자체 화면을 가진 학습 게임 -->
  <section id="screen-dom" class="screen">
    <div class="dom-host" id="dom-host"></div>
  </section>

  <!-- 게임을 나왔을 때 -->
  <section id="screen-exit" class="screen centered">
    <div class="badge badge-primary badge-lg mb-3" id="exit-chip"></div>
    <h1 class="title-lg">게임을 나왔습니다</h1>
    <p class="muted">다시 시작하거나 선생님을 기다려주세요</p>
    <div class="stack mt-5">
      <button id="exit-again" class="btn btn-primary btn-lg btn-block">다시 시작</button>
    </div>
  </section>

  <!-- 종료 -->
  <section id="screen-ended" class="screen centered">
    <h1 class="title-lg">수업이 끝났습니다</h1>
    <p class="muted">함께해줘서 고마워요</p>
    <div class="stack mt-5">
      <button id="rejoin-btn" class="btn btn-primary btn-lg btn-block">다시 참여하기</button>
      <p class="muted text-sm">선생님이 다시 시작하면 자동으로 넘어갑니다</p>
    </div>
  </section>

</div>

<div id="overlay" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js?v=2026-09-10c"></script>
<script src="sound.js?v=2026-09-10c"></script>
<script src="shared.js?v=2026-09-10c"></script>
<script src="tetris-engine.js?v=2026-09-10c"></script>
<script src="racing-engine.js?v=2026-09-10c"></script>
<script src="snake-engine.js?v=2026-09-10c"></script>
<script src="breakout-engine.js?v=2026-09-10c"></script>
<script src="flappy-engine.js?v=2026-09-10c"></script>
<script src="shooter-engine.js?v=2026-09-10c"></script>
<script src="games.js?v=2026-09-10c"></script>
<script src="app.js?v=2026-09-10c"></script>
<script>
(function () {

  const BUILD = '2026-09-10c';   // 화면 아래에 표시됩니다

  const gameId = getGameId();
  const def = GAMES[gameId];
  const isHtml = (def.type === 'html');      // 자체 화면을 가진 학습 게임
  const isTetris = (gameId === 'tetris');
  const isKart = (gameId === 'kart');

  applyAccent(gameId);
  document.getElementById('join-chip').textContent = def.name;
  document.getElementById('over-chip').textContent = def.name;

  document.getElementById('exit-chip').textContent = def.name;
  // 점수 옆 보조 수치 두 칸 — 게임마다 무엇을 보여 줄지 정합니다
  const stats = def.stats || [];
  [['chip-a','k-a'],['chip-b','k-b']].forEach(([chip, k], i) => {
    if (stats[i]) document.getElementById(k).textContent = stats[i].label;
    else document.getElementById(chip).classList.add('hidden');
  });
  if (!def.hasNext) document.getElementById('next-box').classList.add('hidden');
  if (def.fullBleed) document.getElementById('canvas-wrap').classList.add('bleed');
  if (isKart) {
    document.querySelector('.topbar').classList.add('kart-mode');
    document.getElementById('kart-hud').classList.remove('hidden');
  }

  // 내 자리를 서버에 (다시) 써 넣습니다.
  // 접속이 끊기면 onDisconnect 로 지워지므로, 돌아왔을 때 되살려야 명단에 다시 뜹니다.
  function rewritePlayer(status) {
    if (!myNickname) return Promise.resolve();
    return playerRef.set({
      nickname: myNickname, game: gameId, status: status,
      joinedAt: firebase.database.ServerValue.TIMESTAMP,
      score: (game && typeof game.score === 'number') ? game.score : 0
    }).then(function () {
      playerRef.onDisconnect().remove();
      myPosRef.onDisconnect().remove();
    })["catch"](function () {});
  }

  // 끊겼다가 다시 연결되면 자동으로 복구합니다
  db.ref('.info/connected').on('value', function (snap) {
    if (snap.val() !== true || !joined) return;
    rewritePlayer(started ? 'playing' : 'waiting');
  });

  // 종료 화면에서 다시 참여하기
  document.getElementById('rejoin-btn').addEventListener('click', function () {
    started = false;
    if (joined && myNickname) {
      // 이미 이름이 있으면 자리만 되살리고 대기실로
      rewritePlayer('waiting');
      show('screen-wait');
    } else {
      show('screen-join');
    }
  });

  // 새로고침·튕김·게임 이동 뒤에도 이름을 기억해 둡니다
  (function () {
    var prev = '', auto = '0';
    try {
      prev = sessionStorage.getItem('nickname') || '';
      auto = sessionStorage.getItem('autoJoin') || '0';
      sessionStorage.removeItem('autoJoin');
    } catch (e) {}
    if (!prev) return;
    var input = document.getElementById('nickname-input');
    if (input) input.value = prev;
    var btn = document.getElementById('join-btn');
    if (btn) btn.textContent = '다시 입장하기';
    // 선생님이 게임을 옮긴 경우엔 누르지 않아도 알아서 들어갑니다
    if (auto === '1') setTimeout(function () { join(); }, 120);
  })();

  /* 화면 이동을 기록해 두고, 휴대폰의 뒤로가기로 페이지가 통째로 닫히지 않게 합니다.
     화면마다 "뒤로 가면 어디로 갈지" 를 정해 둡니다. (null 이면 뒤로가기 버튼을 숨김) */
  const BACK_TO = {
    'screen-join': null,          // 첫 화면
    'screen-wait': 'screen-join', // 대기 → 닉네임
    'screen-game': 'screen-wait',
    'screen-dom':  'screen-wait',
    'screen-over': 'screen-wait',
    'screen-exit': 'screen-wait',
    'screen-ended': null
  };
  let curScreen = 'screen-join';

  function show(id) {
    document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    curScreen = id;
    const back = BACK_TO[id];
    document.getElementById('nav-back').classList.toggle('hidden', !back);
    // 뒤로 갈 곳이 있으면 기록을 하나 쌓아 둡니다 (휴대폰 뒤로가기가 여기서 잡힙니다)
    if (back) { try { history.pushState({ screen: id }, ''); } catch (e) {} }
  }

  // 뒤로 가기 — 게임 중이면 멈추고 이전 화면으로
  function goBack() {
    const back = BACK_TO[curScreen];
    if (!back) return;
    if (curScreen === 'screen-game' || curScreen === 'screen-dom') {
      stopGame();
      if (isHtml) { try { App._stop(); } catch (e) {} document.getElementById('dom-host').innerHTML = ''; }
      started = false;
    }
    show(joined ? back : 'screen-join');
  }

  document.getElementById('nav-back').addEventListener('click', goBack);

  // 휴대폰·브라우저의 뒤로가기
  try { history.replaceState({ screen: 'screen-join' }, ''); } catch (e) {}
  window.addEventListener('popstate', function () {
    if (BACK_TO[curScreen]) goBack();
    else { try { history.pushState({ screen: curScreen }, ''); } catch (e) {} }  // 첫 화면에선 나가지 않게
  });

  // 실수로 탭을 닫을 때 확인 (게임 중일 때만)
  window.addEventListener('beforeunload', function (e) {
    if (!started || switching) return;
    e.preventDefault();
    e.returnValue = '';
  });

  // 지금 기기가 어떤 버전을 쓰는지 입장 화면에 작게 표시합니다
  (function () {
    const tag = document.createElement('div');
    tag.style.cssText = 'position:fixed;left:0;right:0;bottom:6px;text-align:center;' +
      'font:500 10px Pretendard,sans-serif;color:rgba(255,255,255,.28);pointer-events:none;z-index:50';
    tag.textContent = 'v' + BUILD;
    document.body.appendChild(tag);
  })();

  let joined = false;          // 닉네임을 넣고 입장하기를 눌렀는지
  let switching = false;       // 다른 게임으로 옮겨 가는 중
  let playerId = sessionStorage.getItem('playerId');
  if (!playerId) {
    playerId = 'p_' + Math.random().toString(36).slice(2, 10);
    sessionStorage.setItem('playerId', playerId);
  }

  const playerRef  = db.ref('players/' + playerId);
  const playersRef = db.ref('players');
  const posRef     = db.ref('pos');
  const myPosRef   = db.ref('pos/' + playerId);
  const hazardsRef = db.ref('hazards');
  const eventsRef  = db.ref('events');
  const sessionRef = db.ref('session');

  let game = null, syncTimer = null, started = false, cellSize = 20;
  let myNickname = '', trackId = 'meadow';
  const names = {}, peerPos = {}, hazards = {};

  // ── 소리 ──
  const muteBtn = document.getElementById('mute-btn');
  muteBtn.addEventListener('click', () => {
    const on = !Sound.isEnabled();
    Sound.setEnabled(on);
    muteBtn.textContent = on ? '♪' : '✕';
  });

  // ── 입장 ──
  document.getElementById('join-btn').addEventListener('click', join);
  document.getElementById('nickname-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.target.blur(); join(); }
  });

  function join() {
    Sound.resume();
    const nickname = document.getElementById('nickname-input').value.trim();
    const err = document.getElementById('join-error');
    if (!nickname) { err.textContent = '닉네임을 입력해주세요'; err.classList.remove('hidden'); return; }
    err.classList.add('hidden');
    myNickname = nickname;
    try { sessionStorage.setItem('nickname', nickname); } catch (e) {}
    playerRef.set({
      nickname: nickname, game: gameId, status: 'waiting',
      joinedAt: firebase.database.ServerValue.TIMESTAMP, score: 0
    }).then(function () {
      playerRef.onDisconnect().remove();
      myPosRef.onDisconnect().remove();
      joined = true;
      // 이미 시작된 수업이면 곧바로 합류시킵니다
      sessionRef.once('value').then(function (snap) {
        const s = snap.val() || {};
        if (s.track) trackId = s.track;
        if (s.status === 'playing' && !started) startGame();
        else show('screen-wait');
      })["catch"](function () { show('screen-wait'); });
    })["catch"](function (e) {
      // 저장이 안 되면 대기 화면으로 넘기지 않고 이유를 보여 줍니다
      err.textContent = '서버에 연결하지 못했습니다 — 선생님께 알려주세요 (' +
                        (e && e.message ? e.message : '알 수 없는 오류') + ')';
      err.classList.remove('hidden');
    });
  }

  // 대기실 인원
  const rosterListener = playersRef.on('value', snap => {
    const players = snap.val() || {};
    const ids = Object.keys(players);
    ids.forEach(id => { names[id] = players[id].nickname || ''; });
    document.getElementById('wait-count').textContent = ids.length;
    const roster = document.getElementById('roster');
    roster.innerHTML = '';
    ids.forEach(id => {
      const el = document.createElement('span');
      el.className = 'badge badge-lg' + (id === playerId ? ' badge-primary' : ' badge-ghost');
      el.textContent = players[id].nickname || '';
      roster.appendChild(el);
    });
  });

  sessionRef.on('value', snap => {
    const s = snap.val() || {};
    if (s.track) trackId = s.track;
    // 입장한 학생만 게임으로 넘어갑니다.
    // (이미 진행 중인 수업에 뒤늦게 QR로 들어와도 닉네임 화면을 먼저 거칩니다)
    const st = s.status || 'idle';

    // 선생님이 다른 게임을 골랐으면 그 게임으로 옮겨 갑니다.
    // 게임마다 엔진이 달라 주소를 바꿔 다시 여는 방식이며, 닉네임은 그대로 유지됩니다.
    if (s.game && s.game !== gameId && GAMES[s.game]) {
      if (switching) return;
      switching = true;
      try { sessionStorage.setItem('autoJoin', joined ? '1' : '0'); } catch (e) {}
      const url = location.pathname + '?game=' + encodeURIComponent(s.game);
      location.replace(url);
      return;
    }

    if (st === 'playing') {
      if (!started && joined) startGame();
      return;
    }

    // 게임이 아닌 모든 상태에서는 진행 중이던 게임을 정리합니다
    if (started) {
      stopGame();
      if (isHtml) { try { App._stop(); } catch (e) {} document.getElementById('dom-host').innerHTML = ''; }
      started = false;
    }

    if (st === 'ended') {
      show('screen-ended');
    } else {
      // waiting · idle — 선생님이 대기실로 돌렸거나 게임을 고르는 중
      show(joined ? 'screen-wait' : 'screen-join');
    }
  });

  // ── 캔버스 크기 ──
  function fitCanvas() {
    const canvas = document.getElementById('game-canvas');
    const wrap = canvas.parentElement;
    const availW = wrap.clientWidth, availH = wrap.clientHeight;
    if (availW <= 0 || availH <= 0) return;
    const dpr = window.devicePixelRatio || 1;
    let w, h;
    if (def.fullBleed) {
      w = availW; h = availH;
    } else {
      cellSize = Math.max(10, Math.floor(Math.min(availW / def.grid.cols, availH / def.grid.rows)));
      w = cellSize * def.grid.cols; h = cellSize * def.grid.rows;
    }
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    canvas.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
    if (game) {
      if (game.resize) game.resize(cellSize); else game.cellSize = cellSize;
      game.draw();
    }
  }
  if (isHtml) { document.querySelector('.app').style.padding = '0'; }
  window.addEventListener('resize', () => { if (game) fitCanvas(); });
  window.addEventListener('orientationchange', () => setTimeout(() => { if (game) fitCanvas(); }, 350));

  // ── 조작 패드 ──
  const PAD = {
    left:  { label: '←', cls: 'k-left btn btn-neutral' },
    right: { label: '→', cls: 'k-right btn btn-neutral' },
    up:    { label: '↑', cls: 'k-up btn btn-neutral' },
    rotate:{ label: '↻', cls: 'k-rotate btn btn-neutral' },
    down:  { label: '↓', cls: 'k-down btn btn-neutral' },
    drop:  { label: '바로 내리기', cls: 'k-drop btn btn-primary' },
    fire:  { label: '발사', cls: 'k-fire btn btn-primary' },
    jump:  { label: '점프', cls: 'k-jump btn btn-primary' },
    item:  { label: '아이템 사용', cls: 'k-item btn btn-primary' },
    discard: { label: '✕ 아이템 버리기', cls: 'k-discard btn btn-ghost' }
  };
  function buildPad() {
    const pad = document.getElementById('pad');
    pad.innerHTML = '';
    pad.className = 'pad' + (isKart ? ' pad-kart' : '') + (def.padLayout ? ' pad-' + def.padLayout : '');
    def.controls.forEach(c => {
      const b = document.createElement('button');
      b.id = 'btn-' + c;
      b.className = PAD[c].cls;
      b.textContent = (def.labels && def.labels[c]) || PAD[c].label;
      b.setAttribute('aria-label', b.textContent);
      pad.appendChild(b);
    });
  }

  // ── 시작 ──
  function startGame() {
    started = true;
    Sound.resume();
    playerRef.update({ status: 'playing' });
    if (isHtml) { startHtmlGame(); return; }
    show('screen-game');
    buildPad();

    playersRef.once('value').then(snap => {
      const players = snap.val() || {};
      Object.keys(players).forEach(id => { names[id] = players[id].nickname || ''; });
      const order = Object.keys(players).sort((a, b) => (players[a].joinedAt || 0) - (players[b].joinedAt || 0));
      const slot = Math.max(0, order.indexOf(playerId));

      // 테트리스는 다른 사람 정보가 필요 없으므로 수신을 끊어 통신량을 아낌
      if (!def.needsPeers) playersRef.off('value', rosterListener);

      const canvas = document.getElementById('game-canvas');
      requestAnimationFrame(() => {
        fitCanvas();
        game = def.create(canvas, {
          cellSize: cellSize, trackId: trackId, slot: slot,
          myId: playerId, myName: myNickname,
          onDropHazard: dropHazard, onHitHazard: hitHazard,
          onAttack: sendAttack, onFinish: reportFinish
        });
        if (def.hasNext) { game.onNextChange = drawNextPreview; drawNextPreview(); }
        game.draw();
        bindControls();
        if (def.needsPeers) attachPeerSync();
        Sound.start();

        syncTimer = setInterval(pushState, isKart ? 165 : 200);
        requestAnimationFrame(loop);
      });
    });
  }

  // ══ 자체 화면 학습 게임 (광합성 · 힘 · 몸속 여행) ══
  // 원본 파일을 그대로 불러와 App 어댑터 위에서 실행합니다.
  function startHtmlGame() {
    // 게임이 기대하는 사용자 정보 — 아케이드에서는 닉네임이 곧 이름입니다
    App.user = { name: myNickname, grade: '아케이드', cls: '반', num: playerId };
    App.meta = { id: gameId, name: def.name };

    // 게임이 점수를 저장할 때 교사 화면에도 함께 반영합니다
    App._onScore(function (p) {
      playerRef.update({
        score: p.score || 0,
        level: p.level || 1,
        cleared: p.cleared ? 1 : 0,
        status: 'playing'
      });
    });
    // 게임의 "나가기" 버튼
    App._onHome(function () {
      App._stop();
      document.getElementById('dom-host').innerHTML = '';
      playerRef.update({ status: 'left' });
      show('screen-exit');
    });

    show('screen-dom');
    const host = document.getElementById('dom-host');
    host.innerHTML = '<p class="muted" style="padding:24px">게임을 불러오는 중…</p>';
    App._mount(def.appId || gameId, def.src, host)["catch"](function (e) {
      host.innerHTML = '<div style="padding:24px">' +
        '<h1 class="title-lg">게임을 불러올 수 없어요</h1>' +
        '<p class="muted">' + App.esc(e.message) + '</p>' +
        '<p class="muted">' + App.esc(def.src) + ' 파일이 올라가 있는지 확인해주세요.</p></div>';
    });
  }

  document.getElementById('exit-again').addEventListener('click', function () {
    playerRef.update({ status: 'playing' });
    startHtmlGame();
  });

  function pushState() {
    if (!game) return;
    if (isKart) {
      myPosRef.set(game.serialize());
    } else {
      playerRef.update(Object.assign({ status: game.gameOver ? 'gameover' : 'playing' }, def.sync(game)));
      const scoreEl = document.getElementById('game-score');
      if (String(game.score) !== scoreEl.textContent) {
        scoreEl.textContent = game.score;
        scoreEl.classList.remove('bump'); void scoreEl.offsetWidth; scoreEl.classList.add('bump');
      }
      if (stats[0]) document.getElementById('val-a').textContent = game[stats[0].key];
      if (stats[1]) document.getElementById('val-b').textContent = game[stats[1].key];
    }
    if (game.gameOver) endGame();
  }

  // ── 카트: 다른 플레이어 · 아이템 동기화 ──
  function attachPeerSync() {
    posRef.on('child_added',   s => applyPeer(s.key, s.val()));
    posRef.on('child_changed', s => applyPeer(s.key, s.val()));
    posRef.on('child_removed', s => { delete peerPos[s.key]; pushPeers(); });

    hazardsRef.on('child_added',   s => { hazards[s.key] = s.val(); if (game) game.setHazards(hazards); });
    hazardsRef.on('child_removed', s => { delete hazards[s.key]; if (game) game.setHazards(hazards); });

    eventsRef.on('child_added', s => {
      const e = s.val();
      if (!e || e.by === playerId || !game) return;
      if (e.type === 'bolt') {
        if (game.progress > e.p) game.hitByBolt();
      } else if (e.type === 'missile' && e.target === playerId) {
        game.hitByMissile();
      } else if (e.type === 'swap' && e.target === playerId) {
        game.teleportTo(e.state);
      }
    });

    playersRef.on('child_added', s => { names[s.key] = (s.val() || {}).nickname || ''; });
  }

  function applyPeer(id, raw) {
    if (id === playerId || !raw) return;
    const a = String(raw).split(',');
    const fl = +a[5] || 0;
    peerPos[id] = {
      x: +a[0], y: +a[1], angle: +a[2], lap: +a[3], progress: +a[4],
      spin: !!(fl & 1), shield: !!(fl & 2), boost: !!(fl & 4),
      finished: a[6] === '1', name: names[id] || ''
    };
    pushPeers();
  }
  function pushPeers() {
    if (!game || !game.setPeers) return;
    Object.keys(peerPos).forEach(id => { peerPos[id].name = names[id] || peerPos[id].name; });
    game.setPeers(peerPos);
  }

  function dropHazard(x, y) { hazardsRef.push({ x: Math.round(x), y: Math.round(y) }); }
  function hitHazard(hid)   { hazardsRef.child(hid).remove(); }
  // 아이템 공격 전송 (bolt는 전체, missile/swap은 특정 대상)
  function sendAttack(type, target, payload) {
    const msg = { type: type, by: playerId };
    if (target) msg.target = target;
    if (type === 'bolt') msg.p = payload.p;
    if (type === 'swap') msg.state = payload;
    const ref = eventsRef.push(msg);
    setTimeout(() => ref.remove(), 3000);
  }

  // 완주 순위를 원자적으로 배정
  function reportFinish() {
    db.ref('finishCount').transaction(c => (c || 0) + 1, (err, ok, snap) => {
      const rank = ok ? snap.val() : null;
      if (game) game.finishRank = rank;
      playerRef.update({ status: 'finished', score: rank ? (1000 - rank) : 0, rank: rank });
      showResult(rank);
    });
  }

  function drawNextPreview() {
    const c = document.getElementById('next-canvas');
    const size = 11, dpr = window.devicePixelRatio || 1;
    c.style.width = (size * 4) + 'px'; c.style.height = (size * 4) + 'px';
    c.width = size * 4 * dpr; c.height = size * 4 * dpr;
    const ctx = c.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (game && game.drawNext) game.drawNext(ctx, size);
  }

  function loop(ts) {
    if (!game) return;
    if (game.gameOver) { game.draw(); return; }
    game.tick(ts);
    if (isKart) renderKartHud(game.hud());
    requestAnimationFrame(loop);
  }

  // ── 레이싱 HUD (매 프레임 갱신) ──
  const ROLL_ICONS = ['🍌','⚡','🚀','🌀','🛡','🌩'];
  let lastItemSig = '';
  function renderKartHud(h) {
    document.getElementById('hud-rank').textContent = h.rank;
    document.getElementById('hud-total').textContent = '/' + h.total;
    document.getElementById('hud-lap').textContent = h.lap;
    document.getElementById('hud-laps').textContent = '/' + h.laps;
    document.getElementById('hud-speed').textContent = h.speed;
    document.getElementById('hud-speed-bar').style.width = h.speedPct.toFixed(0) + '%';

    const sig = h.items.join(',') + (h.rolling ? '|roll' : '');
    const nameEl = document.getElementById('item-name');

    for (let i = 0; i < 2; i++) {
      const slot = document.getElementById('item-slot-' + i);
      const icon = slot.firstElementChild;
      const it = h.items[i];
      // 룰렛은 비어 있는 첫 칸에서 돌아감
      const rollingHere = h.rolling && i === h.items.length;
      const base = 'item-slot' + (i === 1 ? ' small' : '');
      if (rollingHere) {
        icon.textContent = ROLL_ICONS[Math.floor(performance.now()/70) % ROLL_ICONS.length];
        slot.className = base + ' rolling';
      } else if (it) {
        icon.textContent = ITEMS[it].icon;
        slot.className = base + ' has' + (i === 0 ? ' ready' : '');
        if (sig !== lastItemSig) {
          slot.classList.add('pop');
          setTimeout(() => slot.classList.remove('pop'), 320);
        }
      } else {
        icon.textContent = '';
        slot.className = base;
      }
    }
    nameEl.textContent = h.items.length ? ITEMS[h.items[0]].name : '';
    lastItemSig = sig;

    const badges = document.getElementById('hud-badges');
    const want = [];
    if (h.shield) want.push('🛡 방어막');
    if (h.boost)  want.push('⚡ 부스터');
    if (h.nearBoost && !h.boost) want.push('부스터 발판 →');
    if (h.grade >  0.06) want.push('▲ 오르막');
    if (h.grade < -0.06) want.push('▼ 내리막');
    const bsig = want.join('|');
    if (badges.dataset.sig !== bsig) {
      badges.dataset.sig = bsig;
      badges.innerHTML = '';
      want.forEach(t => {
        const b = document.createElement('span');
        b.className = 'hud-badge';
        b.textContent = t;
        badges.appendChild(b);
      });
    }
  }

  // ── 조작 바인딩 ──
  function bindControls() {
    if (byId('btn-left'))  press('btn-left',  () => game && game.move(-1), () => game && game.releaseSteer && game.releaseSteer(-1), isKart ? null : 90);
    if (byId('btn-right')) press('btn-right', () => game && game.move(1),  () => game && game.releaseSteer && game.releaseSteer(1),  isKart ? null : 90);
    if (byId('btn-rotate')) tap('btn-rotate', () => game && game.rotate());
    if (byId('btn-drop'))   tap('btn-drop',   () => game && game.hardDrop());
    if (byId('btn-item'))    tap('btn-item',    () => game && game.useItem());
    if (byId('btn-discard')) tap('btn-discard', () => game && game.dropItem());
    if (byId('btn-down')) press('btn-down',
      () => { if (game) { game.softDropping = true; game.softDrop(); } },
      () => { if (game) game.softDropping = false; });
    if (byId('btn-up'))   tap('btn-up',   () => game && (game.up ? game.up() : game.rotate()));
    if (byId('btn-jump')) tap('btn-jump', () => game && (game.jump ? game.jump() : game.rotate()));
    if (byId('btn-fire')) press('btn-fire',
      () => { if (game) { game.firing = true; if (game.fire) game.fire(); } },
      () => { if (game) game.firing = false; });
    bindSwipe();
    document.addEventListener('keydown', onKeyDown);
    document.addEventListener('keyup', onKeyUp);
  }
  function byId(id) { return document.getElementById(id); }

  // 누르는 동안 유지 (repeat 값을 주면 연타처럼 반복)
  function press(id, onStart, onEnd, repeatMs) {
    const el = byId(id);
    let rep = null, delay = null;
    const start = e => {
      e.preventDefault(); onStart();
      if (repeatMs) delay = setTimeout(() => { rep = setInterval(onStart, repeatMs); }, 250);
    };
    const stop = () => { clearTimeout(delay); clearInterval(rep); rep = null; if (onEnd) onEnd(); };
    el.addEventListener('touchstart', start, { passive: false });
    ['touchend','touchcancel','mouseup','mouseleave'].forEach(ev => el.addEventListener(ev, stop));
    el.addEventListener('mousedown', start);
  }

  function tap(id, fn) {
    const el = byId(id);
    let touched = false;
    el.addEventListener('touchstart', e => { e.preventDefault(); touched = true; fn(); }, { passive: false });
    el.addEventListener('click', e => { e.preventDefault(); if (!touched) fn(); touched = false; });
  }

  function bindSwipe() {
    const canvas = byId('game-canvas');
    if (isKart) {
      // 카트: 화면 좌/우 절반을 눌러도 조향
      let dir = 0;
      canvas.addEventListener('touchstart', e => {
        const t = e.touches[0];
        dir = (t.clientX < window.innerWidth / 2) ? -1 : 1;
        if (game) game.move(dir);
      }, { passive: true });
      const rel = () => { if (game && game.releaseSteer) game.releaseSteer(dir); };
      canvas.addEventListener('touchend', rel);
      canvas.addEventListener('touchcancel', rel);
      return;
    }
    let sx = 0, sy = 0, moved = false;
    canvas.addEventListener('touchstart', e => {
      const t = e.touches[0]; sx = t.clientX; sy = t.clientY; moved = false;
    }, { passive: true });
    canvas.addEventListener('touchmove', e => {
      if (!game) return;
      const t = e.touches[0], dx = t.clientX - sx, dy = t.clientY - sy, th = cellSize;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > th) { game.move(dx > 0 ? 1 : -1); sx = t.clientX; moved = true; }
      else if (dy > th * 2) { (game.down ? game.down() : game.hardDrop()); sy = t.clientY; moved = true; }
      else if (dy < -th * 2) { (game.up ? game.up() : game.rotate()); sy = t.clientY; moved = true; }
      e.preventDefault();
    }, { passive: false });
    canvas.addEventListener('touchend', () => { if (!moved && game) game.rotate(); });
  }

  function onKeyDown(e) {
    if (!game || game.gameOver) return;
    if (e.key === 'ArrowLeft') game.move(-1);
    else if (e.key === 'ArrowRight') game.move(1);
    else if (e.key === 'ArrowDown') { game.softDropping = true; }
    else if (e.key === 'ArrowUp') game.rotate();
    else if (e.key === ' ') { e.preventDefault(); isKart ? game.useItem() : game.hardDrop(); }
    else if (isKart && (e.key === 'd' || e.key === 'D' || e.key === 'Backspace')) {
      e.preventDefault(); game.dropItem();
    }
  }
  function onKeyUp(e) {
    if (!game) return;
    if (e.key === 'ArrowLeft'  && game.releaseSteer) game.releaseSteer(-1);
    if (e.key === 'ArrowRight' && game.releaseSteer) game.releaseSteer(1);
    if (e.key === 'ArrowDown') game.softDropping = false;
  }

  // ── 결과 ──
  function endGame() {
    clearInterval(syncTimer);
    stopGame();
    document.getElementById('final-score').textContent = game.score;
    document.getElementById('final-detail').textContent = def.detail ? def.detail(game) : '';
    show('screen-over');
    playersRef.once('value').then(snap => {
      const players = snap.val() || {};
      const scores = Object.keys(players).map(id => players[id].score || 0);
      if (scores.length < 2) return;
      scores.sort((a, b) => b - a);
      showRank(scores.indexOf(game.score) + 1, scores.length);
    });
  }

  function showResult(rank) {
    document.getElementById('over-label').textContent = '완주 순위';
    document.getElementById('final-score').textContent = rank ? rank + '등' : '완주';
    document.getElementById('final-detail').textContent = '3바퀴를 모두 돌았습니다';
    show('screen-over');
    clearInterval(syncTimer);
    playersRef.once('value').then(s => showRank(rank, Object.keys(s.val() || {}).length));
  }

  function showRank(rank, total) {
    if (!rank || total < 2) return;
    document.getElementById('rank-value').textContent = rank + '등';
    document.getElementById('rank-desc').textContent = '전체 ' + total + '명';
    document.getElementById('rank-stat').classList.remove('hidden');
  }

  function stopGame() {
    clearInterval(syncTimer);
    document.removeEventListener('keydown', onKeyDown);
    document.removeEventListener('keyup', onKeyUp);
  }

  document.addEventListener('gesturestart', e => e.preventDefault());
})();
</script>
</body>
</html>
