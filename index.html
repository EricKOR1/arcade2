<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0E1016">
<title>아케이드</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- 입장 -->
  <section id="screen-join" class="screen centered active">
    <div class="game-chip" id="join-chip"></div>
    <h1 class="title-lg">닉네임을 정해주세요</h1>
    <p class="subtle">친구들에게 이 이름으로 보여요</p>
    <div class="field">
      <input id="nickname-input" type="text" maxlength="8" placeholder="8자 이내" autocomplete="off" autocapitalize="off">
    </div>
    <button id="join-btn" class="btn-full">입장하기</button>
    <p id="join-error" class="error hidden"></p>
  </section>

  <!-- 대기 -->
  <section id="screen-wait" class="screen centered">
    <div class="pulse-ring"><span id="wait-count">0</span></div>
    <h1 class="title-lg">시작을 기다리는 중</h1>
    <p class="subtle">선생님이 시작하면 자동으로 넘어갑니다</p>
    <div class="roster" id="roster"></div>
  </section>

  <!-- 게임 -->
  <section id="screen-game" class="screen">
    <div class="topbar">
      <div class="stat primary"><span class="k">SCORE</span><span class="v num" id="game-score">0</span></div>
      <div class="stat" id="stat-lines"><span class="k">LINES</span><span class="v num" id="game-lines">0</span></div>
      <div class="stat" id="stat-level"><span class="k">LEVEL</span><span class="v num" id="game-level">1</span></div>
      <div class="spacer"></div>
      <div class="next-box" id="next-box">
        <span class="k">NEXT</span>
        <canvas id="next-canvas"></canvas>
      </div>
      <button id="mute-btn" class="icon-btn" aria-label="소리 끄기">♪</button>
    </div>
    <div class="canvas-wrap">
      <canvas id="game-canvas"></canvas>
    </div>
    <div class="pad" id="pad"></div>
  </section>

  <!-- 결과 -->
  <section id="screen-over" class="screen centered">
    <div class="game-chip" id="over-chip"></div>
    <p class="subtle">최종 점수</p>
    <div class="result-score num" id="final-score">0</div>
    <p class="subtle" id="final-detail"></p>
    <div class="rank-pill hidden" id="rank-pill"></div>
  </section>

  <!-- 종료 -->
  <section id="screen-ended" class="screen centered">
    <h1 class="title-lg">수업이 끝났습니다</h1>
    <p class="subtle">함께해줘서 고마워요</p>
  </section>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="sound.js"></script>
<script src="shared.js"></script>
<script src="tetris-engine.js"></script>
<script src="racing-engine.js"></script>
<script src="games.js"></script>
<script>
(function () {

  const gameId = getGameId();
  const def = GAMES[gameId];
  const isTetris = (gameId === 'tetris');

  applyAccent(gameId);
  document.getElementById('join-chip').textContent = def.name;
  document.getElementById('over-chip').textContent = def.name;

  if (!def.hasNext) document.getElementById('next-box').classList.add('hidden');
  if (!isTetris) {
    document.getElementById('stat-lines').classList.add('hidden');
    document.getElementById('stat-level').classList.add('hidden');
  }

  function show(id) {
    document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  let playerId = sessionStorage.getItem('playerId');
  if (!playerId) {
    playerId = 'p_' + Math.random().toString(36).slice(2, 10);
    sessionStorage.setItem('playerId', playerId);
  }

  const playerRef = db.ref('players/' + playerId);
  const playersRef = db.ref('players');
  const sessionStatusRef = db.ref('session/status');

  let game = null, syncTimer = null, started = false, cellSize = 20;
  let myNickname = '';

  // ── 소리 토글 ──
  const muteBtn = document.getElementById('mute-btn');
  muteBtn.addEventListener('click', () => {
    const on = !Sound.isEnabled();
    Sound.setEnabled(on);
    muteBtn.textContent = on ? '♪' : '✕';
    muteBtn.classList.toggle('off', !on);
  });

  // ── 입장 ──
  document.getElementById('join-btn').addEventListener('click', join);
  document.getElementById('nickname-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.target.blur(); join(); }
  });

  function join() {
    Sound.resume();
    const nickname = document.getElementById('nickname-input').value.trim();
    const err = document.getElementById('join-error');
    if (!nickname) {
      err.textContent = '닉네임을 입력해주세요';
      err.classList.remove('hidden');
      return;
    }
    err.classList.add('hidden');
    myNickname = nickname;
    playerRef.set({
      nickname: nickname, game: gameId, status: 'waiting',
      joinedAt: firebase.database.ServerValue.TIMESTAMP, score: 0
    });
    playerRef.onDisconnect().remove();
    show('screen-wait');
  }

  // 대기실에 누가 있는지 실시간 표시
  playersRef.on('value', snap => {
    const players = snap.val() || {};
    const ids = Object.keys(players);
    document.getElementById('wait-count').textContent = ids.length;
    const roster = document.getElementById('roster');
    roster.innerHTML = '';
    ids.forEach(id => {
      const el = document.createElement('span');
      el.textContent = players[id].nickname || '';
      if (id === playerId) el.className = 'me';
      roster.appendChild(el);
    });
  });

  sessionStatusRef.on('value', snap => {
    const status = snap.val();
    if (status === 'playing' && !started) startGame();
    else if (status === 'ended') { stopGame(); show('screen-ended'); }
  });

  // ── 캔버스를 화면에 꽉 채우기 ──
  function fitCanvas() {
    const canvas = document.getElementById('game-canvas');
    const wrap = canvas.parentElement;
    const availW = wrap.clientWidth, availH = wrap.clientHeight;
    if (availW <= 0 || availH <= 0) return;
    cellSize = Math.max(10, Math.floor(Math.min(availW / def.cols, availH / def.rows)));
    const dpr = window.devicePixelRatio || 1;
    const w = cellSize * def.cols, h = cellSize * def.rows;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
    if (game) {
      if (game.resize) game.resize(cellSize); else game.cellSize = cellSize;
      game.draw();
    }
  }

  window.addEventListener('resize', () => { if (game) fitCanvas(); });
  window.addEventListener('orientationchange', () => setTimeout(() => { if (game) fitCanvas(); }, 350));

  // ── 조작 패드 구성 ──
  const PAD = {
    left:   { label: '←', cls: 'k-left' },
    right:  { label: '→', cls: 'k-right' },
    rotate: { label: '↻', cls: 'k-rotate' },
    down:   { label: '↓', cls: 'k-down' },
    drop:   { label: '바로 내리기', cls: 'k-drop' },
    boost:  { label: '부스트', cls: 'k-boost' }
  };
  function buildPad() {
    const pad = document.getElementById('pad');
    pad.innerHTML = '';
    pad.classList.toggle('pad-race', gameId === 'racing');
    def.controls.forEach(c => {
      const b = document.createElement('button');
      b.id = 'btn-' + c;
      b.className = PAD[c].cls;
      b.textContent = PAD[c].label;
      b.setAttribute('aria-label', PAD[c].label);
      pad.appendChild(b);
    });
  }

  function startGame() {
    started = true;
    Sound.resume();
    playerRef.update({ status: 'playing' });
    show('screen-game');
    buildPad();

    const canvas = document.getElementById('game-canvas');
    requestAnimationFrame(() => {
      fitCanvas();
      game = def.create(canvas, cellSize);
      if (def.hasNext) { game.onNextChange = drawNextPreview; drawNextPreview(); }
      game.draw();
      bindControls();
      Sound.start();

      syncTimer = setInterval(() => {
        if (!game) return;
        playerRef.update({
          board: boardToRows(game.getSnapshot()),
          score: game.score,
          status: game.gameOver ? 'gameover' : 'playing'
        });
        document.getElementById('game-score').textContent = game.score;
        if (isTetris) {
          document.getElementById('game-lines').textContent = game.lines;
          document.getElementById('game-level').textContent = game.level;
        }
        if (game.gameOver) endGame();
      }, 200);

      requestAnimationFrame(loop);
    });
  }

  function drawNextPreview() {
    const c = document.getElementById('next-canvas');
    const size = 11, dpr = window.devicePixelRatio || 1;
    c.style.width = (size * 4) + 'px';
    c.style.height = (size * 4) + 'px';
    c.width = size * 4 * dpr; c.height = size * 4 * dpr;
    const ctx = c.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (game && game.drawNext) game.drawNext(ctx, size);
  }

  function loop(ts) {
    if (!game || game.gameOver) { if (game && game.draw) game.draw(); return; }
    game.tick(ts);
    requestAnimationFrame(loop);
  }

  // ── 조작 ──
  function bindControls() {
    if (document.getElementById('btn-left'))   hold('btn-left',  () => game && game.move(-1));
    if (document.getElementById('btn-right'))  hold('btn-right', () => game && game.move(1));
    if (document.getElementById('btn-rotate')) tap('btn-rotate', () => game && game.rotate());
    if (document.getElementById('btn-drop'))   tap('btn-drop',   () => game && game.hardDrop());
    if (document.getElementById('btn-down')) {
      press('btn-down',
        () => { if (game) { game.softDropping = true; game.softDrop(); } },
        () => { if (game) game.softDropping = false; });
    }
    if (document.getElementById('btn-boost')) {
      press('btn-boost',
        () => { if (game && game.setBoost) game.setBoost(true); },
        () => { if (game && game.setBoost) game.setBoost(false); });
    }
    bindSwipe();
    document.addEventListener('keydown', handleKeyDown);
    document.addEventListener('keyup', handleKeyUp);
  }

  function hold(id, fn) {
    const el = document.getElementById(id);
    let timer = null, repeat = null;
    const start = e => {
      e.preventDefault(); fn();
      timer = setTimeout(() => { repeat = setInterval(fn, 90); }, 260);
    };
    const stop = () => { clearTimeout(timer); clearInterval(repeat); repeat = null; };
    el.addEventListener('touchstart', start, { passive: false });
    ['touchend','touchcancel','mouseup','mouseleave'].forEach(ev => el.addEventListener(ev, stop));
    el.addEventListener('mousedown', start);
  }

  function press(id, onStart, onEnd) {
    const el = document.getElementById(id);
    const s = e => { e.preventDefault(); onStart(); };
    el.addEventListener('touchstart', s, { passive: false });
    ['touchend','touchcancel','mouseup','mouseleave'].forEach(ev => el.addEventListener(ev, onEnd));
    el.addEventListener('mousedown', s);
  }

  function tap(id, fn) {
    const el = document.getElementById(id);
    let touched = false;
    el.addEventListener('touchstart', e => { e.preventDefault(); touched = true; fn(); }, { passive: false });
    el.addEventListener('click', e => { e.preventDefault(); if (!touched) fn(); touched = false; });
  }

  function bindSwipe() {
    const canvas = document.getElementById('game-canvas');
    let sx = 0, sy = 0, moved = false;
    canvas.addEventListener('touchstart', e => {
      const t = e.touches[0]; sx = t.clientX; sy = t.clientY; moved = false;
    }, { passive: true });
    canvas.addEventListener('touchmove', e => {
      if (!game) return;
      const t = e.touches[0];
      const dx = t.clientX - sx, dy = t.clientY - sy, th = cellSize;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > th) {
        game.move(dx > 0 ? 1 : -1); sx = t.clientX; moved = true;
      } else if (isTetris && dy > th * 2) {
        game.hardDrop(); sy = t.clientY; moved = true;
      }
      e.preventDefault();
    }, { passive: false });
    canvas.addEventListener('touchend', () => {
      if (!moved && game && isTetris) game.rotate();
    });
  }

  function handleKeyDown(e) {
    if (!game || game.gameOver) return;
    if (e.key === 'ArrowLeft') game.move(-1);
    else if (e.key === 'ArrowRight') game.move(1);
    else if (e.key === 'ArrowDown') { game.softDropping = true; if (game.setBoost) game.setBoost(true); }
    else if (e.key === 'ArrowUp') game.rotate();
    else if (e.key === ' ') { e.preventDefault(); game.hardDrop(); }
  }
  function handleKeyUp(e) {
    if (!game) return;
    if (e.key === 'ArrowDown') { game.softDropping = false; if (game.setBoost) game.setBoost(false); }
  }

  function endGame() {
    const myScore = game.score;
    document.getElementById('final-score').textContent = myScore;
    document.getElementById('final-detail').textContent =
      isTetris ? (game.lines + '줄 완성 · 레벨 ' + game.level) : '끝까지 달렸어요';
    show('screen-over');
    clearInterval(syncTimer);
    stopGame();

    // 전체 중 몇 등인지 표시
    playersRef.once('value').then(snap => {
      const players = snap.val() || {};
      const scores = Object.keys(players).map(id => players[id].score || 0);
      if (scores.length < 2) return;
      scores.sort((a, b) => b - a);
      const rank = scores.indexOf(myScore) + 1;
      const pill = document.getElementById('rank-pill');
      pill.innerHTML = '';
      pill.appendChild(document.createTextNode(scores.length + '명 중 '));
      const b = document.createElement('b');
      b.textContent = rank + '등';
      pill.appendChild(b);
      pill.classList.remove('hidden');
    });
  }

  function stopGame() {
    clearInterval(syncTimer);
    document.removeEventListener('keydown', handleKeyDown);
    document.removeEventListener('keyup', handleKeyUp);
  }

  document.addEventListener('gesturestart', e => e.preventDefault());
})();
</script>
</body>
</html>
