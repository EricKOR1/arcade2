<script>
(function () {
"use strict";

var GAME_ID = "force";

/* ══════════════════════════════════════════════════════════
   0. 기본 상수
   ══════════════════════════════════════════════════════════ */
var W = 1000, H = 560, PX = 26, GY = 430;
var G = 9.8, RHO_W = 1000, RHO_A = 1.2, D = 0.05;
var cam = { x: 0, t: 0 };                    // 화면이 공을 따라간다

function sx(x) { return (x - cam.x) * PX; }
function sy(y) { return GY - y * PX; }
function viewW() { return W / PX; }

var MAT = {
  wood:  { n: "나무", rho: 600,  str: 330,  e: 0.20, mu: 0.55, c: "#C08A4E", c2: "#8E6234" },
  ice:   { n: "얼음", rho: 920,  str: 95,  e: 0.10, mu: 0.22, c: "#8FD8E8", c2: "#5FA9BE" },
  stone: { n: "돌",   rho: 2600, str: 850, e: 0.12, mu: 0.72, c: "#9AA7A5", c2: "#6E7A78" },
  star:  { n: "목표", rho: 350,  str: 65,  e: 0.28, mu: 0.5,  c: "#FFC53D", c2: "#D08F14" },
  starh: { n: "목표", rho: 2400, str: 65,  e: 0.18, mu: 0.6,  c: "#FFC53D", c2: "#B87F0F" },
  rock:  { n: "바위", rho: 3000, str: 1e9,  e: 0.18, mu: 0.8,  c: "#4A5A58", c2: "#2E3A38" }
};
var GND = {
  grass: { n: "잔디", d: "조금 까칠", mu: 0.55, c: "#2f7a45" },
  sand:  { n: "모래", d: "아주 까칠", mu: 0.95, c: "#c9a45e" },
  ice:   { n: "얼음", d: "미끄러움", mu: 0.06, c: "#8fd8e8" }
};
var BALLS = {
  foam:   { n: "스티로폼", r: 0.55, rho: 60,   e: 0.35, mu: 0.5, c: "#EAF4F0" },
  wood:   { n: "나무 공",  r: 0.42, rho: 600,  e: 0.30, mu: 0.5, c: "#C89B62" },
  rubber: { n: "고무 공",  r: 0.38, rho: 1100, e: 0.62, mu: 0.7, c: "#FF7A4D" },
  stone:  { n: "돌 공",    r: 0.34, rho: 2600, e: 0.12, mu: 0.6, c: "#9AA7A5" }
};
function ballMass(b) { return b.rho * Math.PI * b.r * b.r * D; }

/* ══════════════════════════════════════════════════════════
   1. 강체 물리 엔진
   ══════════════════════════════════════════════════════════ */
function poly(x, y, w, h, mat, ang, isStatic) {
  var m = MAT[mat], area = w * h, mass = isStatic ? 0 : m.rho * area * D;
  var b = {
    kind: "poly", x: x, y: y, vx: 0, vy: 0, a: ang || 0, av: 0,
    hw: w / 2, hh: h / 2, w: w, h: h, mat: mat, M: m, st: !!isStatic,
    mass: mass, im: isStatic ? 0 : 1 / mass,
    I: isStatic ? 0 : mass * (w * w + h * h) / 12,
    hp: m.str * area, hp0: m.str * area,
    e: m.e, mu: m.mu, sleep: 0, dead: false, flash: 0
  };
  b.ii = b.I > 0 ? 1 / b.I : 0;
  b.star = (mat === 'star' || mat === 'starh');
  b.seed = Math.random() * 999;
  return b;
}
function circle(x, y, r, bd) {
  var mass = ballMass(bd), I = 0.5 * mass * r * r;
  return {
    kind: "circle", x: x, y: y, vx: 0, vy: 0, a: 0, av: 0, r: r,
    mat: "ball", M: { c: bd.c, c2: "#000", str: 1e9 }, st: false,
    mass: mass, im: 1 / mass, I: I, ii: 1 / I, rho: bd.rho,
    hp: 1e9, hp0: 1e9, e: bd.e, mu: bd.mu, sleep: 0, dead: false, flash: 0, F: {}
  };
}
/* 사각형의 꼭짓점 (반시계 방향) */
function verts(b) {
  var c = Math.cos(b.a), s = Math.sin(b.a), o = [];
  var p = [[-b.hw, -b.hh], [b.hw, -b.hh], [b.hw, b.hh], [-b.hw, b.hh]];
  for (var i = 0; i < 4; i++)
    o.push({ x: b.x + p[i][0] * c - p[i][1] * s, y: b.y + p[i][0] * s + p[i][1] * c });
  return o;
}
/* 각 면의 바깥쪽 법선 */
function normsOf(vs) {
  var o = [];
  for (var i = 0; i < 4; i++) {
    var j = (i + 1) % 4;
    var dx = vs[j].x - vs[i].x, dy = vs[j].y - vs[i].y;
    var l = Math.sqrt(dx * dx + dy * dy) || 1;
    o.push({ x: dy / l, y: -dx / l });
  }
  return o;
}
/* A 의 면들 중 B 와 가장 많이 떨어진 면을 찾는다 (분리축 정리) */
function maxSep(va, na, vb) {
  var best = -1e9, face = 0;
  for (var i = 0; i < 4; i++) {
    var n = na[i], mn = 1e9;
    for (var k = 0; k < 4; k++) {
      var d = vb[k].x * n.x + vb[k].y * n.y;
      if (d < mn) mn = d;
    }
    var sep = mn - (va[i].x * n.x + va[i].y * n.y);
    if (sep > best) { best = sep; face = i; }
  }
  return { sep: best, face: face };
}
/* 선분을 평면으로 자르기 */
function clipSeg(p0, p1, n, off) {
  var d0 = (p0.x * n.x + p0.y * n.y) - off;
  var d1 = (p1.x * n.x + p1.y * n.y) - off;
  var out = [];
  if (d0 <= 0) out.push(p0);
  if (d1 <= 0) out.push(p1);
  if (d0 * d1 < 0) {
    var t = d0 / (d0 - d1);
    out.push({ x: p0.x + t * (p1.x - p0.x), y: p0.y + t * (p1.y - p0.y) });
  }
  return out.slice(0, 2);
}

/* 사각형 ↔ 사각형 : 기준면을 정하고 상대 면을 잘라 접촉점을 만든다 */
function polyPoly(A, B) {
  var va = verts(A), vb = verts(B);
  var na = normsOf(va), nb = normsOf(vb);
  var sa = maxSep(va, na, vb);
  if (sa.sep > 0) return null;
  var sb = maxSep(vb, nb, va);
  if (sb.sep > 0) return null;

  var ref, inc, rv, iv, rn, refFace, flip;
  if (sa.sep > sb.sep - 0.004) { ref = A; inc = B; rv = va; iv = vb; rn = na; refFace = sa.face; flip = false; }
  else { ref = B; inc = A; rv = vb; iv = va; rn = nb; refFace = sb.face; flip = true; }

  var n = rn[refFace];
  var r0 = rv[refFace], r1 = rv[(refFace + 1) % 4];

  // 법선과 가장 반대인 면을 상대 면으로 고른다
  var inr = normsOf(iv), bestD = 1e9, incFace = 0;
  for (var i = 0; i < 4; i++) {
    var d = inr[i].x * n.x + inr[i].y * n.y;
    if (d < bestD) { bestD = d; incFace = i; }
  }
  var i0 = iv[incFace], i1 = iv[(incFace + 1) % 4];

  // 기준면의 양옆으로 잘라낸다
  var tx = r1.x - r0.x, ty = r1.y - r0.y;
  var tl = Math.sqrt(tx * tx + ty * ty) || 1;
  tx /= tl; ty /= tl;
  var seg = clipSeg(i0, i1, { x: -tx, y: -ty }, -(r0.x * tx + r0.y * ty));
  if (seg.length < 2) return null;
  seg = clipSeg(seg[0], seg[1], { x: tx, y: ty }, (r1.x * tx + r1.y * ty));
  if (seg.length < 1) return null;

  // 기준면 안쪽으로 파고든 점만 남긴다
  var off = r0.x * n.x + r0.y * n.y, pts = [], deps = [];
  for (var q = 0; q < seg.length; q++) {
    var sep = (seg[q].x * n.x + seg[q].y * n.y) - off;
    if (sep <= 0) { pts.push(seg[q]); deps.push(-sep); }
  }
  if (!pts.length) return null;

  var out = { n: flip ? { x: -n.x, y: -n.y } : { x: n.x, y: n.y },
              pts: pts, deps: deps, d: Math.max.apply(null, deps) };
  return out;
}

/* 원 ↔ 사각형 */
function circlePoly(C, P) {
  var c = Math.cos(-P.a), s = Math.sin(-P.a);
  var dx = C.x - P.x, dy = C.y - P.y;
  var lx = dx * c - dy * s, ly = dx * s + dy * c;
  var qx = Math.max(-P.hw, Math.min(P.hw, lx));
  var qy = Math.max(-P.hh, Math.min(P.hh, ly));
  var inside = (qx === lx && qy === ly);
  if (inside) {
    var dl = P.hw - Math.abs(lx), dr = P.hh - Math.abs(ly);
    if (dl < dr) qx = (lx > 0 ? P.hw : -P.hw); else qy = (ly > 0 ? P.hh : -P.hh);
  }
  var ex = lx - qx, ey = ly - qy, dist = Math.sqrt(ex * ex + ey * ey);
  if (!inside && dist > C.r) return null;
  var nx, ny;
  if (dist > 1e-6) { nx = ex / dist; ny = ey / dist; } else { nx = 0; ny = 1; }
  if (inside) { nx = -nx; ny = -ny; dist = -dist; }
  var cw = Math.cos(P.a), sw = Math.sin(P.a);
  var wn = { x: -(nx * cw - ny * sw), y: -(nx * sw + ny * cw) };
  var wp = { x: P.x + qx * cw - qy * sw, y: P.y + qx * sw + qy * cw };
  var dep = C.r - dist;
  return { n: wn, pts: [wp], deps: [dep], d: dep };
}

var World = {
  bodies: [], debris: [], parts: [], rings: [], shake: 0, water: null, wind: 0, airOn: false,
  clear: function () { this.bodies = []; this.debris = []; this.parts = []; this.rings = []; this.shake = 0; },
  add: function (b) { this.bodies.push(b); return b; },

  forces: function (b, dt) {
    var m = b.mass, F = { g: -m * G, b: 0, w: 0, airx: 0, airy: 0, wd: 0 };
    // 물에 잠긴 정도는 세로 방향 크기로 잰다 (회전도 반영)
    var half = (b.kind === "circle") ? b.r
             : Math.abs(b.hw * Math.sin(b.a)) + Math.abs(b.hh * Math.cos(b.a));
    if (half < 0.05) half = 0.05;
    var sub = 0;
    if (this.water && b.x > this.water.x0 && b.x < this.water.x1) {
      sub = Math.max(0, Math.min(1, (this.water.y - (b.y - half)) / (2 * half)));
    }
    if (sub > 0) {
      var vol = (b.kind === "circle") ? Math.PI * b.r * b.r * D : b.w * b.h * D;
      F.b = RHO_W * vol * sub * G;                       // 부력
    }
    var area = 2 * half * D;
    var sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
    var wdx = 0, wdy = 0;
    if (sub > 0 && sp > 0.01) {
      // 물의 저항 — 빠를수록, 넓을수록 커진다
      var fw = 0.5 * RHO_W * 0.2 * area * sub * sp;
      var cap = m / dt * 0.7;                            // 계산이 튀지 않도록 제한
      if (fw > cap) fw = cap;
      wdx = -fw * b.vx; wdy = -fw * b.vy;
    }
    F.w = this.wind * area * 12;                         // 바람 (면적에 비례)
    if (this.airOn && sp > 0.01) {
      // 공기의 저항 — 빠를수록, 넓을수록 커진다
      var fa = 0.5 * RHO_A * 0.9 * area * sp;
      F.airx = -fa * b.vx; F.airy = -fa * b.vy;
    }
    F.wd = wdx;
    b.vx += (F.w + F.airx + wdx) / m * dt;
    b.vy += (F.g + F.b + F.airy + wdy) / m * dt;
    if (b.kind === "circle") { F.sub = sub; b.F = F; }
  },

  step: function (dt) {
    var i, j, b;
    for (i = 0; i < this.bodies.length; i++) {
      b = this.bodies[i];
      if (b.st || b.dead || b.sleep > 1.2) continue;
      this.forces(b, dt);
      b.x += b.vx * dt; b.y += b.vy * dt; b.a += b.av * dt;
      b.av *= (1 - 0.5 * dt);
      if (b.flash > 0) b.flash -= dt * 3;
    }
    var cs = [];
    for (i = 0; i < this.bodies.length; i++) {
      for (j = i + 1; j < this.bodies.length; j++) {
        var A = this.bodies[i], B = this.bodies[j];
        if (A.dead || B.dead || (A.st && B.st)) continue;
        if (A.sleep > 1.2 && B.sleep > 1.2) continue;
        var ra = (A.kind === "circle") ? A.r : Math.sqrt(A.hw * A.hw + A.hh * A.hh);
        var rb = (B.kind === "circle") ? B.r : Math.sqrt(B.hw * B.hw + B.hh * B.hh);
        var dx = B.x - A.x, dy = B.y - A.y;
        if (dx * dx + dy * dy > (ra + rb) * (ra + rb)) continue;
        var c = null;
        if (A.kind === "circle" && B.kind === "poly") c = circlePoly(A, B);
        else if (A.kind === "poly" && B.kind === "circle") {
          var t = circlePoly(B, A);
          if (t) c = { n: { x: -t.n.x, y: -t.n.y }, d: t.d, pts: t.pts, deps: t.deps };
        } else if (A.kind === "poly" && B.kind === "poly") c = polyPoly(A, B);
        if (c) { c.A = A; c.B = B; cs.push(c); A.sleep = 0; B.sleep = 0; }

    // 접촉 준비 : 겹침 보정값과 튕김값을 미리 계산
    var inv_dt = 1 / dt;
    for (i = 0; i < cs.length; i++) this.prep(cs[i], inv_dt);
    for (var it = 0; it < 12; it++)
      for (i = 0; i < cs.length; i++) this.solve(cs[i]);

      if (sp2 < 0.2) b.sleep += dt; else b.sleep = 0;
      if (b.sleep > 1.2) { b.vx = 0; b.vy = 0; b.av = 0; }

      d.a += d.av * dt; d.life -= dt;
      if (d.y < 0.1) { d.y = 0.1; d.vy *= -0.3; d.vx *= 0.7; }

  /* 접촉 준비 : 충격량 저장소 · 겹침 보정 · 튕김 */
  prep: function (c, inv_dt) {
    var A = c.A, B = c.B, n = c.n;
    c.e = Math.min(A.e, B.e);
    c.mu = Math.sqrt(A.mu * B.mu);
    c.jn = []; c.jt = []; c.bias = []; c.bounce = []; c.kn = []; c.kt = [];
    c.rA = []; c.rB = []; c.maxJ = 0; c.vn0 = 0;
    for (var k = 0; k < c.pts.length; k++) {
      var p = c.pts[k];
      var rax = p.x - A.x, ray = p.y - A.y, rbx = p.x - B.x, rby = p.y - B.y;
      c.rA.push([rax, ray]); c.rB.push([rbx, rby]);
      var raN = rax * n.y - ray * n.x, rbN = rbx * n.y - rby * n.x;
      var kn = A.im + B.im + A.ii * raN * raN + B.ii * rbN * rbN;
      c.kn.push(kn > 0 ? 1 / kn : 0);
      var tx = -n.y, ty = n.x;
      var raT = rax * ty - ray * tx, rbT = rbx * ty - rby * tx;
      var kt = A.im + B.im + A.ii * raT * raT + B.ii * rbT * rbT;
      c.kt.push(kt > 0 ? 1 / kt : 0);
      // 겹친 만큼 천천히 밀어낸다 (한 번에 밀지 않아 흔들림이 없다)
      var dep = (c.deps && c.deps[k] !== undefined) ? c.deps[k] : c.d;
      c.bias.push(0.22 * inv_dt * Math.max(0, dep - 0.008));
      // 세게 부딪힐 때만 튕긴다
      var rvx = (B.vx - B.av * rby) - (A.vx - A.av * ray);
      var rvy = (B.vy + B.av * rbx) - (A.vy + A.av * rax);
      var vn = rvx * n.x + rvy * n.y;
      c.bounce.push(vn < -1.4 ? -c.e * vn : 0);
      if (vn < (c.vn0 === undefined ? 0 : c.vn0)) c.vn0 = vn;
      c.jn.push(0); c.jt.push(0);
    }
  },

  /* 접촉 풀기 : 수직 충격량 + 쿨롱 마찰 */
  solve: function (c) {
    var A = c.A, B = c.B, n = c.n, tx = -n.y, ty = n.x;
    for (var k = 0; k < c.pts.length; k++) {
      var ra = c.rA[k], rb = c.rB[k];
      var rvx = (B.vx - B.av * rb[1]) - (A.vx - A.av * ra[1]);
      var rvy = (B.vy + B.av * rb[0]) - (A.vy + A.av * ra[0]);
      var vn = rvx * n.x + rvy * n.y;

      var d = c.kn[k] * (-vn + c.bias[k] + c.bounce[k]);
      var old = c.jn[k];
      c.jn[k] = Math.max(0, old + d);
      d = c.jn[k] - old;
      if (c.jn[k] > c.maxJ) c.maxJ = c.jn[k];
      var ix = n.x * d, iy = n.y * d;
      A.vx -= ix * A.im; A.vy -= iy * A.im;
      A.av -= (ra[0] * iy - ra[1] * ix) * A.ii;
      B.vx += ix * B.im; B.vy += iy * B.im;
      B.av += (rb[0] * iy - rb[1] * ix) * B.ii;

      rvx = (B.vx - B.av * rb[1]) - (A.vx - A.av * ra[1]);
      rvy = (B.vy + B.av * rb[0]) - (A.vy + A.av * ra[0]);
      var vt = rvx * tx + rvy * ty;
      var dt2 = c.kt[k] * (-vt);
      var lim = c.mu * c.jn[k];
      var oldT = c.jt[k];
      c.jt[k] = Math.max(-lim, Math.min(lim, oldT + dt2));
      dt2 = c.jt[k] - oldT;
      ix = tx * dt2; iy = ty * dt2;
      A.vx -= ix * A.im; A.vy -= iy * A.im;
      A.av -= (ra[0] * iy - ra[1] * ix) * A.ii;
      B.vx += ix * B.im; B.vy += iy * B.im;
      B.av += (rb[0] * iy - rb[1] * ix) * B.ii;
    }
  },

  /* 충격이 세면 부순다 */
  crush: function (c) {
    if (S && S.shot && c.vn0 < -1.2 &&
        ((c.A.kind === "circle" && !c.B.st) || (c.B.kind === "circle" && !c.A.st)))
      S.shot.touched = true;
    if (c.vn0 > -2.0) return;          // 서로 눌려만 있으면 부서지지 않는다
    var dmg = c.maxJ * 0.4;            // 세게 부딪힌 만큼 손상
    if (dmg < 5) return;
    damage(c.A, dmg);
    damage(c.B, dmg);
  }
};

/* ── 파괴 ─────────────────────────────────── */
function damage(b, j) {
  if (!b || b.st || b.dead || b.kind === "circle") return;
  if (S && S.shot) S.shot.touched = true;
  if (b.M.str > 1e8) return;

  if (b.hp <= 0) breakUp(b);
}
function breakUp(b) {

  });

  for (i = 0; i < n; i++)
    World.debris.push({ x: b.x + (Math.random() - .5) * b.w, y: b.y + (Math.random() - .5) * b.h,

  for (i = 0; i < 12; i++)

  if (!S) return;

  else { S.broke++; S.score += 60; }
}

/* ══════════════════════════════════════════════════════════
   2. 단계 구성
   ══════════════════════════════════════════════════════════ */
function tower(x, base, floors, mat, cap) {
  var out = [], y = base;
  for (var i = 0; i < floors; i++) {
    out.push({ x: x - 0.9, y: y + 1.1, w: 0.42, h: 2.2, m: mat });
    out.push({ x: x + 0.9, y: y + 1.1, w: 0.42, h: 2.2, m: mat });
    out.push({ x: x,       y: y + 2.41, w: 2.6, h: 0.42, m: cap || mat });
    y += 2.63;
  }
  return { blocks: out, top: y };
}
/* 2층 집 : 기둥 4개 + 중간 바닥 + 지붕 */
function house(x, base, mat, cap) {
  var o = [], y = base;
  [1, 2].forEach(function (f) {
    var hw = f === 1 ? 1.5 : 1.0;
    o.push({ x: x - hw, y: y + 1.1, w: 0.42, h: 2.2, m: mat });
    o.push({ x: x + hw, y: y + 1.1, w: 0.42, h: 2.2, m: mat });
    o.push({ x: x, y: y + 2.41, w: hw * 2 + 0.5, h: 0.42, m: cap || mat });
    y += 2.63;
  });
  return { blocks: o, top: y };
}
/* 다리 : 기둥 위에 상판 여러 장 */
function bridge(x0, x1, base, ph, pmat, dmat) {
  var o = [], mid = (x0 + x1) / 2, span = x1 - x0;
  [x0, mid, x1].forEach(function (px) {
    o.push({ x: px, y: base + ph / 2, w: 0.7, h: ph, m: pmat });
  });
  var dy = base + ph + 0.21;
  o.push({ x: (x0 + mid) / 2, y: dy, w: span / 2 - 0.12, h: 0.42, m: dmat });
  o.push({ x: (mid + x1) / 2, y: dy, w: span / 2 - 0.12, h: 0.42, m: dmat });
  return { blocks: o, top: base + ph + 0.42 };
}
/* 벽 : 벽돌을 어긋나게 쌓는다 */
function wall(x, base, rows, mat) {
  var o = [], y = base;
  for (var i = 0; i < rows; i++) {
    var off = (i % 2) ? 0.15 : -0.15;   // 엇쌓기 (아래 벽돌에 걸치도록)
    o.push({ x: x - 0.45 + off, y: y + 0.45, w: 0.9, h: 0.9, m: mat });
    o.push({ x: x + 0.45 + off, y: y + 0.45, w: 0.9, h: 0.9, m: mat });
    y += 0.92;
  }
  return { blocks: o, top: y };
}
/* 피라미드 */
function pyramid(x, base, rows, mat) {
  var o = [], y = base;
  for (var i = 0; i < rows; i++) {
    var n = rows - i;
    for (var j = 0; j < n; j++)
      o.push({ x: x + (j - (n - 1) / 2) * 1.02, y: y + 0.5, w: 1, h: 1, m: mat });
    y += 1.02;
  }
  return { blocks: o, top: y };
}
function star(x, y) { return { x: x, y: y, w: 1, h: 1, m: "star" }; }
function rock(x, y, w, h) { return { x: x, y: y, w: w, h: h, m: "rock", fixed: true }; }

    '<div class="chip"><span>단계</span><b id="fLv">1</b></div>' +
    '<div class="chip"><span>남은 발사</span><b id="fShot">0</b></div>' +

        '</div>' +

var root = null, cv = null, ctx = null, raf = null;
var S = null, DRAG = null, last = 0, accT = 0, hudT = 0, errN = 0, ball = null;
var SLING = { x: 4.5, y: 3.0 }, MAXPULL = 3.0;
/* 센 고무줄일수록 적게 당겨진다 : 탄성력 F = kx 이므로 x = 최대힘 ÷ k */
function fmaxOf() { return (S && LV[S.lv].fmax) || 2250; }
function maxPull() { return Math.min(MAXPULL, fmaxOf() / (S ? S.k : 750)); }
function shotEnergy(k) {
  var x = Math.min(MAXPULL, fmaxOf() / k);
  return 0.5 * k * x * x;
}

function $(id) { return root ? root.querySelector("#" + id) : null; }

function mount(el) {
  root = el; root.innerHTML = TPL;
  cv = $("fCv");
  try { ctx = cv.getContext("2d"); } catch (e) { ctx = null; }
  $("fQuit").onclick = App.goHome;
  $("fRetry").onclick = function () { if (S) startLevel(S.lv); };
  ["pointerdown", "mousedown", "touchstart"].forEach(function (ev) {
    cv.addEventListener(ev, onDown, { passive: false });
  });
  ["pointermove", "mousemove", "touchmove"].forEach(function (ev) {
    cv.addEventListener(ev, onMove, { passive: false });
  });
  ["pointerup", "mouseup", "touchend", "touchcancel", "pointercancel"].forEach(function (ev) {
    document.addEventListener(ev, onUp, { passive: false });
  });
  document.addEventListener("keydown", function (e) {      // ESC 로도 취소
    if (e.key === "Escape" && DRAG) { DRAG = null; }
  });
}

function startLevel(n) {
  var L = LV[n];
  S = { lv: n, shots: L.shots, used: 0, time: L.time, score: 0, hit: 0, broke: 0,
        need: 0, flying: false, over: false, waiting: true, endT: -1,
        ball: L.balls[0], k: L.kPick ? L.kPick[1] : L.k, trail: [], lastTrail: null, settle: 0, flightT: 0,
        pred: null, predShown: false, quizDone: false, quizOK: false,
        tMin: 0, tMax: 50, shot: null, beforeStar: 0, beforeBroke: 0 };
  DRAG = null; accT = 0; hudT = 0; errN = 0; ball = null;
  GY = L.water ? 380 : 430;                 // 물이 있으면 물속이 보이도록
  cam.x = 0; cam.t = 0;

  World.clear();
  World.wind = L.wind || 0;
  World.airOn = !!L.air;
  World.water = L.water ? { x0: L.water.x0, x1: L.water.x1, y: L.water.y } : null;

  L.ground.forEach(function (g) {
    var p = poly((g.x0 + g.x1) / 2, -2, g.x1 - g.x0, 4, "rock", 0, true);
    p.mu = GND[g.g].mu; p.gnd = g.g;
    World.add(p);
  });
  if (L.water) {
    var pb = poly((L.water.x0 + L.water.x1) / 2, -L.water.d - 2,
                  L.water.x1 - L.water.x0, 4, "rock", 0, true);
    pb.mu = 0.5; pb.gnd = "hidden"; World.add(pb);
    var w1 = poly(L.water.x0 - 0.3, -L.water.d / 2, 0.6, L.water.d, "rock", 0, true);
    var w2 = poly(L.water.x1 + 0.3, -L.water.d / 2, 0.6, L.water.d, "rock", 0, true);
    w1.gnd = "hidden"; w2.gnd = "hidden";
    World.add(w1); World.add(w2);
  }
  L.build().forEach(function (b) {
    World.add(poly(b.x, b.y, b.w, b.h, b.m, 0, !!b.fixed));
  });
  var st = World.bodies.filter(function (b) { return b.star && !b.st; });
  S.need = st.length;
  S.tMin = 50; S.tMax = 0;
  st.forEach(function (b) { if (b.x < S.tMin) S.tMin = b.x; if (b.x > S.tMax) S.tMax = b.x; });

  $("fTitle").textContent = (App.meta && App.meta.name) || "슈퍼 발사대";
  $("fSub").textContent = L.title + " — 발사대를 당겨서 놓으세요";
  $("fHint").innerHTML = L.hint;
  buildBalls(); buildK(); paintHud(); showIdea();
  if (!raf) raf = requestAnimationFrame(loop);
}

function showIdea() {
  var L = LV[S.lv];
  var pv = L.predict;
  App.overlay('<h2>' + L.title + '</h2><p>' + L.idea + '</p>' +
    (pv ? '<div class="predbox"><div class="predq">🤔 먼저 예측해 볼까요?<br><b>' + pv.q + '</b></div>' +
          '<div class="predbtns">' + pv.a.map(function (t, i) {
            return '<button class="predb" data-i="' + i + '">' + t + '</button>';
          }).join("") + '</div></div>' : '') +
    '<p style="color:var(--light);font-weight:700;margin-top:14px">제한 시간 ' + L.time +
    '초 · 발사 ' + L.shots + '번 · 목표 ' + S.need + '개</p>' +
    '<div class="btns">' + (pv ? '' : '<button class="primary" id="fGo">시작하기</button>') +
    '<button id="fBack">대시보드로</button></div>');

  var bk = document.getElementById("fBack");
  if (bk) bk.onclick = function () { App.closeOverlay(); App.goHome(); };
  var g = document.getElementById("fGo");
  if (g) g.onclick = function () { App.closeOverlay(); S.waiting = false; last = 0; };
  Array.prototype.forEach.call(document.querySelectorAll(".predb"), function (b2) {
    b2.onclick = function () {
      S.pred = +b2.dataset.i;                       // 예측을 기록하고 바로 시작
      App.closeOverlay(); S.waiting = false; last = 0;
      feed("예측을 기록했어요. 직접 쏘아 확인해 봅시다!", "info");
    };
  });
}

/* 화면 옆에 피드백 한 줄 */
function feed(msg, kind) {
  var el2 = $("fFeed");
  if (!el2) return;
  el2.innerHTML = msg;
  el2.className = "ffeed " + (kind || "info");
}

/* 받침에 따라 조사를 고른다 : J("나무 공","은","는") → "는" */
function J(w, a, b) {
  var c = String(w).charCodeAt(String(w).length - 1);
  if (c < 0xAC00 || c > 0xD7A3) return b;
  return ((c - 0xAC00) % 28) ? a : b;
}

/* 그 자리의 바닥 종류 */
function groundKind(x) {
  var L = LV[S.lv];
  if (L.water && x > L.water.x0 && x < L.water.x1) return null;
  for (var i = 0; i < L.ground.length; i++)
    if (x >= L.ground[i].x0 && x <= L.ground[i].x1) return GND[L.ground[i].g];
  return null;
}

/* 발사 결과를 과학 개념으로 설명해 준다 */
function diagnose(gotStar, brokeN) {
  var L = LV[S.lv], I = S.shot || {};
  var bd = BALLS[S.ball], m = ballMass(bd), wgt = Math.round(m * G);

  });
  var lighter = null;
  L.balls.forEach(function (id) {
    if (ballMass(BALLS[id]) < m && (!lighter || ballMass(BALLS[id]) > ballMass(BALLS[lighter])))
      lighter = id;
  });
  function tip(main, sci) {
    feed(main + '<div class="fsci">💡 ' + sci + '</div>',
         arguments[2] || "warn");
  }

  /* ── 성공 ── */
  if (gotStar > 0) {
    tip("좋아요! 목표 <b>" + gotStar + "개</b>를 맞혔습니다.",
        "부딪힐 때의 세기는 <b>질량이 클수록, 빠를수록</b> 커집니다. " +
        "지금 쓴 " + bd.n + J(bd.n, "은", "는") + " 무게가 " + wgt + " N 이었어요.", "good");
    return;

  if (I.floated) {

    L.balls.forEach(function (id) {
      if (BALLS[id].rho > RHO_W && (!sink || BALLS[id].rho < BALLS[sink].rho)) sink = id;
    });

        "물이 위로 밀어 올리는 <b>부력</b>이 아래로 당기는 <b>중력</b>보다 컸기 때문입니다. " +
        (sink ? "물보다 무거운 <b>" + BALLS[sink].n + "</b>" + J(BALLS[sink].n, "을", "를") +

  /* ── 아무것에도 닿지 못했을 때 ── */

            "거친 면일수록 <b>마찰력</b>이 커서 움직임을 크게 방해합니다. " +
            "미끄러운 곳에 떨어뜨리면 훨씬 멀리 굴러가요.");
      else

            "날아가는 동안 <b>중력</b>이 계속 아래로 당기므로 멀리 못 가요.");
    } else if (I.maxX > S.tMax + 3) {

          "많이 당길수록 <b>탄성력</b>이 커져 더 빠르게 날아갑니다. 조금 덜 당겨 보세요.");
    } else if (L.wind) {
      tip("아깝게 <b>빗나갔어요</b>.",
          "오늘은 <b>바람</b>이 함께 작용합니다. 바람이 미는 쪽의 반대로 조준을 옮겨 보세요. " +
          (heavier ? "무거운 <b>" + BALLS[heavier].n + "</b>" + J(BALLS[heavier].n, "은", "는") +
           " 바람에 덜 밀립니다." : ""));
    } else {

          "공은 날아가는 내내 <b>중력</b>을 받아 아래로 휘어집니다. " +
          "그만큼 위쪽을 겨냥해야 해요.");

        bd.n + "의 무게는 " + wgt + " N 입니다. " +
        (heavier

            " N)을 쓰면 같은 속도라도 훨씬 세게 부딪힙니다."
          : "더 많이 당겨 속도를 높이면 부딪히는 세기가 커집니다.") +
        " 돌로 만든 것은 아주 단단해서 넘겨 쏘는 편이 낫습니다.");
    return;
  }

  /* ── 구조물은 부쉈지만 목표는 남았을 때 ── */
  tip("구조물 <b>" + brokeN + "개</b>를 부쉈어요.",
      "쌓인 구조물은 <b>기둥이 무게를 받쳐</b> 힘의 평형을 이루고 있습니다. " +
      "<b>맨 아래 기둥</b>을 무너뜨리면 위쪽이 중력을 받아 통째로 내려앉아요.");
}

function evPos(e) {
  var t = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e;
  var r = cv.getBoundingClientRect();
  if (!r.width) return { x: 0, y: 0 };
  return { x: (t.clientX - r.left) * (W / r.width), y: (t.clientY - r.top) * (H / r.height) };
}
function onDown(e) {
  if (!S || S.flying || S.over || S.waiting || S.used >= S.shots) return;
  e.preventDefault();
  cam.x = 0; cam.t = 0;                     // 조준할 때는 발사대가 보이도록 화면을 되돌린다
  DRAG = { x: evPos(e).x, y: evPos(e).y };  // 화면 아무 곳이나 잡아 당길 수 있다
}
function onMove(e) { if (DRAG) { e.preventDefault(); var p = evPos(e); DRAG.x = p.x; DRAG.y = p.y; } }

  if (!DRAG || !S) { DRAG = null; return; }
  var d = pullVec(); DRAG = null;
  // 발사대 가까이로 되돌리면 쏘지 않는다 → 공을 다시 고를 수 있다
  if (d.len >= 0.55) fire(d);
}
function pullVec() {
  if (!DRAG) return { dx: 0, dy: 0, len: 0 };
  var dx = (sx(SLING.x) - DRAG.x) / PX, dy = (DRAG.y - sy(SLING.y)) / PX;
  var len = Math.sqrt(dx * dx + dy * dy), mp = maxPull();
  if (len > mp) { dx *= mp / len; dy *= mp / len; len = mp; }
  if (dx < 0) dx = 0;
  return { dx: dx, dy: dy, len: len };
}
function fire(d) {
  var bd = BALLS[S.ball], m = ballMass(bd);
  var v = d.len * Math.sqrt(S.k / m);
  var n = Math.max(1e-6, Math.sqrt(d.dx * d.dx + d.dy * d.dy));
  ball = circle(SLING.x, SLING.y, bd.r, bd);
  ball.vx = v * d.dx / n; ball.vy = v * d.dy / n; ball.av = -v * 0.3;
  World.add(ball);
  S.flying = true; S.used++; S.settle = 0; S.flightT = 0;
  S.shot = { maxX: SLING.x, endX: 0, touched: false, floated: false };
  S.beforeStar = stars(); S.beforeBroke = S.broke;
  if (S.trail && S.trail.length > 2) S.lastTrail = S.trail.slice();
  S.trail = [];
  paintHud();
}

function stars() {
  return World.bodies.filter(function (b) { return b.star && !b.st && !b.dead; }).length;
}
function shotDone() {
  S.flying = false;
  diagnose(S.beforeStar - stars(), S.broke - S.beforeBroke);
  if (S.used === 1 && S.pred != null && !S.predShown) {
    S.predShown = true;
    var pv = LV[S.lv].predict;
    var ok = (S.pred === pv.c);
    setTimeout(function () {
      if (!S || S.over) return;
      feed((ok ? "✅ 예측이 맞았어요! " : "❌ 예측과 달랐죠? ") +
           "정답은 <b>" + pv.a[pv.c] + "</b> 입니다.", ok ? "good" : "warn");
    }, 2200);
  }
  if (stars() === 0) { finish(true); return; }
  if (S.used >= S.shots && S.endT < 0) S.endT = 2.5;   // 구조물이 더 무너질 시간을 준다

}

/* ── 그리기 ───────────────────────────────── */
function rr(x, y, w, h, r) {                    // 모서리 둥근 사각형
  var m = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + m, y);
  ctx.lineTo(x + w - m, y); ctx.quadraticCurveTo(x + w, y, x + w, y + m);
  ctx.lineTo(x + w, y + h - m); ctx.quadraticCurveTo(x + w, y + h, x + w - m, y + h);
  ctx.lineTo(x + m, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - m);
  ctx.lineTo(x, y + m); ctx.quadraticCurveTo(x, y, x + m, y);
  ctx.closePath();
}
function rnd(seed) { var v = Math.sin(seed) * 43758.5453; return v - Math.floor(v); }
function shade(hex, amt) {                      // amt>0 밝게, amt<0 어둡게
  var n = parseInt(hex.slice(1), 16);
  var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  function f(v) { return Math.max(0, Math.min(255, Math.round(v + (amt > 0 ? (255 - v) * amt : v * amt)))); }
  return "rgb(" + f(r) + "," + f(g) + "," + f(b) + ")";
}

function drawSky() {

  g.addColorStop(.78, t.sky[2]); g.addColorStop(1, t.sky[3]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, GY + 6);

  sg.addColorStop(0, "rgba(" + t.glow + ",.95)"); sg.addColorStop(1, "rgba(" + t.glow + ",0)");
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(W * .8, 82, 130, 0, 6.3); ctx.fill();
  ctx.fillStyle = t.sun;

/* 언덕 위 나무 */
function trees(off, base, col, step, n) {
  ctx.fillStyle = col;
  for (var i = 0; i < n; i++) {
    var x = ((i * 137 + off) % (W + 160)) - 80;
    var h = 22 + (i % 3) * 9, y = base - Math.sin((x + off) / step) * 14;
    ctx.beginPath();
    ctx.moveTo(x, y); ctx.lineTo(x - h * .38, y); ctx.lineTo(x, y - h);
    ctx.lineTo(x + h * .38, y); ctx.closePath(); ctx.fill();
  }
}
function hills(off, base, amp, col, step) {
  ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(-50, GY + 10);
  for (var x = -50; x <= W + 50; x += 14) {
    var wx = (x + off) / step;
    var y = base - Math.sin(wx) * amp - Math.sin(wx * 2.3) * amp * 0.4;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W + 50, GY + 10); ctx.closePath(); ctx.fill();
}
function drawBg() {
  var t = TH();
  drawSky();
  hills(-cam.x * PX * 0.10, GY - 100, 28, t.hill[0], 130);
  hills(-cam.x * PX * 0.20, GY - 62, 22, t.hill[1], 95);
  trees(-cam.x * PX * 0.20, GY - 58, t.tree, 95, 9);
  hills(-cam.x * PX * 0.34, GY - 26, 16, t.hill[2], 70);
  var cl = [[6, 88, 1], [19, 132, .8], [33, 74, 1.15], [45, 120, .9]];
  ctx.fillStyle = t.cloud;

    ctx.arc(cx + 26 * sc, cy - 8 * sc, 28 * sc, 0, 6.3);
    ctx.arc(cx + 56 * sc, cy + 2 * sc, 20 * sc, 0, 6.3);
    ctx.fill();

/* 바닥 */
function drawGround(L) {
  L.ground.forEach(function (gg) {
    var s = GND[gg.g], x0 = sx(gg.x0), wpx = (gg.x1 - gg.x0) * PX;
    if (x0 + wpx < -20 || x0 > W + 20) return;
    var soil = ctx.createLinearGradient(0, GY, 0, H);
    if (gg.g === "grass") { soil.addColorStop(0, "#3d9a56"); soil.addColorStop(.22, "#2f7a45"); soil.addColorStop(1, "#4a3524"); }
    else if (gg.g === "sand") { soil.addColorStop(0, "#e0bb74"); soil.addColorStop(.25, "#c9a45e"); soil.addColorStop(1, "#7a6035"); }
    else { soil.addColorStop(0, "#bfeaf5"); soil.addColorStop(.22, "#8fd8e8"); soil.addColorStop(1, "#3d7d92"); }
    ctx.fillStyle = soil; ctx.fillRect(x0, GY, wpx, H - GY);
    ctx.fillStyle = "rgba(255,255,255,.14)"; ctx.fillRect(x0, GY, wpx, 3);
    // 잔디 술 / 모래알 / 얼음 결

    for (var i = 0; i < wpx; i += 11) {

      } else if (gg.g === "sand") {

      } else {

        ctx.lineTo(px + 9, GY + 6 + r0 * 10); ctx.stroke();

    ctx.fillStyle = "rgba(0,0,0,.4)"; ctx.font = "700 12px Pretendard,sans-serif";

  });
}

function drawWater(L) {

  var g = ctx.createLinearGradient(0, sy(0), 0, sy(-L.water.d));

  ctx.fillStyle = g; ctx.fillRect(x0, sy(0), wpx, L.water.d * PX);

  for (var wx = L.water.x0; wx <= L.water.x1; wx += .35) {

  }

/* 목표 캐릭터 */
function drawTarget(b, w, h, dmg) {
  var R = Math.min(w, h) * 0.48;
  ctx.fillStyle = "rgba(0,0,0,.25)";
  ctx.beginPath(); ctx.ellipse(2, h * .42, R * .9, R * .28, 0, 0, 6.3); ctx.fill();
  var g = ctx.createRadialGradient(-R * .3, -R * .35, R * .15, 0, 0, R);
  g.addColorStop(0, "#FFE89A");
  g.addColorStop(1, dmg > .5 ? "#C98A10" : "#F5B21C");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, R, 0, 6.3); ctx.fill();
  ctx.strokeStyle = "#8E5F06"; ctx.lineWidth = 2.2; ctx.stroke();
  // 안테나
  ctx.strokeStyle = "#8E5F06"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, -R); ctx.lineTo(0, -R - 7); ctx.stroke();
  ctx.fillStyle = dmg > .5 ? "#FF6B52" : "#7BE04F";
  ctx.beginPath(); ctx.arc(0, -R - 9, 3, 0, 6.3); ctx.fill();
  // 바이저
  ctx.fillStyle = "#26343A";
  rr(-R * .62, -R * .22, R * 1.24, R * .5, R * .22); ctx.fill();
  ctx.fillStyle = dmg > .6 ? "#FF6B52" : "#6FE9FF";
  ctx.beginPath(); ctx.arc(-R * .26, 0, R * .13, 0, 6.3); ctx.fill();
  ctx.beginPath(); ctx.arc(R * .26, 0, R * .13, 0, 6.3); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(-R * .35, -R * .45, R * .3, 3.6, 5.2); ctx.stroke();
  if (dmg > .35) {
    ctx.strokeStyle = "rgba(0,0,0,.5)"; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(-R * .7, R * .2); ctx.lineTo(-R * .2, R * .5);
    ctx.lineTo(-R * .4, R * .75); ctx.stroke();
  }
}

/* 블록 재질 */
function drawBlock(b) {
  var w = b.w * PX, h = b.h * PX, dmg = 1 - Math.max(0, b.hp) / b.hp0;
  ctx.save(); ctx.translate(sx(b.x), sy(b.y)); ctx.rotate(-b.a);
  ctx.fillStyle = "rgba(0,0,0,.22)";
  rr(-w / 2 + 3, -h / 2 + 4, w, h, Math.min(6, w / 3)); ctx.fill();

  if (b.star) { drawTarget(b, w, h, dmg); ctx.restore(); return; }

  var r = Math.min(5, Math.min(w, h) / 3);
  var g;
  if (b.mat === "wood") {
    g = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
    g.addColorStop(0, "#D79E5E"); g.addColorStop(.5, "#C08A4E"); g.addColorStop(1, "#9D6E3A");
  } else if (b.mat === "ice") {
    g = ctx.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2);
    g.addColorStop(0, "rgba(215,247,255,.95)"); g.addColorStop(.5, "rgba(143,216,232,.9)");
    g.addColorStop(1, "rgba(96,175,200,.95)");
  } else if (b.mat === "stone") {
    g = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
    g.addColorStop(0, "#B4BFBD"); g.addColorStop(.55, "#9AA7A5"); g.addColorStop(1, "#788583");
  } else {
    g = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
    g.addColorStop(0, "#5E706D"); g.addColorStop(1, "#333F3D");
  }
  ctx.fillStyle = g; rr(-w / 2, -h / 2, w, h, r); ctx.fill();
  ctx.save(); ctx.clip();
  if (b.mat === "wood") {                                  // 나뭇결
    ctx.strokeStyle = "rgba(110,70,30,.42)"; ctx.lineWidth = 1.3;
    var lon = w > h;
    for (var i = 1; i <= 3; i++) {
      var p = (i / 4 - .5);
      ctx.beginPath();
      if (lon) { ctx.moveTo(-w / 2, p * h); ctx.lineTo(w / 2, p * h + Math.sin(b.seed + i) * 2); }
      else { ctx.moveTo(p * w, -h / 2); ctx.lineTo(p * w + Math.sin(b.seed + i) * 2, h / 2); }
      ctx.stroke();
    }
    ctx.strokeStyle = "rgba(110,70,30,.3)";
    ctx.beginPath();
    ctx.ellipse(lon ? w * .28 : 0, lon ? 0 : h * .28, 3.5, 5, 0, 0, 6.3); ctx.stroke();
  } else if (b.mat === "ice") {                            // 얼음 광택
    ctx.strokeStyle = "rgba(255,255,255,.6)"; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(-w / 2, h * .1); ctx.lineTo(w * .1, -h / 2); ctx.stroke();
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(-w / 2 + 4, h * .42); ctx.lineTo(w * .42, -h / 2 + 4); ctx.stroke();
  } else if (b.mat === "stone" || b.mat === "rock") {      // 돌 알갱이
    for (var q = 0; q < 9; q++) {
      var rx = (rnd(b.seed + q) - .5) * w, ry = (rnd(b.seed + q * 3.1) - .5) * h;
      ctx.fillStyle = "rgba(0,0,0," + (0.1 + rnd(b.seed + q * 7) * 0.14).toFixed(2) + ")";
      ctx.beginPath(); ctx.arc(rx, ry, 1.4 + rnd(b.seed + q * 5) * 2.2, 0, 6.3); ctx.fill();
    }
  }
  if (dmg > 0.18) {                                        // 금
    ctx.strokeStyle = "rgba(0,0,0," + Math.min(.6, dmg).toFixed(2) + ")";
    ctx.lineWidth = 1.6;
    for (var c2 = 0; c2 < 2; c2++) {
      var s0 = b.seed + c2 * 11;
      ctx.beginPath();
      ctx.moveTo((rnd(s0) - .5) * w, -h / 2);
      ctx.lineTo((rnd(s0 + 1) - .5) * w * .6, 0);
      ctx.lineTo((rnd(s0 + 2) - .5) * w, h / 2);
      ctx.stroke();
    }
  }
  ctx.restore();
  ctx.fillStyle = "rgba(255,255,255,.18)";
  rr(-w / 2 + 2, -h / 2 + 2, w - 4, Math.min(4, h / 4), 2); ctx.fill();
  ctx.strokeStyle = b.M.c2; ctx.lineWidth = 2;
  rr(-w / 2, -h / 2, w, h, r); ctx.stroke();
  if (b.flash > 0) {
    ctx.fillStyle = "rgba(255,255,255," + (0.55 * b.flash).toFixed(2) + ")";
    rr(-w / 2, -h / 2, w, h, r); ctx.fill();
  }
  ctx.restore();
}

/* 공 */
function drawBall() {
  var bd = BALLS[S.ball], R = ball.r * PX;
  var cx = sx(ball.x), cy = sy(ball.y);
  var sp0 = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
  if (sp0 > 6) {                                  // 빠를 때 잔상
    var ang = Math.atan2(-ball.vy, ball.vx);
    var st = Math.min(3.2, sp0 / 9);
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(ang);
    var lg = ctx.createLinearGradient(-R * st * 2, 0, 0, 0);
    lg.addColorStop(0, "rgba(255,255,255,0)"); lg.addColorStop(1, "rgba(255,255,255,.5)");
    ctx.fillStyle = lg;
    ctx.beginPath(); ctx.ellipse(-R * st, 0, R * st * 2, R * .78, 0, 0, 6.3); ctx.fill();
    ctx.restore();
  }
  ctx.save(); ctx.translate(cx, cy);
  ctx.fillStyle = "rgba(0,0,0,.25)";
  ctx.beginPath(); ctx.arc(2, 3, R, 0, 6.3); ctx.fill();
  ctx.rotate(-ball.a);
  var g = ctx.createRadialGradient(-R * .34, -R * .36, R * .08, 0, 0, R);
  g.addColorStop(0, shade(bd.c, .55)); g.addColorStop(.45, bd.c);
  g.addColorStop(1, shade(bd.c, -.4));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, R, 0, 6.3); ctx.fill();
  ctx.strokeStyle = shade(bd.c, -.55); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, R, 0, 6.3); ctx.stroke();
  ctx.strokeStyle = shade(bd.c, -.35); ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-R * .55, 0); ctx.lineTo(R * .55, 0); ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,.65)";
  ctx.beginPath(); ctx.ellipse(-R * .34, -R * .38, R * .22, R * .15, -.6, 0, 6.3); ctx.fill();
  ctx.restore();
}

/* 새총 */
function drawSling(front) {
  var bx = sx(SLING.x), by = sy(SLING.y);
  var pull = (DRAG && !S.flying) ? pullVec() : null;
  var px = pull ? bx - pull.dx * PX : bx, py = pull ? by + pull.dy * PX : by - 4;
  if (!front) {
    ctx.strokeStyle = "#5b3d21"; ctx.lineWidth = 11; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(bx, GY + 4); ctx.lineTo(bx, by + 6); ctx.stroke();
    ctx.strokeStyle = "#6b4a2a"; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(bx, by + 8); ctx.lineTo(bx - 15, by - 17); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx, by + 8); ctx.lineTo(bx + 15, by - 17); ctx.stroke();
    ctx.strokeStyle = "#3a2515"; ctx.lineWidth = 5;      // 뒤쪽 고무줄
    ctx.beginPath(); ctx.moveTo(bx + 15, by - 17); ctx.lineTo(px, py); ctx.stroke();
  } else {
    ctx.strokeStyle = "#2b1b0f"; ctx.lineWidth = 5;      // 앞쪽 고무줄
    ctx.beginPath(); ctx.moveTo(bx - 15, by - 17); ctx.lineTo(px, py); ctx.stroke();
  }
}

function draw() {
  if (!ctx) return;
  var L = LV[S.lv];
  ctx.save();
  if (World.shake > 0)
    ctx.translate((Math.random() - .5) * World.shake * 10, (Math.random() - .5) * World.shake * 10);

  drawBg();
  drawWater(L);
  drawGround(L);

  if (L.wind) {
    var dir = L.wind > 0 ? 1 : -1;
    ctx.strokeStyle = "rgba(40,70,85,.45)"; ctx.lineWidth = 2.5; ctx.lineCap = "round";
    for (var i = 0; i < 4; i++) {
      var yy = 60 + i * 26, x0 = 640 + (i % 2) * 34 + (Date.now() / 22 % 60) * dir;
      ctx.beginPath(); ctx.moveTo(x0, yy); ctx.lineTo(x0 + 40 * dir, yy);
      ctx.lineTo(x0 + 30 * dir, yy - 5);
      ctx.moveTo(x0 + 40 * dir, yy); ctx.lineTo(x0 + 30 * dir, yy + 5); ctx.stroke();
    }
    ctx.fillStyle = "rgba(30,60,75,.75)"; ctx.font = "700 13px Pretendard,sans-serif";
    ctx.fillText("바람 " + (dir > 0 ? "→" : "←"), 640, 42);
  }

  World.bodies.forEach(function (b) {
    if (b.dead || b.kind !== "poly" || b.gnd) return;
    var px2 = sx(b.x);
    if (px2 < -80 || px2 > W + 80) return;
    drawBlock(b);
  });

  World.debris.forEach(function (d) {
    ctx.save(); ctx.translate(sx(d.x), sy(d.y)); ctx.rotate(d.a);
    ctx.globalAlpha = Math.max(0, Math.min(1, d.life));
    ctx.fillStyle = d.c;
    rr(-d.s * PX / 2, -d.s * PX / 2, d.s * PX, d.s * PX, 2); ctx.fill();
    ctx.restore(); ctx.globalAlpha = 1;
  });
  World.rings.forEach(function (rg) {
    ctx.strokeStyle = "rgba(255,255,255," + (0.6 * (1 - rg.t)).toFixed(2) + ")";
    ctx.lineWidth = 3 * (1 - rg.t) + 1;
    ctx.beginPath(); ctx.arc(sx(rg.x), sy(rg.y), 8 + rg.t * 60, 0, 6.3); ctx.stroke();
  });
  World.parts.forEach(function (p) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2));
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(sx(p.x), sy(p.y), 2.8, 0, 6.3); ctx.fill();
  });
  ctx.globalAlpha = 1;

  drawSling(false);

  if (S.flying) {
    ctx.save();
    ctx.font = "700 12px Pretendard,sans-serif"; ctx.textAlign = "center";
    ctx.fillStyle = "rgba(255,255,255,.85)";
    rr(sx(SLING.x) - 42, sy(SLING.y) - 52, 84, 20, 10); ctx.fill();
    ctx.fillStyle = "#3E4F58"; ctx.fillText("날아가는 중…", sx(SLING.x), sy(SLING.y) - 38);
    ctx.restore(); ctx.textAlign = "left";
  }
  if (!S.flying && !DRAG && S.used < S.shots) {      // 다음에 쏠 공을 새총에 얹어 둔다
    var rb = BALLS[S.ball], RR2 = rb.r * PX;
    var bx0 = sx(SLING.x), by0 = sy(SLING.y) - 4;
    ctx.save(); ctx.translate(bx0, by0);
    var g0 = ctx.createRadialGradient(-RR2 * .34, -RR2 * .36, RR2 * .08, 0, 0, RR2);
    g0.addColorStop(0, shade(rb.c, .55)); g0.addColorStop(.45, rb.c);
    g0.addColorStop(1, shade(rb.c, -.4));
    ctx.fillStyle = g0; ctx.beginPath(); ctx.arc(0, 0, RR2, 0, 6.3); ctx.fill();
    ctx.strokeStyle = shade(rb.c, -.55); ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
  }

  // 지난 발사의 궤적을 옅게 남겨 비교할 수 있게 한다
  if (S.lastTrail && S.lastTrail.length > 2) {
    ctx.save(); ctx.setLineDash([5, 7]); ctx.lineWidth = 2;
    ctx.strokeStyle = "rgba(255,255,255,.5)";
    ctx.beginPath();
    ctx.moveTo(sx(S.lastTrail[0].x), sy(S.lastTrail[0].y));
    for (var q0 = 1; q0 < S.lastTrail.length; q0++)
      ctx.lineTo(sx(S.lastTrail[q0].x), sy(S.lastTrail[q0].y));
    ctx.stroke(); ctx.restore();
  }
  // 지금 날아가는 공의 빛나는 꼬리
  if (S.trail.length > 1) {
    var bc = BALLS[S.ball].c, n0 = S.trail.length;
    ctx.save(); ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.strokeStyle = "rgba(255,255,255,.28)"; ctx.lineWidth = 13;
    ctx.beginPath(); ctx.moveTo(sx(S.trail[0].x), sy(S.trail[0].y));
    for (var q1 = 1; q1 < n0; q1++) ctx.lineTo(sx(S.trail[q1].x), sy(S.trail[q1].y));
    ctx.stroke();
    for (var q2 = 1; q2 < n0; q2++) {
      var tt = q2 / n0;
      ctx.strokeStyle = "rgba(255,255,255," + (0.15 + 0.75 * tt).toFixed(2) + ")";
      ctx.lineWidth = 1.5 + 6 * tt;
      ctx.beginPath();
      ctx.moveTo(sx(S.trail[q2 - 1].x), sy(S.trail[q2 - 1].y));
      ctx.lineTo(sx(S.trail[q2].x), sy(S.trail[q2].y));
      ctx.stroke();
    }
    ctx.strokeStyle = bc; ctx.globalAlpha = .75; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(sx(S.trail[0].x), sy(S.trail[0].y));
    for (var q3 = 1; q3 < n0; q3++) ctx.lineTo(sx(S.trail[q3].x), sy(S.trail[q3].y));
    ctx.stroke(); ctx.globalAlpha = 1;
    // 일정 간격마다 발자국 표시 (시간 간격이 같아 속도 변화가 보인다)
    for (var q4 = n0 - 1; q4 >= 0; q4 -= 8) {
      ctx.fillStyle = "rgba(255,255,255,.9)";
      ctx.beginPath(); ctx.arc(sx(S.trail[q4].x), sy(S.trail[q4].y), 3.2, 0, 6.3); ctx.fill();
      ctx.fillStyle = bc;
      ctx.beginPath(); ctx.arc(sx(S.trail[q4].x), sy(S.trail[q4].y), 1.7, 0, 6.3); ctx.fill();
    }
    ctx.restore();
  }

  if (DRAG && !S.flying) {
    var d2 = pullVec(), bd = BALLS[S.ball];
    var bx = sx(SLING.x), by = sy(SLING.y);
    var px3 = bx - d2.dx * PX, py3 = by + d2.dy * PX;
    ctx.save(); ctx.translate(px3, py3);
    var RR = bd.r * PX;
    var gg = ctx.createRadialGradient(-RR * .34, -RR * .36, RR * .08, 0, 0, RR);
    gg.addColorStop(0, shade(bd.c, .55)); gg.addColorStop(.45, bd.c);
    gg.addColorStop(1, shade(bd.c, -.4));
    ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(0, 0, RR, 0, 6.3); ctx.fill();
    ctx.strokeStyle = shade(bd.c, -.55); ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
    if (d2.len < 0.55) {                                   // 취소 구간
      ctx.save();
      ctx.font = "700 12px Pretendard,sans-serif"; ctx.textAlign = "center";
      ctx.fillStyle = "rgba(255,255,255,.9)";
      rr(bx - 76, by - 62, 152, 22, 11); ctx.fill();
      ctx.fillStyle = "#C25A20";
      ctx.fillText("여기서 놓으면 취소 (공 바꾸기)", bx, by - 47);
      ctx.restore(); ctx.textAlign = "left";
    } else {
      arrow(px3, py3, d2.dx * 17, -d2.dy * 17, "#FFC53D", 3.5);
      preview(d2);
    }
  }

  if (ball && !ball.dead) { drawBall(); drawForces(sx(ball.x), sy(ball.y)); }
  drawSling(true);

  // 가장자리 어둡게
  var vg = ctx.createRadialGradient(W / 2, H / 2, H * .55, W / 2, H / 2, H * 1.05);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(10,30,40,.22)");
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

function arrow(x, y, dx, dy, col, w) {
  var len = Math.sqrt(dx * dx + dy * dy);
  if (len < 4) return;
  if (len > 150) { dx *= 150 / len; dy *= 150 / len; }
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,.5)"; ctx.shadowBlur = 4;
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = w || 3; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + dx, y + dy); ctx.stroke();
  var a = Math.atan2(dy, dx);
  ctx.beginPath(); ctx.moveTo(x + dx, y + dy);
  ctx.lineTo(x + dx - 11 * Math.cos(a - .4), y + dy - 11 * Math.sin(a - .4));
  ctx.lineTo(x + dx - 11 * Math.cos(a + .4), y + dy - 11 * Math.sin(a + .4));
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
function fscale() { return 42 / ((ball ? ball.mass : 50) * G); }
function tag(x, y, dx, dy, col, txt, xo) {
  var len = Math.sqrt(dx * dx + dy * dy);
  if (len < 26) return;
  var k = Math.min(1, 150 / len);
  var tx2 = x + dx * k + (xo || 0), ty2 = y + dy * k;
  ctx.save();
  ctx.font = "700 11px Pretendard,sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  var w = ctx.measureText(txt).width + 10;
  ctx.fillStyle = "rgba(255,255,255,.88)";
  rr(tx2 - w / 2, ty2 - 8 + (dy > 0 ? 14 : -14), w, 16, 8); ctx.fill();
  ctx.fillStyle = col;
  ctx.fillText(txt, tx2, ty2 + (dy > 0 ? 14 : -14));
  ctx.restore();
}
function drawForces(cx, cy) {
  var F = ball.F || {}, s = fscale();
  var gdy = -(F.g || 0) * s;
  arrow(cx, cy, 0, gdy, "#FF8A56", 3);  tag(cx, cy, 0, gdy, "#C25A20", "중력", -28);
  if (F.b > 1) { arrow(cx, cy, 0, -F.b * s, "#2AA7BC", 3); tag(cx, cy, 0, -F.b * s, "#1B7D8E", "부력", -28); }
  if (Math.abs(F.w || 0) > 1) { arrow(cx, cy, F.w * s, 0, "#5B6E78", 2.5); tag(cx, cy, F.w * s, 0, "#3E4F58", "바람", 0); }
  if (Math.abs(F.airx || 0) > 1 || Math.abs(F.airy || 0) > 1)
    arrow(cx, cy, F.airx * s, -F.airy * s, "#9B6BE0", 2.5);
  if (Math.abs(F.wd || 0) > 1) arrow(cx, cy, F.wd * s, 0, "#2AA7BC", 2.5);
}
function groundY(x) {
  var L = LV[S.lv];
  if (L.water && x > L.water.x0 && x < L.water.x1) return -L.water.d;
  return 0;
}
function preview(d) {
  var bd = BALLS[S.ball], L = LV[S.lv], m = ballMass(bd);
  var v = d.len * Math.sqrt(S.k / m);
  var n = Math.max(1e-6, Math.sqrt(d.dx * d.dx + d.dy * d.dy));
  var x = SLING.x, y = SLING.y, vx = v * d.dx / n, vy = v * d.dy / n;
  var area = 2 * bd.r * D;
  // 예상 경로는 처음 일부만 보여 준다 — 나머지는 스스로 예측해야 한다
  for (var i = 0; i < 26; i++) {
    var dt = 0.035, sp = Math.sqrt(vx * vx + vy * vy);
    var fa = L.air ? 0.5 * RHO_A * 0.9 * area * sp : 0;
    vx += ((L.wind || 0) * area * 12 - fa * vx) / m * dt;
    vy += (-m * G - fa * vy) / m * dt;
    x += vx * dt; y += vy * dt;
    if (y < groundY(x) || x > 50) break;
    if (i % 3 === 0) {
      var al = Math.max(0.15, 0.95 - i / 26);
      var rr2 = 4.2 - i / 12;
      ctx.fillStyle = "rgba(255,255,255," + (al * 0.85).toFixed(2) + ")";
      ctx.beginPath(); ctx.arc(sx(x), sy(y), rr2 + 1.6, 0, 6.3); ctx.fill();
      ctx.fillStyle = "rgba(255,170,40," + al.toFixed(2) + ")";
      ctx.beginPath(); ctx.arc(sx(x), sy(y), rr2, 0, 6.3); ctx.fill();
    }
  }
}

/* ── 패널 ─────────────────────────────────── */
function paintHud() {
  if (!root || !S) return;
  $("fLv").textContent = S.lv + 1;
  $("fShot").textContent = Math.max(0, S.shots - S.used);
  $("fHit").textContent = S.hit + " / " + S.need;
  $("fBroke").textContent = S.broke;
  $("fScore").textContent = S.score;
  var t = $("fTime"), L0 = LV[S.lv];
  var left = Math.max(0, S.time), frac = Math.max(0, Math.min(1, left / L0.time));
  $("fTimeN").textContent = Math.ceil(left);
  t.style.setProperty("--p", frac.toFixed(3));
  t.style.setProperty("--tc", left <= 15 ? "#FF4D6A" : (left <= 30 ? "#FFC53D" : "#7BE04F"));
  t.className = "ftimer" + (left <= 15 ? " warn" : "");
  var sh = "";
  for (var i = 0; i < S.shots; i++) sh += '<i class="' + (i < S.used ? "used" : "") + '"></i>';
  $("fShots").innerHTML = sh;
}
function paintForces() {
  if (!root || !S) return;
  var bd = BALLS[S.ball], m = ballMass(bd), rows = [];
  var unit = m * G;                                   // 이 공의 무게를 기준 길이로 삼는다
  if (ball && !ball.dead && S.flying) {
    var F = ball.F || {};
    rows.push(["중력", "#FF8A56", Math.abs(F.g || 0) / unit, "아래로"]);
    if (F.b > unit * 0.05) rows.push(["부력", "#2AA7BC", F.b / unit, "위로"]);
    if (Math.abs(F.wd || 0) > unit * 0.05) rows.push(["물의 저항", "#4FD1E0", Math.abs(F.wd) / unit, "반대로"]);
    if (Math.abs(F.w || 0) > unit * 0.05) rows.push(["바람", "#5B6E78", Math.abs(F.w) / unit, "옆으로"]);
    if (Math.abs(F.airx || 0) > unit * 0.05) rows.push(["공기의 저항", "#9B6BE0", Math.abs(F.airx) / unit, "반대로"]);
  } else {
    var d = pullVec(), mp = Math.max(0.01, maxPull());
    rows.push(["탄성력", "#FFC53D", d.len / MAXPULL * 1.6, "당긴 만큼"]);
    rows.push(["중력(무게)", "#FF8A56", 1, "아래로"]);
    $("fPull").style.width = (d.len / mp * 100) + "%";
  }
  $("fForces").innerHTML = rows.map(function (r) {
    var w = Math.max(4, Math.min(100, r[2] * 55));
    return '<div class="frow"><span class="fn">' + r[0] + '</span>' +
      '<span class="fbar"><i style="width:' + w.toFixed(0) + '%;background:' + r[1] + '"></i></span>' +
      '<span class="fdir">' + r[3] + '</span></div>';
  }).join("");
  var eqOn = false;
  if (ball && !ball.dead && S.flying) {
    var F2 = ball.F || {};
    var ny = (F2.g || 0) + (F2.b || 0);
    eqOn = Math.abs(ny) < unit * 0.08 && (F2.b || 0) > unit * 0.3;
  }
  $("fEq").style.display = eqOn ? "" : "none";
}

/* ── 종료 ─────────────────────────────────── */
/* 단계를 깨면 개념을 한 번 확인한다 */
function showQuiz() {
  var L = LV[S.lv], q = L.quiz;
  App.overlay('<h2>개념 확인</h2>' +
    '<p>단계를 깼어요! 배운 내용을 확인해 볼까요?</p>' +
    '<div class="quizq">' + q.q + '</div>' +
    '<div class="quizbtns">' + q.a.map(function (t, i) {
      return '<button class="quizb" data-i="' + i + '">' + t + '</button>';
    }).join("") + '</div>' +
    '<div class="quizwhy" id="qWhy"></div>');
  Array.prototype.forEach.call(document.querySelectorAll(".quizb"), function (b) {
    b.onclick = function () {
      var ok = (+b.dataset.i === q.c);
      S.quizDone = true; S.quizOK = ok;
      if (ok) S.score += 300;
      Array.prototype.forEach.call(document.querySelectorAll(".quizb"), function (x) {
        x.disabled = true;
        if (+x.dataset.i === q.c) x.className = "quizb right";
      });
      if (!ok) b.className = "quizb wrong";
      var w = document.getElementById("qWhy");
      w.innerHTML = (ok ? '<b style="color:var(--leaf)">정답이에요! +300점</b><br>' 
                        : '<b style="color:var(--alert)">아쉬워요.</b><br>') + L.learn +
        '<div class="btns" style="justify-content:center">' +
        '<button class="primary" id="qNext">결과 보기</button></div>';
      document.getElementById("qNext").onclick = function () {
        App.closeOverlay();
        S.over = false;                // 결과 화면을 그리기 위해 잠시 해제
        finish(true);
      };
    };
  });
}

function finish(win) {
  if (!S || S.over) return;
  var Lq = LV[S.lv];
  if (win && Lq.quiz && !S.quizDone) {
    S.flying = false;
    S.over = true;                     // 루프를 멈춰 창이 다시 그려지지 않게 한다
    showQuiz();
    return;
  }
  S.over = true; S.flying = false;
  var timeB = win ? Math.round(Math.max(0, S.time) * 8) : 0;
  var shotB = win ? Math.max(0, S.shots - S.used) * 200 : 0;
  var score = S.score + timeB + shotB + (win ? 800 : 0);
  var isLast = (S.lv === LV.length - 1), lv = S.lv;

  App.overlay(
    '<h2>' + (win ? (isLast ? "모든 단계 완료!" : (lv + 1) + "단계 성공") : (lv + 1) + "단계 실패") + '</h2>' +
    '<p>' + (win
      ? (isLast ? "중력·탄성력·마찰력·부력을 모두 다뤘습니다. 힘은 화살표로 나타내고, 힘이 물체의 움직임을 바꿉니다."
                : "다음 단계는 구조물이 더 튼튼하고 시간도 짧아집니다.")
      : (S.time <= 0 ? "시간이 끝났어요. 아래 기둥을 노리면 위가 통째로 무너집니다."
                     : "발사를 다 썼어요. 공과 고무줄 세기를 바꿔 보세요.")) + '</p>' +
    '<div class="res">' +
      '<div><span>목표</span><b>' + S.hit + ' / ' + S.need + '</b></div>' +
      '<div><span>부순 블록</span><b>' + S.broke + '</b></div>' +
      '<div><span>점수</span><b>' + score + '</b></div>' +
    '</div>' +
    (S.quizDone ? '<div class="res" style="grid-template-columns:1fr">' +
      '<div><span>개념 확인</span><b>' + (S.quizOK ? "정답 +300" : "다시 보기") + '</b></div></div>' : '') +
    '<div class="learnbox">📘 <b>이 단계에서 배운 것</b><br>' + LV[lv].learn + '</div>' +
    '<div class="msg" id="fSv">점수를 저장하는 중…</div><div id="fRk"></div>' +
    '<div class="btns"><button class="primary" id="fNx">' +
      (win ? (isLast ? "처음부터 다시" : (lv + 2) + "단계 시작") : "다시 도전") + '</button>' +
    '<button id="fHome">대시보드로</button></div>');

  var nx = document.getElementById("fNx");
  if (nx) nx.onclick = function () { App.closeOverlay(); startLevel(win ? (isLast ? 0 : lv + 1) : lv); };
  var hm = document.getElementById("fHome");
  if (hm) hm.onclick = function () { App.closeOverlay(); App.goHome(); };

  App.submitAndRank(GAME_ID,
    { level: lv + 1, score: score, d1: S.hit, d2: S.need, cleared: win },
    document.getElementById("fSv"), document.getElementById("fRk"), lv + 1);
}

/* ── 루프 ─────────────────────────────────── */
function loop(now) {
  raf = requestAnimationFrame(loop);
  if (!last) last = now;
  var dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!S || S.over) return;
  try {
    if (!S.waiting) {
      S.time -= dt;
      accT += dt;
      var fixed = 1 / 120, guard = 0;
      while (accT >= fixed && guard < 8) { World.step(fixed); accT -= fixed; guard++; }
      if (accT > 0.2) accT = 0;

      // 화면이 공을 부드럽게 따라간다
      var vw = viewW(), lim = Math.max(0, 50 - vw);
      cam.t = (S.flying && ball && !ball.dead)
        ? Math.max(0, Math.min(lim, ball.x - vw * 0.42)) : 0;
      cam.x += (cam.t - cam.x) * Math.min(1, dt * 3.2);

      if (S.flying) {
        S.flightT += dt;
        if (!ball || ball.dead || S.flightT > 5) {
          // 공이 화면 밖으로 나갔거나 너무 오래 굴러도 다음 발사를 준비한다
          if (ball) ball.dead = true;
          shotDone();
        } else if (ball.x > 51 || ball.y < -16) {
          if (S.shot) { S.shot.endX = ball.x; if (ball.x > S.shot.maxX) S.shot.maxX = ball.x; }
          ball.dead = true; shotDone();          // 장외로 나가면 곧바로 다음 발사
        } else {
          S.trail.push({ x: ball.x, y: ball.y });
          if (S.trail.length > 300) S.trail.shift();
          var sp = Math.abs(ball.vx) + Math.abs(ball.vy);
          if (sp < 2.0 || ball.sleep > 0.5) S.settle += dt; else S.settle = 0;
          if (S.settle > 0.5) { ball.dead = true; shotDone(); }   // 곧바로 다음 발사 준비
        }
      }
      if (stars() === 0) finish(true);
      else if (S.time <= 0) finish(false);
      else if (S.endT > 0) { S.endT -= dt; if (S.endT <= 0) finish(false); }
    }
    draw();
    hudT += dt;
    if (hudT > 0.1) { hudT = 0; paintForces(); paintHud(); }
    errN = 0;
  } catch (e) {
    errN++;
    if (errN > 40 && S) {
      S.over = true;
      try {
        App.overlay('<h2>게임이 멈췄어요</h2><p>단계를 다시 시작해 주세요.</p>' +
          '<div class="btns"><button class="primary" id="fEr">단계 다시하기</button>' +
          '<button id="fEh">대시보드로</button></div>');
        document.getElementById("fEr").onclick = function () { App.closeOverlay(); startLevel(S ? S.lv : 0); };
        document.getElementById("fEh").onclick = function () { App.closeOverlay(); App.goHome(); };
      } catch (e2) {}
    }
  }
}

App.registerGame({
  id: GAME_ID, mount: mount,
  start: function () { startLevel(0); },
  stop: function () { S = null; DRAG = null; ball = null; World.clear(); }
});

})();
</script>
